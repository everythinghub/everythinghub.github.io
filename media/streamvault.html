<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StreamVault</title>

<!-- Apple/PWA meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamVault">
<meta name="theme-color" content="#000000">

<!-- Apple touch icons (inline SVG as data URI) -->
<link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23000'/%3E%3Ctext x='90' y='125' text-anchor='middle' font-size='100' font-family='SF Pro Display, -apple-system, sans-serif'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='20'%3E🎬%3C/text%3E%3C/svg%3E">

<style>
  /* ── TOKENS ── */
  :root {
    --bg:          #0a0a0a;
    --surface:     #141414;
    --surface2:    #1c1c1e;
    --surface3:    #242428;
    --border:      rgba(255,255,255,0.08);
    --text:        #f5f5f7;
    --text-muted:  #8e8e93;
    --text-dim:    #48484a;
    --accent:      #e50914;
    --accent2:     #ff375f;
    --gold:        #ffd60a;
    --radius-sm:   8px;
    --radius:      12px;
    --radius-lg:   20px;
    --transition:  0.2s cubic-bezier(0.4,0,0.2,1);
    --blur:        saturate(180%) blur(20px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  img { display: block; object-fit: cover; }
  button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
  a { color: inherit; text-decoration: none; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

  /* ── HEADER / NAV ── */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    height: 60px;
    background: rgba(10,10,10,0.85);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--border);
    transition: background var(--transition);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .nav-logo span { color: var(--accent); }
  .nav-logo svg { width: 28px; height: 28px; }

  .nav-tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .nav-tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
    transition: all var(--transition);
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active {
    background: var(--surface2);
    color: var(--text);
  }

  .nav-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    flex-shrink: 0;
    transition: all var(--transition);
  }
  .nav-search:focus-within {
    border-color: rgba(255,255,255,0.2);
    background: var(--surface3);
  }
  .nav-search svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
  .nav-search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    width: 180px;
    font-family: inherit;
  }
  .nav-search input::placeholder { color: var(--text-muted); }

  /* ── MAIN CONTENT ── */
  .main { padding-top: 60px; }

  /* ── HERO ── */
  .hero {
    position: relative;
    height: 540px;
    overflow: hidden;
    cursor: pointer;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.45);
    transition: transform 0.6s ease;
  }
  .hero:hover .hero-bg { transform: scale(1.02); }
  .hero-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(10,10,10,0.9) 0%,
      rgba(10,10,10,0.5) 50%,
      transparent 100%
    ), linear-gradient(
      to top,
      rgba(10,10,10,0.8) 0%,
      transparent 50%
    );
  }
  .hero-content {
    position: absolute;
    bottom: 60px;
    left: 48px;
    max-width: 520px;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .hero-title {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 12px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .hero-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--gold);
    font-weight: 600;
  }
  .hero-overview {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(245,245,247,0.8);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .hero-actions {
    display: flex;
    gap: 12px;
  }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    transition: all var(--transition);
    letter-spacing: -0.2px;
  }
  .btn-primary {
    background: white;
    color: black;
  }
  .btn-primary:hover {
    background: rgba(255,255,255,0.85);
    transform: scale(1.02);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.12);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.18);
    transform: scale(1.02);
  }
  .btn svg { width: 18px; height: 18px; }
  .btn-sm {
    padding: 8px 18px;
    font-size: 13px;
    border-radius: 50px;
  }

  /* ── SECTION ROWS ── */
  .section {
    padding: 0 24px 40px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-top: 8px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .section-more {
    font-size: 14px;
    color: var(--accent);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .section-more:hover { color: var(--accent2); }

  /* ── CARDS SCROLL ROW ── */
  .cards-row {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 8px;
    scroll-snap-type: x mandatory;
  }
  .cards-row::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 160px;
    scroll-snap-align: start;
    cursor: pointer;
    group: true;
  }
  .card-wide { flex: 0 0 240px; }
  .card-poster {
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface2);
    position: relative;
    transition: transform var(--transition);
    border: 1px solid var(--border);
  }
  .card:hover .card-poster {
    transform: scale(1.04);
    border-color: rgba(255,255,255,0.15);
  }
  .card-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity var(--transition);
  }
  .card-poster-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
    opacity: 0;
    transition: opacity var(--transition);
    display: flex;
    align-items: flex-end;
    padding: 12px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-play-btn {
    width: 36px; height: 36px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .card-play-btn svg { width: 16px; height: 16px; color: black; margin-left: 2px; }
  .card-rating {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .card-info { padding: 10px 2px 0; }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Backdrop cards for "Continue Watching" style */
  .card-backdrop {
    flex: 0 0 280px;
    scroll-snap-align: start;
    cursor: pointer;
  }
  .card-backdrop .card-poster {
    aspect-ratio: 16/9;
  }

  /* ── GENRE PILLS ── */
  .genre-pills {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin-bottom: 32px;
    padding: 0 24px 8px;
  }
  .genre-pills::-webkit-scrollbar { display: none; }
  .genre-pill {
    flex-shrink: 0;
    padding: 8px 18px;
    border-radius: 50px;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface);
    transition: all var(--transition);
    cursor: pointer;
  }
  .genre-pill:hover, .genre-pill.active {
    background: white;
    color: black;
    border-color: white;
  }

  /* ── MODAL / PLAYER ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 960px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
    animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    margin: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: black;
  }
  .player-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  .player-loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: black;
    font-size: 14px;
    color: var(--text-muted);
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--surface3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-info {
    padding: 28px 32px;
    display: flex;
    gap: 24px;
  }
  .modal-poster {
    flex-shrink: 0;
    width: 120px;
    height: 180px;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface2);
  }
  .modal-poster img { width: 100%; height: 100%; object-fit: cover; }
  .modal-details { flex: 1; min-width: 0; }
  .modal-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .modal-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .modal-meta .dot { color: var(--text-dim); }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .tag-red { background: rgba(229,9,20,0.15); border-color: rgba(229,9,20,0.3); color: #ff6b6b; }
  .modal-overview {
    font-size: 14px;
    line-height: 1.7;
    color: rgba(245,245,247,0.75);
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    z-index: 10;
    transition: background var(--transition);
  }
  .modal-close:hover { background: rgba(255,255,255,0.15); }
  .player-wrap { position: relative; }

  /* TV Season/Episode Picker */
  .episode-picker {
    padding: 0 32px 28px;
    border-top: 1px solid var(--border);
  }
  .season-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 20px 0 16px;
  }
  .season-tabs::-webkit-scrollbar { display: none; }
  .season-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: var(--surface);
    transition: all var(--transition);
    cursor: pointer;
  }
  .season-tab.active, .season-tab:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
  }
  .ep-btn {
    aspect-ratio: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    cursor: pointer;
  }
  .ep-btn.active, .ep-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .server-picker {
    margin: 0 32px 28px;
    padding: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .server-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .server-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .server-btn {
    padding: 6px 14px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition);
  }
  .server-btn.active, .server-btn:hover {
    background: white;
    color: black;
    border-color: white;
  }

  /* ── SEARCH RESULTS PAGE ── */
  .search-page {
    padding: 80px 24px 40px;
    display: none;
  }
  .search-page.visible { display: block; }
  .search-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .search-empty {
    text-align: center;
    padding: 80px 0;
    color: var(--text-muted);
  }
  .search-empty .icon { font-size: 60px; margin-bottom: 16px; }
  .search-empty h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

  /* ── LOADING SKELETON ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius);
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ── HOME PAGE ── */
  #home-page { display: block; }
  #home-page.hidden { display: none; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface3);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .nav { padding: 0 16px; }
    .nav-search input { width: 120px; }
    .hero-content { left: 20px; right: 20px; bottom: 40px; }
    .hero { height: 420px; }
    .section { padding: 0 16px 32px; }
    .genre-pills { padding: 0 16px 8px; }
    .modal-info { flex-direction: column; }
    .modal-poster { width: 80px; height: 120px; }
    .modal-info { padding: 20px; }
    .episode-picker { padding: 0 20px 20px; }
    .server-picker { margin: 0 20px 20px; }
  }
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="nav">
  <div class="nav-logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="8" fill="#E50914"/>
      <path d="M7 8h2.5l2 4 2-4H16v12h-2.5v-7.5l-2 4-2-4V20H7V8z" fill="white"/>
      <circle cx="20" cy="14" r="3.5" fill="white"/>
    </svg>
    Stream<span>Vault</span>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('movies')">Movies</button>
    <button class="nav-tab" onclick="switchTab('tv')">TV Shows</button>
    <button class="nav-tab" onclick="switchTab('trending')">Trending</button>
    <button class="nav-tab" onclick="switchTab('toprated')">Top Rated</button>
  </div>

  <div class="nav-search">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    <input type="text" id="searchInput" placeholder="Search movies, shows…" oninput="handleSearch(this.value)" autocomplete="off">
  </div>
</nav>

<!-- ── MAIN ── -->
<main class="main">

  <!-- HOME -->
  <div id="home-page">

    <!-- HERO -->
    <section class="hero" id="heroSection" onclick="openFromHero()">
      <img class="hero-bg" id="heroBg" src="" alt="Featured">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-badge">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
          Now Trending
        </div>
        <h1 class="hero-title" id="heroTitle">Loading…</h1>
        <div class="hero-meta">
          <span class="hero-rating">

<script>
// ── CONFIG ──
// Free TMDB read-only API key (public demo key from TMDB docs examples)
const TMDB_KEY = '4e44d9029b1270a757cddc766a1bcb63';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE  = 'https://image.tmdb.org/t/p/';

// Stream providers (no key needed — just TMDB ID in URL)
const SERVERS = {
  movie: [
    { label: 'Server 1',  url: (id) => `https://vidsrc.xyz/embed/movie?tmdb=${id}` },
    { label: 'Server 2',  url: (id) => `https://www.2embed.cc/embed/${id}` },
    { label: 'Server 3',  url: (id) => `https://multiembed.mov/?video_id=${id}&tmdb=1` },
  ],
  tv: [
    { label: 'Server 1',  url: (id, s, e) => `https://vidsrc.xyz/embed/tv?tmdb=${id}&season=${s}&episode=${e}` },
    { label: 'Server 2',  url: (id, s, e) => `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}` },
    { label: 'Server 3',  url: (id, s, e) => `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}` },
  ]
};

// ── STATE ──
let currentItem   = null;
let currentType   = 'movie';
let currentSeason = 1;
let currentEp     = 1;
let currentServer = 0;
let heroItem      = null;
let genreMap      = {};
let searchTimer   = null;

// ── FETCH WRAPPER ──
async function tmdb(path, params = {}) {
  const url = new URL(`${TMDB_BASE}${path}`);
  url.searchParams.set('api_key', TMDB_KEY);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  return res.json();
}

// ── INIT ──
async function init() {
  // Load genre maps
  const [mg, tg] = await Promise.all([
    tmdb('/genre/movie/list'),
    tmdb('/genre/tv/list')
  ]);
  [...mg.genres, ...tg.genres].forEach(g => genreMap[g.id] = g.name);

  // Render genre pills
  const pills = document.getElementById('genrePills');
  const allGenres = [
    {id:28,name:'Action'},{id:35,name:'Comedy'},{id:18,name:'Drama'},
    {id:27,name:'Horror'},{id:878,name:'Sci-Fi'},{id:10749,name:'Romance'},
    {id:53,name:'Thriller'},{id:16,name:'Animation'},{id:80,name:'Crime'},
    {id:12,name:'Adventure'},{id:10765,name:'Fantasy'},{id:99,name:'Documentary'}
  ];
  pills.innerHTML = allGenres.map(g =>
    `<button class="genre-pill" onclick="browseGenre(${g.id},'${g.name}')">${g.name}</button>`
  ).join('');

  // Load content concurrently
  await Promise.all([
    loadTrending(),
    loadPopularMovies(),
    loadPopularTV(),
    loadTopRated(),
    loadTopTV(),
  ]);
}

// ── TRENDING (hero + row) ──
async function loadTrending() {
  const data = await tmdb('/trending/all/week');
  const items = data.results.slice(0, 20);

  // Hero = first item
  heroItem = items[0];
  renderHero(heroItem);

  // Row
  renderRow('trendingRow', items, true);
}

function renderHero(item) {
  const isMovie = item.media_type === 'movie' || !item.name;
  const title   = item.title || item.name;
  const year    = (item.release_date || item.first_air_date || '').slice(0,4);
  const genres  = (item.genre_ids || []).map(id => genreMap[id]).filter(Boolean).slice(0,1);

  document.getElementById('heroBg').src     = item.backdrop_path ? `${IMG_BASE}original${item.backdrop_path}` : '';
  document.getElementById('heroTitle').textContent    = title;
  document.getElementById('heroRating').textContent   = item.vote_average?.toFixed(1) || '—';
  document.getElementById('heroYear').textContent     = year;
  document.getElementById('heroGenre').textContent    = genres[0] || (isMovie ? 'Movie' : 'TV Show');
  document.getElementById('heroOverview').textContent = item.overview;

  heroItem = item;
}

function openFromHero() {
  if (!heroItem) return;
  const type = heroItem.media_type === 'tv' ? 'tv' : 'movie';
  openModal({...heroItem, media_type: type}, type);
}
function openHeroDetails() {
  if (!heroItem) return;
  const type = heroItem.media_type === 'tv' ? 'tv' : 'movie';
  openModal({...heroItem, media_type: type}, type, false);
}

// ── ROW LOADERS ──
async function loadPopularMovies() {
  const data = await tmdb('/movie/popular');
  renderRow('moviesRow', data.results.map(m => ({...m, media_type:'movie'})));
}
async function loadPopularTV() {
  const data = await tmdb('/tv/popular');
  renderRow('tvRow', data.results.map(t => ({...t, media_type:'tv'})));
}
async function loadTopRated() {
  const data = await tmdb('/movie/top_rated');
  renderRow('topRatedRow', data.results.map(m => ({...m, media_type:'movie'})));
}
async function loadTopTV() {
  const data = await tmdb('/tv/top_rated');
  renderRow('topTvRow', data.results.map(t => ({...t, media_type:'tv'})));
}

// ── RENDER ROW ──
function renderRow(containerId, items, showType = false) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = items.slice(0, 20).map(item => cardHTML(item, showType)).join('');
}

function cardHTML(item, showType = false) {
  const isMovie  = item.media_type === 'movie' || item.title;
  const title    = item.title || item.name || '—';
  const poster   = item.poster_path ? `${IMG_BASE}w342${item.poster_path}` : null;
  const year     = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating   = item.vote_average?.toFixed(1);
  const typeLabel = showType ? (isMovie ? '🎬' : '📺') : '';
  const sub       = [typeLabel, year].filter(Boolean).join(' ');

  return `
  <div class="card" onclick='openModal(${JSON.stringify(item).replace(/'/g,"&#39;")}, "${isMovie ? 'movie' : 'tv'}")'>
    <div class="card-poster">
      ${poster
        ? `<img src="${poster}" alt="${title}" loading="lazy">`
        : `<div class="card-poster-placeholder">🎬</div>`
      }
      ${rating ? `<div class="card-rating">★ ${rating}</div>` : ''}
      <div class="card-overlay">
        <div class="card-play-btn">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
        </div>
      </div>
    </div>
    <div class="card-info">
      <div class="card-name" title="${title}">${title}</div>
      <div class="card-sub">${sub}</div>
    </div>
  </div>`;
}

// ── OPEN MODAL ──
async function openModal(item, type, autoPlay = true) {
  currentItem   = item;
  currentType   = type || (item.media_type === 'tv' ? 'tv' : 'movie');
  currentSeason = 1;
  currentEp     = 1;
  currentServer = 0;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // Show loading state
  document.getElementById('playerLoader').style.display = 'flex';
  document.getElementById('playerFrame').src = '';

  // Populate info
  const title    = item.title || item.name || '—';
  const year     = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating   = item.vote_average?.toFixed(1);
  const overview = item.overview || 'No description available.';
  const poster   = item.poster_path ? `${IMG_BASE}w342${item.poster_path}` : '';

  document.getElementById('modalTitle').textContent   = title;
  document.getElementById('modalOverview').textContent = overview;
  document.getElementById('modalPoster').src          = poster;

  // Meta
  const genres = (item.genre_ids || []).map(id => genreMap[id]).filter(Boolean);
  document.getElementById('modalMeta').innerHTML = [
    year ? `<span>${year}</span><span class="dot">·</span>` : '',
    rating ? `<span class="hero-rating">★ ${rating}/10</span><span class="dot">·</span>` : '',
    currentType === 'movie' ? '<span class="tag">Movie</span>' : '<span class="tag">TV Series</span>',
    ...genres.slice(0,3).map(g => `<span class="tag">${g}</span>`)
  ].join('');

  // Actions
  document.getElementById('modalActions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="startPlay()">
      <svg viewBox="0 0 20 20" fill="currentColor" style="width:14px;height:14px"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
      Play
    </button>
    <button class="btn btn-ghost btn-sm" onclick="shareTitle('${title.replace(/'/g,"\\'")}')">Share</button>
  `;

  // TV or Movie specifics
  if (currentType === 'tv') {
    document.getElementById('episodePicker').style.display = 'block';
    document.getElementById('movieServerPicker').style.display = 'none';
    renderServerBtns('tv');
    await loadSeasons(item.id);
  } else {
    document.getElementById('episodePicker').style.display = 'none';
    document.getElementById('movieServerPicker').style.display = 'block';
    renderMovieServerBtns();
  }

  if (autoPlay) {
    startPlay();
  } else {
    document.getElementById('playerLoader').style.display = 'none';
  }
}

// ── PLAY ──
function startPlay() {
  const frame  = document.getElementById('playerFrame');
  const loader = document.getElementById('playerLoader');
  loader.style.display = 'flex';

  let src;
  if (currentType === 'movie') {
    src = SERVERS.movie[currentServer].url(currentItem.id);
  } else {
    src = SERVERS.tv[currentServer].url(currentItem.id, currentSeason, currentEp);
  }

  frame.onload = () => { loader.style.display = 'none'; };
  frame.src = src;
}

// ── SERVERS ──
function renderServerBtns(type) {
  const container = document.getElementById('serverBtns');
  container.innerHTML = SERVERS[type].map((s, i) =>
    `<button class="server-btn ${i === 0 ? 'active' : ''}" onclick="switchServer(${i},'${type}')">${s.label}</button>`
  ).join('');
}
function renderMovieServerBtns() {
  const container = document.getElementById('movieServerBtns');
  container.innerHTML = SERVERS.movie.map((s, i) =>
    `<button class="server-btn ${i === 0 ? 'active' : ''}" onclick="switchMovieServer(${i})">${s.label}</button>`
  ).join('');
}
function switchServer(idx, type) {
  currentServer = idx;
  document.querySelectorAll('#serverBtns .server-btn').forEach((b,i) => b.classList.toggle('active', i === idx));
  startPlay();
}
function switchMovieServer(idx) {
  currentServer = idx;
  document.querySelectorAll('#movieServerBtns .server-btn').forEach((b,i) => b.classList.toggle('active', i === idx));
  startPlay();
}

// ── SEASONS / EPISODES ──
async function loadSeasons(tvId) {
  try {
    const data = await tmdb(`/tv/${tvId}`);
    const seasons = (data.seasons || []).filter(s => s.season_number > 0);
    if (!seasons.length) {
      // Try with at least season 1
      renderSeasonTabs([{season_number:1, episode_count: 10}]);
      return;
    }
    renderSeasonTabs(seasons);
  } catch(e) {
    renderSeasonTabs([{season_number:1, episode_count: 10}]);
  }
}

function renderSeasonTabs(seasons) {
  const tabs = document.getElementById('seasonTabs');
  tabs.innerHTML = seasons.map(s =>
    `<button class="season-tab ${s.season_number === 1 ? 'active' : ''}"
      onclick="selectSeason(${s.season_number}, ${s.episode_count}, this)">
      Season ${s.season_number}
    </button>`
  ).join('');
  // Load episodes for season 1
  if (seasons.length > 0) {
    renderEpisodes(seasons[0].episode_count || 10);
  }
}

function selectSeason(num, epCount, btn) {
  currentSeason = num;
  currentEp     = 1;
  document.querySelectorAll('.season-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEpisodes(epCount || 20);
}

function renderEpisodes(count) {
  const grid = document.getElementById('episodesGrid');
  grid.innerHTML = Array.from({length: Math.min(count, 50)}, (_,i) => i+1).map(ep =>
    `<button class="ep-btn ${ep === currentEp ? 'active' : ''}"
      onclick="selectEpisode(${ep}, this)">
      E${ep}
    </button>`
  ).join('');
}

function selectEpisode(ep, btn) {
  currentEp = ep;
  document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  startPlay();
}

// ── CLOSE MODAL ──
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('playerFrame').src = '';
  document.body.style.overflow = '';
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ── SEARCH ──
function handleSearch(val) {
  clearTimeout(searchTimer);
  const home   = document.getElementById('home-page');
  const search = document.getElementById('searchPage');

  if (!val.trim()) {
    home.classList.remove('hidden');
    search.classList.remove('visible');
    return;
  }
  home.classList.add('hidden');
  search.classList.add('visible');
  document.getElementById('searchSubtitle').textContent = `Searching for "${val}"…`;
  document.getElementById('searchGrid').innerHTML = Array(8).fill(`
    <div><div class="skeleton" style="width:100%;aspect-ratio:2/3;border-radius:12px;"></div>
    <div class="skeleton" style="width:70%;height:14px;border-radius:4px;margin-top:8px;"></div></div>
  `).join('');

  searchTimer = setTimeout(() => doSearch(val), 400);
}

async function doSearch(query) {
  const data = await tmdb('/search/multi', { query, include_adult: false });
  const results = data.results.filter(r =>
    (r.media_type === 'movie' || r.media_type === 'tv') && (r.poster_path || r.backdrop_path)
  );
  document.getElementById('searchSubtitle').textContent = `${results.length} results for "${query}"`;

  if (!results.length) {
    document.getElementById('searchGrid').innerHTML = `
      <div class="search-empty" style="grid-column:1/-1">
        <div class="icon">🔍</div>
        <h3>Nothing found</h3>
        <p>Try a different title, actor, or genre</p>
      </div>`;
    return;
  }
  document.getElementById('searchGrid').innerHTML = results.map(r => cardHTML(r)).join('');
}

// ── NAV TABS ──
async function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  // Clear search
  document.getElementById('searchInput').value = '';
  document.getElementById('home-page').classList.remove('hidden');
  document.getElementById('searchPage').classList.remove('visible');

  // Scroll to section
  const map = {
    movies: 'moviesRow',
    tv: 'tvRow',
    trending: 'trendingRow',
    toprated: 'topRatedRow'
  };
  const el = document.getElementById(map[tab]);
  if (el) el.closest('.section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── GENRE BROWSE ──
async function browseGenre(id, name) {
  const home   = document.getElementById('home-page');
  const search = document.getElementById('searchPage');
  home.classList.add('hidden');
  search.classList.add('visible');
  document.getElementById('searchSubtitle').textContent = `Browsing: ${name}`;
  document.getElementById('searchGrid').innerHTML = Array(8).fill(`
    <div><div class="skeleton" style="width:100%;aspect-ratio:2/3;border-radius:12px;"></div></div>
  `).join('');

  const [movies, shows] = await Promise.all([
    tmdb('/discover/movie', { with_genres: id, sort_by: 'popularity.desc' }),
    tmdb('/discover/tv',    { with_genres: id, sort_by: 'popularity.desc' })
  ]);

  const combined = [
    ...movies.results.map(m => ({...m, media_type:'movie'})),
    ...shows.results.map(t => ({...t, media_type:'tv'}))
  ].sort((a,b) => b.popularity - a.popularity);

  document.getElementById('searchGrid').innerHTML = combined.map(r => cardHTML(r)).join('');

  // Mark active pill
  document.querySelectorAll('.genre-pill').forEach(p => {
    p.classList.toggle('active', p.textContent === name);
  });
}

// ── SHARE ──
function shareTitle(title) {
  if (navigator.share) {
    navigator.share({ title: `Watch ${title} on StreamVault`, text: `Check out ${title}!` });
  } else {
    navigator.clipboard?.writeText(`Watching: ${title} on StreamVault`);
    showToast('📋 Copied to clipboard');
  }
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'f' || e.key === 'F') && document.getElementById('modalOverlay').classList.contains('open')) {
    document.getElementById('playerFrame').requestFullscreen?.();
  }
});

// ── RUN ──
init();
</script>
