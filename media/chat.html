<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chat</title>
<style>
  :root {
    --bg-top: #1c1c1e;
    --bg-bottom: #0a0a0b;
    --bubble-me: linear-gradient(135deg, #0a84ff, #0066e0);
    --bubble-them: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #f2f2f7;
    --muted: #8e8e93;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- LOGIN SCREEN ---------- */
  #login-screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    text-align: center;
  }
  #login-screen .app-icon {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    box-shadow: 0 10px 30px rgba(10,132,255,0.35);
  }
  #login-screen h1 {
    font-size: 24px;
    margin: 0;
    font-weight: 600;
  }
  #login-screen p {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
    max-width: 280px;
  }
  #google-signin-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    color: #1c1c1e;
    border: none;
    border-radius: 14px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #google-signin-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0,0,0,0.4); }
  #google-signin-btn:active { transform: translateY(0px) scale(0.98); }
  #google-signin-btn svg { width: 20px; height: 20px; }

  #login-error {
    color: #ff6b6b;
    font-size: 13px;
    max-width: 280px;
    display: none;
  }

  /* ---------- CHAT SCREEN ---------- */
  #chat-screen {
    height: 100%;
    display: none;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px calc(14px + env(safe-area-inset-top)*0);
    padding-top: max(14px, env(safe-area-inset-top));
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
    z-index: 10;
  }
  header .title-group { display: flex; align-items: center; gap: 10px; }
  header .avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); }
  header h2 { font-size: 16px; margin: 0; font-weight: 600; }
  header .room-sub { font-size: 11px; color: var(--muted); margin: 0; }
  #signout-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  #signout-btn:active { background: rgba(255,255,255,0.15); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 100%;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-row img.mini-avatar {
    width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  }
  .msg-row .spacer { width: 26px; flex-shrink: 0; }
  .bubble-wrap { display: flex; flex-direction: column; max-width: 72%; }
  .msg-row.me .bubble-wrap { align-items: flex-end; }
  .sender-name {
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 3px 10px;
  }
  .bubble {
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-row.them .bubble {
    background: var(--bubble-them);
    border: 1px solid var(--glass-border);
    border-bottom-left-radius: 6px;
  }
  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 6px;
  }
  .timestamp {
    font-size: 10px;
    color: var(--muted);
    margin: 3px 10px 0;
  }
  .day-divider {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin: 14px 0 4px;
  }

  #composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  #msg-input {
    flex: 1;
    resize: none;
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    padding: 10px 16px;
    font-size: 15px;
    max-height: 100px;
    line-height: 1.3;
    font-family: inherit;
  }
  #msg-input:focus { outline: none; border-color: rgba(10,132,255,0.6); }
  #send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: #0a84ff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send-btn:disabled { opacity: 0.35; cursor: default; }
  #send-btn:active:not(:disabled) { transform: scale(0.92); }

  #connection-banner {
    display: none;
    text-align: center;
    font-size: 12px;
    color: #ffcc00;
    background: rgba(255,204,0,0.1);
    padding: 6px;
  }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="app-icon">💬</div>
  <h1>Chat</h1>
  <p>Sign in with your Google account to join the conversation.</p>
  <button id="google-signin-btn">
    <svg viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.6 5.1 29.6 3 24 3c-7.6 0-14.1 4.3-17.7 10.7z"/>
      <path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4c-2 1.4-4.6 2.5-7.7 2.5-5.3 0-9.7-3.4-11.3-8H5.5v5.6C9 40.6 15.9 45 24 45z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.5l6.6 5.4C41.9 35.9 45 30.5 45 24c0-1.4-.1-2.7-.4-3.5z"/>
    </svg>
    Sign in with Google
  </button>
  <p id="login-error"></p>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <header>
    <div class="title-group">
      <img id="my-avatar" class="avatar" src="" alt="" />
      <div>
        <h2>General</h2>
        <p class="room-sub" id="my-name-sub"></p>
      </div>
    </div>
    <button id="signout-btn">Sign out</button>
  </header>
  <div id="connection-banner">Reconnecting…</div>
  <div id="messages"></div>
  <div id="composer">
    <textarea id="msg-input" rows="1" placeholder="Message"></textarea>
    <button id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 20L20 12L4 4V10L15 12L4 14V20Z" fill="white"/>
      </svg>
    </button>
  </div>
</div>

<!-- Firebase SDKs (compat, simplest for a single-file app) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
  // ---------- Firebase config ----------
  const firebaseConfig = {
    apiKey: "AIzaSyD-wZTjp_t92HNchamXbNIdzAL0v-QuaXw",
    authDomain: "library-1261e.firebaseapp.com",
    databaseURL: "https://library-1261e-default-rtdb.firebaseio.com",
    projectId: "library-1261e",
    storageBucket: "library-1261e.firebasestorage.app",
    messagingSenderId: "23755084600",
    appId: "1:23755084600:web:fec3c7b506c496b6b627cd",
    measurementId: "G-1NC3DDWM3S"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const ROOM = "general"; // change this (or make dynamic) to support multiple rooms
  const messagesRef = db.ref(`rooms/${ROOM}/messages`);

  // ---------- DOM refs ----------
  const loginScreen = document.getElementById('login-screen');
  const chatScreen = document.getElementById('chat-screen');
  const signInBtn = document.getElementById('google-signin-btn');
  const signOutBtn = document.getElementById('signout-btn');
  const loginError = document.getElementById('login-error');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const myAvatar = document.getElementById('my-avatar');
  const myNameSub = document.getElementById('my-name-sub');
  const connectionBanner = document.getElementById('connection-banner');

  let currentUser = null;
  let messagesListenerAttached = false;
  let lastRenderedDay = null;

  // ---------- Auth ----------
  signInBtn.addEventListener('click', () => {
    loginError.style.display = 'none';
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      console.error(err);
      loginError.textContent = "Sign-in failed: " + err.message;
      loginError.style.display = 'block';
    });
  });

  signOutBtn.addEventListener('click', () => {
    auth.signOut();
  });

  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (user) {
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      myAvatar.src = user.photoURL || fallbackAvatar(user.displayName);
      myNameSub.textContent = user.displayName || user.email || '';
      sendBtn.disabled = msgInput.value.trim().length === 0;
      if (!messagesListenerAttached) {
        attachMessagesListener();
        messagesListenerAttached = true;
      }
    } else {
      chatScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
    }
  });

  function fallbackAvatar(name) {
    const initial = (name || '?').charAt(0).toUpperCase();
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" rx="30" fill="#5e5ce6"/><text x="50%" y="50%" font-size="26" fill="white" text-anchor="middle" dy=".35em" font-family="sans-serif">${initial}</text></svg>`
    );
  }

  // ---------- Realtime DB: connection state ----------
  db.ref('.info/connected').on('value', snap => {
    connectionBanner.style.display = snap.val() === true ? 'none' : 'block';
  });

  // ---------- Messages ----------
  function attachMessagesListener() {
    const recentQuery = messagesRef.orderByChild('timestamp').limitToLast(200);
    recentQuery.on('child_added', snap => {
      renderMessage(snap.key, snap.val());
      scrollToBottom();
    });
  }

  function renderMessage(id, msg) {
    if (!msg || !msg.text) return;
    const isMe = currentUser && msg.uid === currentUser.uid;

    // Day divider
    const day = new Date(msg.timestamp || Date.now()).toDateString();
    if (day !== lastRenderedDay) {
      const divider = document.createElement('div');
      divider.className = 'day-divider';
      divider.textContent = formatDayLabel(msg.timestamp);
      messagesEl.appendChild(divider);
      lastRenderedDay = day;
    }

    const row = document.createElement('div');
    row.className = 'msg-row ' + (isMe ? 'me' : 'them');
    row.dataset.id = id;

    if (!isMe) {
      const img = document.createElement('img');
      img.className = 'mini-avatar';
      img.src = msg.photoURL || fallbackAvatar(msg.name);
      row.appendChild(img);
    }

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    if (!isMe) {
      const nameEl = document.createElement('p');
      nameEl.className = 'sender-name';
      nameEl.textContent = msg.name || 'Someone';
      wrap.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;
    wrap.appendChild(bubble);

    const time = document.createElement('p');
    time.className = 'timestamp';
    time.textContent = formatTime(msg.timestamp);
    wrap.appendChild(time);

    row.appendChild(wrap);
    messagesEl.appendChild(row);
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDayLabel(ts) {
    const d = new Date(ts || Date.now());
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // ---------- Sending ----------
  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentUser) return;
    msgInput.value = '';
    autoGrow();
    sendBtn.disabled = true;

    messagesRef.push({
      uid: currentUser.uid,
      name: currentUser.displayName || currentUser.email || 'Anonymous',
      photoURL: currentUser.photoURL || null,
      text: text,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    }).catch(err => {
      console.error('Failed to send message', err);
      alert('Message failed to send: ' + err.message);
    });
  }

  sendBtn.addEventListener('click', sendMessage);

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  msgInput.addEventListener('input', () => {
    sendBtn.disabled = msgInput.value.trim().length === 0;
    autoGrow();
  });

  function autoGrow() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
  }
</script>
</body>
</html>
