<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee Pro Clone</title>
    <style>
        :root {
            --gold: #f7da21;
            --light-grey: #e6e6e6;
            --dark-grey: #333;
            --font-main: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            color: var(--dark-grey);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 550px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid var(--light-grey);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        #rank-display { font-weight: 700; text-transform: uppercase; color: #666; font-size: 0.85rem; }
        #score-display { font-weight: 700; font-size: 1.2rem; }

        /* Hexagon Layout */
        .hive {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px 0;
        }

        .hex {
            position: absolute;
            width: 96px;
            height: 106px;
            background-color: var(--light-grey);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .hex.center { background-color: var(--gold); z-index: 5; }
        .hex:active { transform: scale(0.9); }

        /* Clockwise positioning */
        .h-c { top: 97px; left: 102px; }
        .h-0 { top: 0px; left: 102px; }
        .h-1 { top: 48px; left: 187px; }
        .h-2 { top: 145px; left: 187px; }
        .h-3 { top: 194px; left: 102px; }
        .h-4 { top: 145px; left: 17px; }
        .h-5 { top: 48px; left: 17px; }

        /* Input Area */
        .input-container {
            height: 50px;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .center-let { color: var(--gold); }

        /* Controls */
        .btns { display: flex; gap: 10px; margin-top: 20px; }
        button {
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid #ccc;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-ent { background: var(--dark-grey); color: #fff; border: none; }

        /* Feedback Toast */
        #toast {
            position: fixed;
            top: 15%;
            background: #222;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
        }

        /* Found Words List */
        .word-box {
            width: 100%;
            max-width: 450px;
            margin-top: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }
        #found-list {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 0;
            list-style: none;
            font-size: 0.9rem;
            text-transform: capitalize;
        }
        .pangram-word { font-weight: bold; color: #b19500; }
    </style>
</head>
<body>

<header>
    <div id="rank-display">Beginner</div>
    <div id="score-display">Score: 0</div>
</header>

<div id="toast"></div>

<div class="input-container" id="input-box"></div>

<div class="hive">
    <div class="hex center h-c" onclick="add('A')">A</div>
    <div class="hex h-0" id="l0" onclick="add(this.innerText)">L</div>
    <div class="hex h-1" id="l1" onclick="add(this.innerText)">P</div>
    <div class="hex h-2" id="l2" onclick="add(this.innerText)">H</div>
    <div class="hex h-3" id="l3" onclick="add(this.innerText)">B</div>
    <div class="hex h-4" id="l4" onclick="add(this.innerText)">E</div>
    <div class="hex h-5" id="l5" onclick="add(this.innerText)">T</div>
</div>

<div class="btns">
    <button onclick="del()">Delete</button>
    <button onclick="shuf()">↻</button>
    <button class="btn-ent" onclick="ent()">Enter</button>
</div>

<div class="word-box">
    <strong id="word-count">0 words found</strong>
    <ul id="found-list"></ul>
</div>

<script>
    const center = 'A';
    let outer = ['L', 'P', 'H', 'B', 'E', 'T'];
    let current = "";
    let score = 0;
    let found = [];

    // 110+ REAL Verified English Words for the set A, B, E, H, L, P, T
    const validWords = new Set([
        "ALPHABET", "ALPHABETA", "ALBEIT", "BATTLE", "HEALTH", "TABLET", "ALBATA", "ALBEDO", "ABATE", "ABET", 
        "ALBA", "ALAE", "ALAPA", "ALATE", "ALLEE", "APATHY", "APPAL", "APPALL", "APPEAL", "APPLE", "AREA", 
        "BAAL", "BABA", "BALE", "BALL", "BATE", "BATH", "BATHA", "BEAD", "BEAL", "BEAR", "BEAT", "BETA", 
        "BLEAT", "EPHA", "HABIT", "HABITAT", "HALA", "HALE", "HALL", "HALT", "HATE", "HATH", "HEAL", "HEAP", 
        "HEAT", "HEATH", "LABIA", "LABILE", "LATE", "LATH", "LATHE", "LEAL", "LEAP", "PALE", "PALET", "PALL", 
        "PAPA", "PEAL", "PEAT", "PHAT", "PLAT", "PLATE", "PLEA", "PLEAT", "TAAL", "TABLE", "TABLA", "TALA", 
        "TALE", "TALL", "TAPA", "TAPE", "TEAL", "TEPA", "ABLAZE", "ALBEE", "APNEA", "BAHT", "BALATA", "BALEEN", 
        "BALLATA", "BATEAU", "BEATABLE", "BEATER", "BEBEEP", "BEETLE", "BELAH", "BELATE", "EPHEBE", "HATABLE", 
        "HEALABLE", "HEALER", "HEPTA", "LEPTA", "PALAPA", "PALATE", "PALEA", "PALETTE", "PATELLA", "PELLET", 
        "PETAL", "PHALANGE", "PHREATA", "PLATTE", "TAPPABLE", "EATABLE", "ATTAP", "HELLABA", "PALETOT", 
        "PATE", "TAEL", "BALLEET", "BALE", "BATHED", "BEHAVE", "HEALTHA", "ELATE", "HALAL", "BALLOT", "PAELLA"
    ].map(w => w.toUpperCase()));

    function add(l) {
        current += l;
        render();
    }

    function del() {
        current = current.slice(0, -1);
        render();
    }

    function render() {
        const box = document.getElementById('input-box');
        box.innerHTML = current.split('').map(char => 
            `<span class="${char === center ? 'center-let' : ''}">${char}</span>`
        ).join('');
    }

    function shuf() {
        outer.sort(() => Math.random() - 0.5);
        outer.forEach((l, i) => document.getElementById(`l${i}`).innerText = l);
    }

    function msg(text) {
        const t = document.getElementById('toast');
        t.innerText = text;
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 1200);
    }

    function ent() {
        const w = current.toUpperCase();
        if (w.length < 4) msg("Too short");
        else if (!w.includes(center)) msg("Missing center letter");
        else if (found.includes(w)) msg("Already found");
        else if (validWords.has(w)) {
            const isPangram = new Set(w).size === 7;
            const pts = (w.length === 4) ? 1 : w.length;
            const finalPts = isPangram ? pts + 7 : pts;
            
            score += finalPts;
            found.push(w);
            if(isPangram) msg("Pangram!"); else msg("Nice!");
            updateUI();
            current = "";
            render();
        } else {
            msg("Not in word list");
        }
    }

    function updateUI() {
        document.getElementById('score-display').innerText = `Score: ${score}`;
        document.getElementById('word-count').innerText = `${found.length} word${found.length === 1 ? '' : 's'} found`;
        
        const list = document.getElementById('found-list');
        list.innerHTML = found.sort().map(w => {
            const cls = new Set(w).size === 7 ? 'pangram-word' : '';
            return `<li class="${cls}">${w.toLowerCase()}</li>`;
        }).join('');

        const ranks = ["Beginner", "Good", "Solid", "Amazing", "Genius"];
        const rIdx = Math.min(Math.floor(found.length / 8), ranks.length - 1);
        document.getElementById('rank-display').innerText = ranks[rIdx];
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') ent();
        else if (e.key === 'Backspace') del();
        else {
            const k = e.key.toUpperCase();
            if (k === center || outer.includes(k)) add(k);
        }
    });
</script>

</body>
</html>
