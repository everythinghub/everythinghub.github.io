<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - Stream Your Favorites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .sidebar {
            width: 300px;
            background: #0f1419;
            border-right: 1px solid #282828;
            padding: 24px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 32px;
            color: #1db954;
        }

        .logo span {
            color: #1ed760;
        }

        .menu-section {
            margin-bottom: 32px;
        }

        .menu-title {
            font-size: 12px;
            color: #b3b3b3;
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .menu-item {
            padding: 10px 0;
            color: #b3b3b3;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            border-radius: 4px;
            padding-left: 10px;
        }

        .menu-item:hover {
            color: #fff;
        }

        .menu-item.active {
            color: #1db954;
            font-weight: 600;
        }

        .main-content {
            margin-left: 300px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px 32px;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            max-width: 300px;
            padding: 8px 16px;
            background: #282828;
            border: none;
            border-radius: 24px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .search-bar::placeholder {
            color: #b3b3b3;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        .section-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .song-card {
            background: #181818;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .song-card:hover {
            background: #282828;
            transform: translateY(-4px);
        }

        .song-cover {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .song-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            height: 90px;
        }

        .player-song-info {
            width: 200px;
            min-width: 180px;
        }

        .player-cover {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .player-song-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-song-artist {
            font-size: 11px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px;
        }

        .control-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }

        .control-btn:hover {
            color: #1db954;
            transform: scale(1.1);
        }

        .control-btn.play {
            background: #1db954;
            color: #000;
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        .control-btn.play:hover {
            background: #1ed760;
            color: #000;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .progress-time {
            font-size: 11px;
            color: #b3b3b3;
            width: 30px;
            text-align: right;
        }

        .progress-slider {
            flex: 1;
            height: 4px;
            background: #404040;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .progress-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 150px;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background: #404040;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .playlist-item {
            padding: 8px 0;
            font-size: 13px;
            color: #b3b3b3;
            cursor: pointer;
            border-radius: 4px;
            padding-left: 8px;
            transition: all 0.2s ease;
        }

        .playlist-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.active {
            color: #1db954;
            font-weight: 600;
        }

        .playlist-container {
            max-height: 200px;
            overflow-y: auto;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">🎵 <span>Music</span></div>
            
            <div class="menu-section">
                <div class="menu-title">Menu</div>
                <div class="menu-item active" onclick="switchSection('discover')">🏠 Home</div>
                <div class="menu-item" onclick="switchSection('search')">🔍 Search</div>
                <div class="menu-item" onclick="switchSection('liked')">❤️ Liked Songs</div>
            </div>

            <div class="menu-section">
                <div class="menu-title">Your Playlists</div>
                <div class="playlist-container" id="playlistContainer">
                    <div class="playlist-item" onclick="switchSection('playlist-1')">My Playlist 1</div>
                    <div class="playlist-item" onclick="switchSection('playlist-2')">Workout Mix</div>
                    <div class="playlist-item" onclick="switchSection('playlist-3')">Chill Vibes</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <input type="text" class="search-bar" id="searchInput" placeholder="Search songs, artists...">
            </div>

            <div class="content" id="mainContent">
                <div id="discover">
                    <div class="section-title">Discover</div>
                    <div class="songs-grid" id="discoverGrid"></div>
                </div>

                <div id="search" style="display: none;">
                    <div class="section-title">Search Results</div>
                    <div class="songs-grid" id="searchGrid"></div>
                </div>

                <div id="liked" style="display: none;">
                    <div class="section-title">Liked Songs</div>
                    <div class="songs-grid" id="likedGrid"></div>
                </div>

                <div id="playlist-1" style="display: none;">
                    <div class="section-title">My Playlist 1</div>
                    <div class="songs-grid" id="playlist-1-grid"></div>
                </div>

                <div id="playlist-2" style="display: none;">
                    <div class="section-title">Workout Mix</div>
                    <div class="songs-grid" id="playlist-2-grid"></div>
                </div>

                <div id="playlist-3" style="display: none;">
                    <div class="section-title">Chill Vibes</div>
                    <div class="songs-grid" id="playlist-3-grid"></div>
                </div>
            </div>
        </div>

        <div class="player-bar">
            <div class="player-cover" id="playerCover">🎵</div>
            <div class="player-song-info">
                <div class="player-song-name" id="playerSongName">Select a song</div>
                <div class="player-song-artist" id="playerArtist">Music Player</div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="control-btn" onclick="previousSong()">⏮️</button>
                    <button class="control-btn play" id="playBtn" onclick="togglePlay()">▶️</button>
                    <button class="control-btn" onclick="nextSong()">⏭️</button>
                    <button class="control-btn" id="likeBtn" onclick="toggleLike()">🤍</button>
                </div>
                <div class="progress-bar">
                    <span class="progress-time" id="currentTime">0:00</span>
                    <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0" onchange="seekSong()">
                    <span class="progress-time" id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-control">
                <span style="font-size: 16px;">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" onchange="setVolume()">
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Songs Database
        const songs = [
            { id: 1, title: "Summer Vibes", artist: "The Beats", emoji: "☀️", duration: 240 },
            { id: 2, title: "Night Drive", artist: "Neon Dreams", emoji: "🌙", duration: 210 },
            { id: 3, title: "Ocean Waves", artist: "Coastal Harmony", emoji: "🌊", duration: 195 },
            { id: 4, title: "Electric Pulse", artist: "Synth Masters", emoji: "⚡", duration: 220 },
            { id: 5, title: "Forest Walk", artist: "Nature Sounds", emoji: "🌲", duration: 185 },
            { id: 6, title: "Urban Jungle", artist: "City Nights", emoji: "🏙️", duration: 235 },
            { id: 7, title: "Starlight", artist: "Cosmic Journey", emoji: "⭐", duration: 215 },
            { id: 8, title: "Rhythm Flow", artist: "Beat Makers", emoji: "🎶", duration: 200 },
            { id: 9, title: "Sunset Dreams", artist: "Golden Hour", emoji: "🌅", duration: 225 },
            { id: 10, title: "Mountain High", artist: "Peak Performance", emoji: "⛰️", duration: 245 },
            { id: 11, title: "Desert Wind", artist: "Dust & Thunder", emoji: "🌪️", duration: 190 },
            { id: 12, title: "Crystal Clear", artist: "Pure Vibes", emoji: "💎", duration: 210 },
            { id: 13, title: "Midnight Echo", artist: "Shadow Play", emoji: "🌑", duration: 220 },
            { id: 14, title: "Golden Hour", artist: "Sunset Crew", emoji: "🌞", duration: 205 },
            { id: 15, title: "Wave Rider", artist: "Surf Kings", emoji: "🏄", duration: 215 },
            { id: 16, title: "Fire & Ice", artist: "Polar Extreme", emoji: "🔥", duration: 230 },
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let likedSongs = [];
        let currentSection = 'discover';
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');

        // Initialize
        function init() {
            renderDiscoverSongs();
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', nextSong);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            populatePlaylists();
        }

        function renderSongs(containerId, songList) {
            const container = document.getElementById(containerId);
            container.innerHTML = songList.map((song, index) => `
                <div class="song-card" onclick="playSong(${index})">
                    <div class="song-cover">${song.emoji}</div>
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">${song.artist}</div>
                </div>
            `).join('');
        }

        function renderDiscoverSongs() {
            renderSongs('discoverGrid', songs);
        }

        function populatePlaylists() {
            const playlist1Songs = songs.slice(0, 4);
            const playlist2Songs = songs.slice(4, 8);
            const playlist3Songs = songs.slice(8, 12);

            renderSongs('playlist-1-grid', playlist1Songs);
            renderSongs('playlist-2-grid', playlist2Songs);
            renderSongs('playlist-3-grid', playlist3Songs);
        }

        function playSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            
            document.getElementById('playerSongName').textContent = song.title;
            document.getElementById('playerArtist').textContent = song.artist;
            document.getElementById('playerCover').textContent = song.emoji;
            document.getElementById('duration').textContent = formatTime(song.duration);
            
            // Simulate audio playback
            audio.currentTime = 0;
            audio.duration = song.duration;
            isPlaying = true;
            updatePlayButton();
            simulatePlayback();
            
            updateLikeButton();
        }

        function togglePlay() {
            if (!songs[currentSongIndex]) return;
            
            isPlaying = !isPlaying;
            updatePlayButton();
            
            if (isPlaying) {
                simulatePlayback();
            }
        }

        function simulatePlayback() {
            if (!isPlaying) return;
            
            const duration = songs[currentSongIndex].duration;
            let elapsed = parseInt(audio.currentTime);
            
            const interval = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(interval);
                    return;
                }
                
                elapsed++;
                audio.currentTime = elapsed;
                document.getElementById('currentTime').textContent = formatTime(elapsed);
                document.getElementById('progressSlider').value = (elapsed / duration) * 100;
                
                if (elapsed >= duration) {
                    clearInterval(interval);
                    nextSong();
                }
            }, 1000);
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playSong(currentSongIndex);
        }

        function previousSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(currentSongIndex);
        }

        function updateProgress() {
            const duration = songs[currentSongIndex]?.duration || 0;
            if (duration > 0) {
                document.getElementById('progressSlider').value = (audio.currentTime / duration) * 100;
            }
        }

        function seekSong() {
            const slider = document.getElementById('progressSlider');
            const duration = songs[currentSongIndex].duration;
            audio.currentTime = (slider.value / 100) * duration;
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        }

        function setVolume() {
            const volume = document.getElementById('volumeSlider').value;
            audio.volume = volume / 100;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updatePlayButton() {
            playBtn.textContent = isPlaying ? '⏸️' : '▶️';
        }

        function toggleLike() {
            const currentSong = songs[currentSongIndex];
            const index = likedSongs.findIndex(s => s.id === currentSong.id);
            
            if (index === -1) {
                likedSongs.push(currentSong);
            } else {
                likedSongs.splice(index, 1);
            }
            
            updateLikeButton();
        }

        function updateLikeButton() {
            const currentSong = songs[currentSongIndex];
            const isLiked = likedSongs.some(s => s.id === currentSong.id);
            document.getElementById('likeBtn').textContent = isLiked ? '❤️' : '🤍';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query.length > 0) {
                switchSection('search');
                const results = songs.filter(song => 
                    song.title.toLowerCase().includes(query) || 
                    song.artist.toLowerCase().includes(query)
                );
                renderSongs('searchGrid', results);
            }
        }

        function switchSection(section) {
            currentSection = section;
            const mainContent = document.getElementById('mainContent');
            const children = mainContent.children;
            
            for (let child of children) {
                child.style.display = 'none';
            }
            
            const element = document.getElementById(section);
            if (element) {
                element.style.display = 'block';
            }
            
            // Update liked songs grid
            if (section === 'liked') {
                renderSongs('likedGrid', likedSongs);
            }
        }

        // Start the app
        init();
    </script>
</body>
</html>
