<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-top: #1a3a5c;
    --bg-bottom: #0a1f3a;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.7);
    --card-bg: rgba(255,255,255,0.12);
    --card-border: rgba(255,255,255,0.18);
    --separator: rgba(255,255,255,0.15);
    --font: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    color: var(--text-primary);
    overflow-x: hidden;
    background: #0a1f3a;
  }

  body { min-height: 100vh; position: relative; }

  #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; transition: background 2s ease; }

  .app {
    position: relative; z-index: 1;
    max-width: 430px; margin: 0 auto;
    min-height: 100vh; padding-bottom: 100px;
    opacity: 0; transition: opacity 0.8s ease;
  }
  .app.loaded { opacity: 1; }

  .header { padding: 58px 20px 0; text-align: left; position: relative; }
  .location-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .location-icon { width: 14px; height: 14px; opacity: 0.9; }
  .city-name { font-size: 34px; font-weight: 300; letter-spacing: -0.5px; line-height: 1; }
  .current-condition { font-size: 16px; font-weight: 400; color: var(--text-secondary); margin-bottom: 2px; margin-top: 2px; }
  .temp-big { font-size: 96px; font-weight: 100; letter-spacing: -5px; line-height: 1; margin: 8px 0 4px; }
  .temp-range-top { font-size: 17px; font-weight: 400; color: var(--text-secondary); }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    margin: 12px 16px;
    overflow: hidden;
  }

  .card-header {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--separator);
    font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
    text-transform: uppercase; color: rgba(255,255,255,0.65);
  }
  .card-header svg { opacity: 0.65; }

  .summary-banner {
    padding: 10px 14px 12px; font-size: 14px; font-weight: 400;
    color: rgba(255,255,255,0.9); line-height: 1.4;
    border-bottom: 1px solid var(--separator);
  }

  .hourly-scroll {
    display: flex; overflow-x: auto; padding: 12px 8px; gap: 2px; scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar { display: none; }

  .hour-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 4px 10px; min-width: 52px; flex-shrink: 0;
  }
  .hour-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .hour-label.now { color: #fff; }
  .hour-icon { font-size: 22px; line-height: 1; }
  .hour-temp { font-size: 17px; font-weight: 500; }
  .hour-precip { font-size: 11px; font-weight: 600; color: #6ec6f5; }

  .hourly-chart-wrap { padding: 0 14px 10px; border-top: 1px solid var(--separator); }

  .day-row {
    display: flex; align-items: center; padding: 10px 14px;
    gap: 8px; border-bottom: 1px solid var(--separator);
  }
  .day-row:last-child { border-bottom: none; }
  .day-name { font-size: 17px; font-weight: 500; width: 36px; flex-shrink: 0; }
  .day-icon { font-size: 22px; flex-shrink: 0; width: 30px; text-align: center; }
  .day-precip { font-size: 12px; font-weight: 600; color: #6ec6f5; width: 36px; text-align: left; flex-shrink: 0; }
  .day-range { flex: 1; display: flex; align-items: center; gap: 8px; }
  .day-lo { font-size: 17px; font-weight: 400; color: var(--text-secondary); min-width: 28px; text-align: right; }
  .range-bar-wrap { flex: 1; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; position: relative; }
  .range-bar-fill { position: absolute; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #6ec6f5, #f5d76e, #f5876e); }
  .day-hi { font-size: 17px; font-weight: 500; min-width: 28px; text-align: left; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .detail-cell { padding: 14px 16px; border-bottom: 1px solid var(--separator); border-right: 1px solid var(--separator); }
  .detail-cell:nth-child(even) { border-right: none; }
  .detail-cell:nth-last-child(-n+2) { border-bottom: none; }
  .detail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
  .detail-value { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; line-height: 1.1; }
  .detail-sub { font-size: 13px; font-weight: 400; color: var(--text-secondary); margin-top: 2px; }

  .uv-bar-wrap { height: 4px; background: linear-gradient(90deg, #6ec6f5 0%, #8be86e 30%, #f5d76e 55%, #f5a76e 75%, #cc5c5c 100%); border-radius: 2px; margin-top: 8px; position: relative; }
  .uv-dot { width: 10px; height: 10px; background: #fff; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); }

  .sun-arc-wrap { padding: 10px 16px 14px; position: relative; }
  .sun-arc-svg { width: 100%; height: 70px; }
  .sun-times { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--text-secondary); }

  .loader {
    position: fixed; inset: 0; background: #0a1f3a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; transition: opacity 0.6s ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader-icon { font-size: 64px; margin-bottom: 16px; animation: pulse 1.5s ease-in-out infinite; }
  .loader-text { font-size: 16px; color: rgba(255,255,255,0.6); font-weight: 400; }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }

  .search-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,20,40,0.6);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    display: flex; flex-direction: column; padding: 0;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .search-overlay.open { opacity: 1; pointer-events: all; }
  .search-bar-row { display: flex; align-items: center; gap: 10px; padding: 56px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .search-input-wrap { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 0 12px; gap: 8px; border: 1px solid rgba(255,255,255,0.1); transition: border-color 0.2s, background 0.2s; }
  .search-input-wrap:focus-within { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.25); }
  .search-input-wrap svg { flex-shrink: 0; opacity: 0.6; }
  #search-input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 17px; font-family: var(--font); font-weight: 400; padding: 11px 0; caret-color: #fff; }
  #search-input::placeholder { color: rgba(255,255,255,0.45); }
  #search-clear { background: rgba(255,255,255,0.3); border: none; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 11px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  #search-clear.visible { opacity: 1; pointer-events: all; }
  .search-cancel-btn { background: none; border: none; color: #fff; font-size: 17px; font-family: var(--font); cursor: pointer; padding: 8px 4px; white-space: nowrap; opacity: 0.85; }
  .search-results { overflow-y: auto; flex: 1; padding: 8px 0; }
  .search-result-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.07); transition: background 0.15s; }
  .search-result-item:hover, .search-result-item:active { background: rgba(255,255,255,0.08); }
  .search-result-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .search-result-text { flex: 1; }
  .search-result-name { font-size: 16px; font-weight: 500; }
  .search-result-sub { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 1px; }
  .search-result-arrow { color: rgba(255,255,255,0.3); font-size: 14px; }
  .search-status { padding: 20px; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; }
  .search-section-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.4); padding: 16px 20px 6px; }
  .search-trigger { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: background 0.2s; }
  .search-trigger:hover { background: rgba(255,255,255,0.25); }
  .header { position: relative; }
  #hourly-chart { width: 100%; height: 60px; margin-top: 4px; }

  .sky-bg { position: fixed; inset: 0; z-index: 0; transition: background 3s ease; }
  .clouds-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .cloud { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.04); animation: cloudDrift linear infinite; }
  @keyframes cloudDrift { from { transform: translateX(-200px); } to { transform: translateX(calc(100vw + 200px)); } }

  /* ══════════════════════════════════════════════
     RADAR CARD
  ══════════════════════════════════════════════ */
  .radar-card {
    position: relative;
    overflow: hidden;
    padding: 0;
    border-radius: 18px;
  }

  #radar-map-container {
    position: relative;
    width: 100%;
    height: 220px;
    background: #0d1f35;
    overflow: hidden;
  }

  #radar-base-canvas,
  #radar-overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Crosshair */
  .radar-crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
  }
  .radar-crosshair::before,
  .radar-crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.9);
  }
  .radar-crosshair::before {
    width: 1px; height: 14px;
    top: -7px; left: -0.5px;
  }
  .radar-crosshair::after {
    width: 14px; height: 1px;
    left: -7px; top: -0.5px;
  }
  .radar-loc-dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 0 12px rgba(255,255,255,0.6);
    z-index: 11;
    pointer-events: none;
  }

  /* Radar controls bar */
  .radar-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(0,0,0,0.25);
    border-top: 1px solid var(--separator);
  }

  .radar-time-label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    min-width: 90px;
  }

  .radar-scrubber {
    flex: 1;
    margin: 0 12px;
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
  }

  .radar-scrubber-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }

  .radar-scrubber-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    background: rgba(110,198,245,0.8);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .radar-scrubber-thumb {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transition: left 0.3s ease;
    pointer-events: none;
  }

  .radar-play-btn {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border: none; border-radius: 50%;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .radar-play-btn:hover { background: rgba(255,255,255,0.25); }
  .radar-play-btn svg { width: 12px; height: 12px; }

  /* Legend */
  .radar-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px 10px;
    border-top: 1px solid var(--separator);
  }
  .radar-legend-bar {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg,
      rgba(0,100,255,0.7) 0%,
      rgba(0,200,100,0.7) 25%,
      rgba(255,255,0,0.8) 50%,
      rgba(255,100,0,0.9) 75%,
      rgba(200,0,0,1) 100%
    );
  }
  .radar-legend-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* Radar status badge */
  .radar-status {
    position: absolute;
    top: 10px; left: 14px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.3px;
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .radar-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #6ec6f5;
    animation: radarBlink 2s ease-in-out infinite;
  }
  @keyframes radarBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Zoom controls */
  .radar-zoom {
    position: absolute;
    top: 10px; right: 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 12;
  }
  .radar-zoom-btn {
    width: 26px; height: 26px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: rgba(255,255,255,0.8);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    line-height: 1;
    font-weight: 300;
  }
  .radar-zoom-btn:hover { background: rgba(255,255,255,0.15); }

  .location-btn { width: 34px; height: 34px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .location-btn:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<!-- Search overlay -->
<div class="search-overlay" id="search-overlay">
  <div class="search-bar-row">
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search city or zip code" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="search-clear">✕</button>
    </div>
    <button class="search-cancel-btn" id="search-cancel">Cancel</button>
  </div>
  <div class="search-results" id="search-results">
    <div class="search-section-label" id="search-section-label">SUGGESTIONS</div>
    <div id="search-status" class="search-status">Type a city name or zip code</div>
  </div>
</div>

<!-- Dynamic background -->
<div class="sky-bg" id="sky-bg"></div>
<div class="clouds-layer" id="clouds-layer"></div>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="loader-icon">🌤️</div>
  <div class="loader-text">Getting your weather…</div>
</div>

<!-- Main app -->
<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <button class="search-trigger" id="search-trigger" title="Search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/>
      </svg>
    </button>
    <div class="location-row">
      <svg class="location-icon" viewBox="0 0 14 14" fill="white"><path d="M7 0C4.24 0 2 2.24 2 5c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5zm0 6.5A1.5 1.5 0 1 1 7 3.5a1.5 1.5 0 0 1 0 3z"/></svg>
      <span id="city-name" class="city-name">Loading…</span>
    </div>
    <div class="current-condition" id="current-condition">—</div>
    <div class="temp-big" id="temp-big">—°</div>
    <div class="temp-range-top" id="temp-range-top">H: —° L: —°</div>
  </div>

  <!-- HOURLY CARD -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="white"><circle cx="6" cy="6" r="5" stroke="white" stroke-width="1.2" fill="none"/><path d="M6 3v3l2 1.2" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>
      HOURLY FORECAST
    </div>
    <div class="summary-banner" id="summary-banner">Fetching conditions…</div>
    <div class="hourly-scroll" id="hourly-scroll"></div>
    <div class="hourly-chart-wrap">
      <canvas id="hourly-chart"></canvas>
    </div>
  </div>

  <!-- 10-DAY CARD -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="1.2"><rect x="1" y="2" width="10" height="9" rx="1.5"/><path d="M4 1v2M8 1v2M1 5h10"/></svg>
      10-DAY FORECAST
    </div>
    <div id="daily-list"></div>
  </div>

  <!-- DETAIL GRID -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="white"><circle cx="6" cy="6" r="5.5" stroke="white" stroke-width="1" fill="none"/><path d="M6 3v3.5l2 1" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>
      CONDITIONS
    </div>
    <div class="detail-grid" id="detail-grid"></div>
  </div>

  <!-- SUNRISE/SUNSET CARD -->
  <div class="card">
    <div class="card-header">
      <span style="font-size:12px">🌅</span> SUNRISE & SUNSET
    </div>
    <div class="sun-arc-wrap">
      <svg class="sun-arc-svg" id="sun-arc" viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f5a76e" stop-opacity="0.4"/>
            <stop offset="50%" stop-color="#f5d76e" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#f5a76e" stop-opacity="0.4"/>
          </linearGradient>
          <filter id="sunGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M20,75 Q180,-10 340,75" stroke="url(#arcGrad)" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
        <line x1="20" y1="75" x2="340" y2="75" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <circle id="sun-dot" cx="180" cy="10" r="6" fill="#f5d76e" filter="url(#sunGlow)"/>
        <text id="sun-rise-txt" x="20" y="68" font-size="11" fill="rgba(255,255,255,0.6)" font-family="-apple-system,sans-serif" text-anchor="middle">—</text>
        <text id="sun-set-txt" x="340" y="68" font-size="11" fill="rgba(255,255,255,0.6)" font-family="-apple-system,sans-serif" text-anchor="middle">—</text>
        <text id="daylight-txt" x="180" y="72" font-size="10" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif" text-anchor="middle">— hrs daylight</text>
      </svg>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       REAL RADAR CARD
  ════════════════════════════════════════════ -->
  <div class="card radar-card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M20.07 3.93a10 10 0 0 1 0 14.14"/><path d="M3.93 20.07a10 10 0 0 1 0-14.14"/>

<script>
// ─── WMO TABLE ────────────────────────────────────────────────
const WMO = {
  0:{label:'Clear Sky',icon:'☀️'},1:{label:'Mainly Clear',icon:'🌤️'},
  2:{label:'Partly Cloudy',icon:'⛅'},3:{label:'Overcast',icon:'☁️'},
  45:{label:'Foggy',icon:'🌫️'},48:{label:'Icy Fog',icon:'🌫️'},
  51:{label:'Light Drizzle',icon:'🌦️'},53:{label:'Drizzle',icon:'🌦️'},
  55:{label:'Heavy Drizzle',icon:'🌧️'},61:{label:'Light Rain',icon:'🌧️'},
  63:{label:'Rain',icon:'🌧️'},65:{label:'Heavy Rain',icon:'🌧️'},
  71:{label:'Light Snow',icon:'🌨️'},73:{label:'Snow',icon:'❄️'},
  75:{label:'Heavy Snow',icon:'❄️'},77:{label:'Snow Grains',icon:'🌨️'},
  80:{label:'Showers',icon:'🌦️'},81:{label:'Showers',icon:'🌦️'},
  82:{label:'Heavy Showers',icon:'⛈️'},85:{label:'Snow Showers',icon:'🌨️'},
  86:{label:'Heavy Snow Showers',icon:'❄️'},95:{label:'Thunderstorm',icon:'⛈️'},
  96:{label:'Thunderstorm w/ Hail',icon:'⛈️'},99:{label:'Thunderstorm w/ Hail',icon:'⛈️'}
};
const wmo = code => WMO[code] || {label:'Unknown',icon:'🌡️'};

function fmt12(h){if(h===0)return'12 AM';if(h===12)return'12 PM';return h>12?`${h-12} PM`:`${h} AM`;}
function fmtTime(iso){const d=new Date(iso);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')} ${ap}`;}
function dayLabel(iso,i){if(i===0)return'Today';const d=new Date(iso);return d.toLocaleDateString('en-US',{weekday:'short'});}
function uviLabel(v){if(v<3)return'Low';if(v<6)return'Moderate';if(v<8)return'High';if(v<11)return'Very High';return'Extreme';}
function windDir(deg){const dirs=['N','NE','E','SE','S','SW','W','NW'];return dirs[Math.round(deg/45)%8];}
function humanDuration(h){const hrs=Math.floor(h);const mins=Math.round((h-hrs)*60);return`${hrs}h ${mins}m`;}

// ─── BACKGROUND ────────────────────────────────────────────────
function getSkyColors(code,hour){
  const isNight=hour<6||hour>=20,isDusk=hour>=18&&hour<20,isDawn=hour>=5&&hour<7;
  if(isNight)return['#0a0a1a','#0d1a2e'];if(isDusk)return['#1a0a3a','#6b2d5e','#f5a76e'];
  if(isDawn)return['#1a2a4a','#e07b4a','#f5c878'];if([95,96,99,65,82].includes(code))return['#1a1a2e','#2d2d4e'];
  if([61,63,71,73,80,81].includes(code))return['#1a2a3a','#2a3a4a'];if([45,48,3].includes(code))return['#2a3a4a','#3a4a5a'];
  if([1,2].includes(code))return['#1a4a7a','#2a6aaa'];return['#1a3a6a','#2a5aaa'];
}
function applyBackground(code,hour){
  const colors=getSkyColors(code,hour),bg=document.getElementById('sky-bg');
  bg.style.background=colors.length===3?`linear-gradient(170deg,${colors[0]} 0%,${colors[1]} 50%,${colors[2]} 100%)`:`linear-gradient(170deg,${colors[0]} 0%,${colors[1]} 100%)`;
  const cl=document.getElementById('clouds-layer');cl.innerHTML='';
  const n=[3,2,45,48].includes(code)?8:[1,2].includes(code)?4:1;
  for(let i=0;i<n;i++){const div=document.createElement('div');div.className='cloud';const size=80+Math.random()*200;div.style.cssText=`width:${size}px;height:${size*0.5}px;top:${Math.random()*40}%;left:${Math.random()*100-20}%;animation-duration:${60+Math.random()*120}s;animation-delay:${-Math.random()*120}s;`;cl.appendChild(div);}
}

// ─── HOURLY CHART ──────────────────────────────────────────────
function drawHourlyChart(temps){
  const canvas=document.getElementById('hourly-chart');if(!canvas)return;
  const dpr=window.devicePixelRatio||1;canvas.width=canvas.offsetWidth*dpr;canvas.height=60*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);const W=canvas.offsetWidth,H=60,n=Math.min(temps.length,24);
  const slice=temps.slice(0,n),mn=Math.min(...slice),mx=Math.max(...slice),pad=10;
  const pts=slice.map((t,i)=>({x:pad+(i/(n-1))*(W-pad*2),y:H-pad-((t-mn)/(mx-mn||1))*(H-pad*2)}));
  const grad=ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'rgba(110,198,245,0.25)');grad.addColorStop(0.5,'rgba(245,215,110,0.25)');grad.addColorStop(1,'rgba(245,135,110,0.25)');
  ctx.beginPath();ctx.moveTo(pts[0].x,H);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  const lineGrad=ctx.createLinearGradient(0,0,W,0);
  lineGrad.addColorStop(0,'rgba(110,198,245,0.9)');lineGrad.addColorStop(0.5,'rgba(245,215,110,0.9)');lineGrad.addColorStop(1,'rgba(245,135,110,0.9)');
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++){const cp={(x:(pts[i-1].x+pts[i].x)/2,y:(pts[i-1].y+pts[i].y)/2)};ctx.quadraticCurveTo(pts[i-1].x,pts[i-1].y,cp.x,cp.y);}
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.strokeStyle=lineGrad;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
}

// ─── SUN ARC ───────────────────────────────────────────────────
function updateSunArc(sunriseISO,sunsetISO){
  const now=Date.now(),rise=new Date(sunriseISO).getTime(),set=new Date(sunsetISO).getTime();
  const total=set-rise,elapsed=Math.max(0,Math.min(now-rise,total)),pct=elapsed/total,t=pct;
  const bx=(1-t)*(1-t)*20+2*(1-t)*t*180+t*t*340,by=(1-t)*(1-t)*75+2*(1-t)*t*(-10)+t*t*75;
  document.getElementById('sun-dot').setAttribute('cx',bx);document.getElementById('sun-dot').setAttribute('cy',by);
  document.getElementById('sun-rise-txt').textContent=fmtTime(sunriseISO);
  document.getElementById('sun-set-txt').textContent=fmtTime(sunsetISO);
  document.getElementById('daylight-txt').textContent=humanDuration((set-rise)/3600000)+' of daylight';
}

// ══════════════════════════════════════════════════════════════
//  REAL RAINVIEWER RADAR
// ══════════════════════════════════════════════════════════════
const Radar = (() => {
  // Tile math helpers
  function latLonToTile(lat, lon, zoom) {
    const n = Math.pow(2, zoom);
    const x = Math.floor((lon + 180) / 360 * n);
    const latRad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x, y };
  }

  function tileToLatLon(x, y, zoom) {
    const n = Math.pow(2, zoom);
    const lon = x / n * 360 - 180;
    const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
    return { lat: latRad * 180 / Math.PI, lon };
  }

  // State
  let state = {
    lat: 41.8781,
    lon: -87.6298,
    zoom: 7,
    frames: [],
    currentFrame: 0,
    playing: false,
    playTimer: null,
    baseTilesLoaded: false,
    tileCache: new Map(),
  };

  const W = 398, H = 220;

  function getContainerSize() {
    const el = document.getElementById('radar-map-container');
    return { w: el.offsetWidth || W, h: el.offsetHeight || H };
  }

  function setCanvasSize() {
    const { w, h } = getContainerSize();
    const dpr = window.devicePixelRatio || 1;
    ['radar-base-canvas', 'radar-overlay-canvas'].forEach(id => {
      const c = document.getElementById(id);
      c.width = w * dpr;
      c.height = h * dpr;
      c.getContext('2d').scale(dpr, dpr);
    });
  }

  // Convert geo coord to pixel offset relative to center tile
  function geoToPixel(lat, lon, centerTile, zoom) {
    const { w, h } = getContainerSize();
    const TILE_SIZE = 256;
    const n = Math.pow(2, zoom);
    const worldX = (lon + 180) / 360 * n * TILE_SIZE;
    const latRad = lat * Math.PI / 180;
    const worldY = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n * TILE_SIZE;
    const centerWorldX = centerTile.x * TILE_SIZE + TILE_SIZE / 2;
    const centerWorldY = centerTile.y * TILE_SIZE + TILE_SIZE / 2;
    return {
      x: w / 2 + (worldX - centerWorldX),
      y: h / 2 + (worldY - centerWorldY)
    };
  }

  // Load and cache a tile image
  function loadTile(url) {
    if (state.tileCache.has(url)) return state.tileCache.get(url);
    const p = new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = url;
    });
    state.tileCache.set(url, p);
    return p;
  }

  // Draw tiles on canvas
  async function drawTileLayer(canvasId, buildUrl, opacity = 1) {
    const canvas = document.getElementById(canvasId);
    const { w, h } = getContainerSize();
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    const TILE_SIZE = 256;
    const zoom = state.zoom;
    const centerTile = latLonToTile(state.lat, state.lon, zoom);
    const tilesX = Math.ceil(w / TILE_SIZE) + 2;
    const tilesY = Math.ceil(h / TILE_SIZE) + 2;
    const halfX = Math.ceil(tilesX / 2);
    const halfY = Math.ceil(tilesY / 2);

    // Where the center tile's top-left pixel is
    const centerPixel = geoToPixel(state.lat, state.lon, centerTile, zoom);
    const centerTileOriginX = centerPixel.x - TILE_SIZE / 2;
    const centerTileOriginY = centerPixel.y - TILE_SIZE / 2;

    const promises = [];
    const positions = [];

    for (let dy = -halfY; dy <= halfY; dy++) {
      for (let dx = -halfX; dx <= halfX; dx++) {
        const tx = centerTile.x + dx;
        const ty = centerTile.y + dy;
        const n = Math.pow(2, zoom);
        const wrappedTx = ((tx % n) + n) % n;
        if (ty < 0 || ty >= n) continue;

        const url = buildUrl(zoom, wrappedTx, ty);
        const px = centerTileOriginX + dx * TILE_SIZE;
        const py = centerTileOriginY + dy * TILE_SIZE;
        promises.push(loadTile(url));
        positions.push({ px, py });
      }
    }

    const images = await Promise.all(promises);
    ctx.globalAlpha = opacity;
    images.forEach((img, i) => {
      if (img) ctx.drawImage(img, positions[i].px, positions[i].py, TILE_SIZE, TILE_SIZE);
    });
    ctx.globalAlpha = 1;
  }

  // OpenStreetMap base tiles (dark-styled via CartoDB Dark Matter)
  function baseUrl(z, x, y) {
    const subdomains = ['a','b','c'];
    const s = subdomains[(x + y) % 3];
    return `https://${s}.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`;
  }

  async function drawBase() {
    await drawTileLayer('radar-base-canvas', baseUrl, 1);
  }

  // RainViewer radar tile URL
  function radarUrl(path, z, x, y) {
    // RainViewer v2 public API: no key needed
    return `https://tilecache.rainviewer.com${path}/256/${z}/${x}/${y}/2/1_1.png`;
  }

  async function drawRadarFrame(frameIdx) {
    if (!state.frames.length) return;
    const frame = state.frames[frameIdx];
    await drawTileLayer('radar-overlay-canvas',
      (z, x, y) => radarUrl(frame.path, z, x, y),
      0.75
    );
    updateTimeLabel(frame.time);
    updateScrubber(frameIdx);
  }

  function updateTimeLabel(unixTs) {
    const d = new Date(unixTs * 1000);
    const now = Date.now();
    const diffMin = Math.round((now - d.getTime()) / 60000);
    const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    let label;
    if (diffMin <= 5) label = `Now — ${timeStr}`;
    else if (diffMin < 60) label = `${diffMin}m ago — ${timeStr}`;
    else label = timeStr;
    document.getElementById('radar-time-label').textContent = label;
  }

  function updateScrubber(idx) {
    const total = state.frames.length - 1;
    const pct = total > 0 ? (idx / total) * 100 : 0;
    document.getElementById('radar-scrubber-fill').style.width = pct + '%';
    document.getElementById('radar-scrubber-thumb').style.left = pct + '%';
  }

  // Fetch available radar frames from RainViewer
  async function fetchFrames() {
    document.getElementById('radar-status-text').textContent = 'LOADING';
    try {
      const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await r.json();
      // Use past radar frames (not nowcast/satellite)
      const past = data.radar?.past || [];
      const nowcast = data.radar?.nowcast || [];
      state.frames = [...past, ...nowcast];
      document.getElementById('radar-status-text').textContent = 'LIVE';
      return true;
    } catch (e) {
      document.getElementById('radar-status-text').textContent = 'OFFLINE';
      document.getElementById('radar-time-label').textContent = 'Unavailable';
      return false;
    }
  }

  async function init(lat, lon) {
    state.lat = lat;
    state.lon = lon;
    state.tileCache.clear();
    setCanvasSize();

    // Draw base map first
    await drawBase();

    // Fetch radar frames
    const ok = await fetchFrames();
    if (!ok) return;

    // Show latest frame
    state.currentFrame = state.frames.length - 1;
    await drawRadarFrame(state.currentFrame);

    // Start auto-play after a brief pause
    setTimeout(() => startPlay(), 1500);
  }

  async function goToFrame(idx) {
    state.currentFrame = Math.max(0, Math.min(idx, state.frames.length - 1));
    await drawRadarFrame(state.currentFrame);
  }

  function startPlay() {
    if (state.playing) return;
    state.playing = true;
    updatePlayIcon(true);
    state.playTimer = setInterval(async () => {
      const next = (state.currentFrame + 1) % state.frames.length;
      await goToFrame(next);
    }, 700);
  }

  function stopPlay() {
    state.playing = false;
    updatePlayIcon(false);
    clearInterval(state.playTimer);
  }

  function togglePlay() {
    state.playing ? stopPlay() : startPlay();
  }

  function updatePlayIcon(playing) {
    const icon = document.getElementById('radar-play-icon');
    if (playing) {
      // Pause icon
      icon.innerHTML = '<rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/>';
    } else {
      // Play icon
      icon.innerHTML = '<polygon points="2,1 11,6 2,11"/>';
    }
  }

  function zoomIn() {
    if (state.zoom >= 10) return;
    state.zoom++;
    state.tileCache.clear();
    drawBase().then(() => drawRadarFrame(state.currentFrame));
  }

  function zoomOut() {
    if (state.zoom <= 4) return;
    state.zoom--;
    state.tileCache.clear();
    drawBase().then(() => drawRadarFrame(state.currentFrame));
  }

  // Scrubber interaction
  function setupScrubber() {
    const track = document.getElementById('radar-scrubber-track');
    let dragging = false;

    function seekFromEvent(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const idx = Math.round(pct * (state.frames.length - 1));
      stopPlay();
      goToFrame(idx);
    }

    track.addEventListener('mousedown', e => { dragging = true; seekFromEvent(e); });
    track.addEventListener('touchstart', e => { dragging = true; seekFromEvent(e); }, { passive: true });
    window.addEventListener('mousemove', e => { if (dragging) seekFromEvent(e); });
    window.addEventListener('touchmove', e => { if (dragging) seekFromEvent(e); }, { passive: true });
    window.addEventListener('mouseup', () => { dragging = false; });
    window.addEventListener('touchend', () => { dragging = false; });
  }

  function setup() {
    document.getElementById('radar-play-btn').addEventListener('click', togglePlay);
    document.getElementById('radar-zoom-in').addEventListener('click', zoomIn);
    document.getElementById('radar-zoom-out').addEventListener('click', zoomOut);
    setupScrubber();
  }

  return { init, setup, zoomIn, zoomOut };
})();

// ─── RENDER ─────────────────────────────────────────────────
function render(data, city) {
  const h=data.hourly,d=data.daily,c=data.current;
  const nowHr=new Date().getHours();
  const nowIdx=h.time.findIndex(t=>new Date(t).getHours()===nowHr)||0;
  const code=c.weather_code,w=wmo(code);
  const tempNow=Math.round(c.temperature_2m),feelsLike=Math.round(c.apparent_temperature);
  const hiToday=Math.round(d.temperature_2m_max[0]),loToday=Math.round(d.temperature_2m_min[0]);

  applyBackground(code,nowHr);

  document.getElementById('city-name').textContent=city;
  document.getElementById('current-condition').textContent=w.label;
  document.getElementById('temp-big').textContent=`${tempNow}°`;
  document.getElementById('temp-range-top').textContent=`H: ${hiToday}°  L: ${loToday}°`;

  const nextRain=h.precipitation_probability.slice(nowIdx,nowIdx+6).findIndex(p=>p>40);
  document.getElementById('summary-banner').textContent=nextRain>=0
    ?`Rain possible in ${nextRain+1} hour${nextRain?'s':''}. High of ${hiToday}° expected this afternoon.`
    :`${w.label} conditions for the rest of the day. High of ${hiToday}° today.`;

  // Hourly
  const hourlyEl=document.getElementById('hourly-scroll');hourlyEl.innerHTML='';
  for(let i=0;i<24;i++){
    const idx=nowIdx+i;if(idx>=h.time.length)break;
    const t=new Date(h.time[idx]),hr=t.getHours(),label=i===0?'Now':fmt12(hr);
    const temp=Math.round(h.temperature_2m[idx]),wcode=h.weather_code[idx],precip=h.precipitation_probability[idx]||0,wi=wmo(wcode);
    const item=document.createElement('div');item.className='hour-item';
    item.innerHTML=`<span class="hour-label ${i===0?'now':''}">${label}</span><span class="hour-icon">${wi.icon}</span><span class="hour-temp">${temp}°</span>${precip>20?`<span class="hour-precip">${precip}%</span>`:'<span class="hour-precip" style="opacity:0">0%</span>'}`;
    hourlyEl.appendChild(item);
  }
  setTimeout(()=>drawHourlyChart(h.temperature_2m.slice(nowIdx,nowIdx+24)),100);

  // Daily
  const allTemps=[...d.temperature_2m_max,...d.temperature_2m_min];
  const globalMin=Math.min(...allTemps),globalMax=Math.max(...allTemps);
  const dailyEl=document.getElementById('daily-list');dailyEl.innerHTML='';
  for(let i=0;i<Math.min(10,d.time.length);i++){
    const hi=Math.round(d.temperature_2m_max[i]),lo=Math.round(d.temperature_2m_min[i]);
    const dw=wmo(d.weather_code[i]),precip=d.precipitation_probability_max[i]||0;
    const loFrac=(lo-globalMin)/(globalMax-globalMin),hiFrac=(hi-globalMin)/(globalMax-globalMin);
    const row=document.createElement('div');row.className='day-row';
    row.innerHTML=`<span class="day-name">${dayLabel(d.time[i],i)}</span><span class="day-icon">${dw.icon}</span><span class="day-precip">${precip>10?precip+'%':''}</span><div class="day-range"><span class="day-lo">${lo}°</span><div class="range-bar-wrap"><div class="range-bar-fill" style="left:${loFrac*100}%;right:${(1-hiFrac)*100}%"></div></div><span class="day-hi">${hi}°</span></div>`;
    dailyEl.appendChild(row);
  }

  // Details
  const wind=Math.round(c.wind_speed_10m),windDeg=c.wind_direction_10m,humidity=c.relative_humidity_2m;
  const uvi=Math.round(c.uv_index),vis=Math.round((c.visibility||0)/1000),pressure=Math.round(c.pressure_msl||c.surface_pressure);
  const dew=Math.round(c.dew_point_2m),cloud=c.cloud_cover;
  const details=[
    {icon:'☀️',label:'UV INDEX',value:`${uvi}`,sub:uviLabel(uvi),extra:`<div class="uv-bar-wrap"><div class="uv-dot" style="left:${Math.min(uvi/12,1)*100}%"></div></div>`},
    {icon:'💧',label:'HUMIDITY',value:`${humidity}%`,sub:`Dew point ${dew}°`},
    {icon:'🌬️',label:'WIND',value:`${wind} mph`,sub:windDir(windDeg)},
    {icon:'👁️',label:'VISIBILITY',value:`${vis} km`,sub:vis>10?'Clear':vis>4?'Moderate':'Low'},
    {icon:'🌡️',label:'FEELS LIKE',value:`${feelsLike}°`,sub:feelsLike<tempNow?'Wind makes it colder':feelsLike>tempNow?'Humidity makes it hotter':'Similar to actual'},
    {icon:'☁️',label:'CLOUD COVER',value:`${cloud}%`,sub:cloud<20?'Clear':cloud<60?'Partly cloudy':'Overcast'},
    {icon:'🔵',label:'PRESSURE',value:`${pressure}`,sub:'hPa'},
    {icon:'💦',label:'PRECIPITATION',value:`${Math.round((d.precipitation_sum?.[0]||0)*10)/10}`,sub:'mm today'},
  ];
  const gridEl=document.getElementById('detail-grid');gridEl.innerHTML='';
  details.forEach(det=>{
    const cell=document.createElement('div');cell.className='detail-cell';
    cell.innerHTML=`<div class="detail-label">${det.icon} ${det.label}</div><div class="detail-value">${det.value}</div><div class="detail-sub">${det.sub}</div>${det.extra||''}`;
    gridEl.appendChild(cell);
  });

  if(d.sunrise&&d.sunset)updateSunArc(d.sunrise[0],d.sunset[0]);
  document.getElementById('updated-label').textContent=`Updated ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
  document.getElementById('app').classList.add('loaded');
  const loader=document.getElementById('loader');loader.classList.add('hidden');
  setTimeout(()=>loader.style.display='none',700);
}

// ─── FETCH ─────────────────────────────────────────────────────
async function getCityName(lat,lon){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);const j=await r.json();return j.address?.city||j.address?.town||j.address?.village||j.address?.county||'Your Location';}catch{return'Your Location';}
}

async function fetchWeather(lat,lon){
  const params=new URLSearchParams({latitude:lat,longitude:lon,current:['temperature_2m','apparent_temperature','relative_humidity_2m','weather_code','wind_speed_10m','wind_direction_10m','uv_index','visibility','pressure_msl','surface_pressure','dew_point_2m','cloud_cover','precipitation'].join(','),hourly:['temperature_2m','weather_code','precipitation_probability','precipitation','wind_speed_10m','visibility','relative_humidity_2m'].join(','),daily:['weather_code','temperature_2m_max','temperature_2m_min','sunrise','sunset','precipitation_sum','precipitation_probability_max','wind_speed_10m_max','uv_index_max'].join(','),wind_speed_unit:'mph',forecast_days:10,timezone:'auto'});
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);return r.json();
}

let currentLat = 41.8781, currentLon = -87.6298;

async function init(){
  if(!navigator.geolocation){document.getElementById('city-name').textContent='Location unavailable';return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const{latitude:lat,longitude:lon}=pos.coords;
    currentLat=lat;currentLon=lon;
    const[data,city]=await Promise.all([fetchWeather(lat,lon),getCityName(lat,lon)]);
    render(data,city);
    Radar.init(lat,lon);
  },async()=>{
    const[data,city]=await Promise.all([fetchWeather(41.8781,-87.6298),Promise.resolve('Chicago')]);
    render(data,city);
    Radar.init(41.8781,-87.6298);
  });
}

document.getElementById('refresh-btn').addEventListener('click',()=>{
  document.getElementById('app').classList.remove('loaded');
  const loader=document.getElementById('loader');loader.style.display='flex';loader.classList.remove('hidden');
  init();
});

// ─── SEARCH ────────────────────────────────────────────────────
let searchTimeout=null;
function openSearch(){const o=document.getElementById('search-overlay');o.classList.add('open');setTimeout(()=>document.getElementById('search-input').focus(),100);}
function closeSearch(){const o=document.getElementById('search-overlay');o.classList.remove('open');document.getElementById('search-input').value='';document.getElementById('search-clear').classList.remove('visible');renderSearchResults([]);document.getElementById('search-status').textContent='Type a city name or zip code';document.getElementById('search-status').style.display='';document.getElementById('search-section-label').textContent='SUGGESTIONS';}
async function geocodeQuery(q){const isZip=/^\d{5}$/.test(q.trim());const url=isZip?`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(q.trim())}&countrycodes=us&format=json&limit=5&addressdetails=1`:`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`;const r=await fetch(url,{headers:{'Accept-Language':'en'}});return r.json();}
function resultLabel(item){const a=item.address||{};const city=a.city||a.town||a.village||a.municipality||a.county||item.display_name.split(',')[0];const state=a.state||'';const country=a.country_code?.toUpperCase()||'';const parts=[city];if(state)parts.push(state);if(country&&country!=='US')parts.push(country);return{name:city,sub:parts.slice(1).join(', ')};}
function renderSearchResults(results){const container=document.getElementById('search-results');container.querySelectorAll('.search-result-item').forEach(el=>el.remove());results.forEach(item=>{const lbl=resultLabel(item);const div=document.createElement('div');div.className='search-result-item';div.innerHTML=`<div class="search-result-icon">📍</div><div class="search-result-text"><div class="search-result-name">${lbl.name}</div>${lbl.sub?`<div class="search-result-sub">${lbl.sub}</div>`:''}</div><div class="search-result-arrow">›</div>`;div.addEventListener('click',()=>{closeSearch();loadLocation(parseFloat(item.lat),parseFloat(item.lon),lbl.name);});container.appendChild(div);});}
async function doSearch(q){if(!q.trim()){renderSearchResults([]);document.getElementById('search-status').textContent='Type a city name or zip code';document.getElementById('search-status').style.display='';document.getElementById('search-section-label').textContent='SUGGESTIONS';return;}document.getElementById('search-status').textContent='Searching…';document.getElementById('search-status').style.display='';document.getElementById('search-section-label').textContent='RESULTS';renderSearchResults([]);try{const results=await geocodeQuery(q);if(!results.length){document.getElementById('search-status').textContent='No results found. Try a different city or zip.';}else{document.getElementById('search-status').style.display='none';renderSearchResults(results);}}catch{document.getElementById('search-status').textContent='Search failed. Check your connection.';}}
async function loadLocation(lat,lon,city){
  document.getElementById('app').classList.remove('loaded');
  const loader=document.getElementById('loader');loader.style.display='flex';loader.classList.remove('hidden');
  try{const data=await fetchWeather(lat,lon);render(data,city);Radar.init(lat,lon);}
  catch{loader.classList.add('hidden');document.getElementById('app').classList.add('loaded');}
}

document.getElementById('search-trigger').addEventListener('click',openSearch);
document.getElementById('search-cancel').addEventListener('click',closeSearch);
document.getElementById('search-input').addEventListener('input',e=>{const val=e.target.value;document.getElementById('search-clear').classList.toggle('visible',val.length>0);clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>doSearch(val),380);});
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='Enter'){clearTimeout(searchTimeout);doSearch(e.target.value);}});
document.getElementById('search-clear').addEventListener('click',()=>{document.getElementById('search-input').value='';document.getElementById('search-clear').classList.remove('visible');renderSearchResults([]);document.getElementById('search-status').textContent='Type a city name or zip code';document.getElementById('search-status').style.display='';document.getElementById('search-input').focus();});

// Boot
Radar.setup();
init();
</script>
