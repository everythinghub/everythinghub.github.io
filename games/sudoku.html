<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Sudoku</title>
    <style>
        /* CSS goes here */
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 1px; border: 2px solid #000; }
        .cell { width: 40px; height: 40px; text-align: center; font-size: 20px; border: 1px solid #ccc; box-sizing: border-box; }
        /* Add more styling for 3x3 blocks to look like a classic Sudoku */
    </style>
</head>
<body>
    <h1>Sudoku</h1>
    <div class="grid" id="sudoku-grid">
        <!-- Javascript will generate the 81 input cells here -->
    </div>
    
    <script>
        // JavaScript game logic (board generation, validation, timer) goes here
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('sudoku-grid');
            for(let i = 0; i < 81; i++) {
                const cell = document.createElement('input');
                cell.type = 'number';
                cell.min = '1';
                cell.max = '9';
                cell.className = 'cell';
                grid.appendChild(cell);
            }
        });
    </script>
</body>
</html>
