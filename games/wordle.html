<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Wordle</title>
    <style>
        :root {
            --bg: #121213;
            --text: #ffffff;
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: #3a3a3c;
            --border: #3a3a3c;
            --active-border: #565758;
            --key-bg: #818384;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrolling */
        }

        header {
            width: 100%;
            text-align: center;
            padding: 5px 0;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border);
        }

        #game-wrap {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            flex: 1;
            width: 100%;
            max-width: 350px;
            padding: 5px;
            box-sizing: border-box;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tile {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Animations */
        .tile.pop { animation: pop 0.1s ease-in-out; border-color: var(--active-border); }
        .tile.flip { animation: flip 0.5s ease-in; }
        .tile.win { animation: bounce 0.5s ease-in-out; }

        @keyframes pop { 50% { transform: scale(1.1); } }
        @keyframes flip {
            0% { transform: rotateX(0); }
            45% { transform: rotateX(90deg); background: transparent; }
            55% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        @keyframes bounce {
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .tile[data-state="correct"] { background-color: var(--correct); border-color: var(--correct); }
        .tile[data-state="present"] { background-color: var(--present); border-color: var(--present); }
        .tile[data-state="absent"] { background-color: var(--absent); border-color: var(--absent); }

        #keyboard { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            width: 100%; 
        }

        .row { 
            display: flex; 
            justify-content: center; 
            gap: 4px; 
        }

        .key {
            background-color: var(--key-bg);
            border: none;
            border-radius: 4px;
            color: white;
            height: 40px; /* Slimmer keys */
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .key.large { flex: 1.5; font-size: 0.65rem; }
        .key:active { background-color: #666; }

        #message {
            position: absolute;
            top: 50px;
            background: white;
            color: black;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<header>WORDLE</header>
<div id="message"></div>

<div id="game-wrap">
    <div id="board"></div>
    <div id="keyboard"></div>
</div>

<script>
    const WORDS = ["SWIFT", "LIGHT", "STORM", "BREAD", "PIVOT", "GRAPE", "CHASE", "FLUTE", "BRICK", "SOUND"];
    const targetWord = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
    
    let currentRow = 0;
    let currentCol = 0;
    let guesses = ["", "", "", "", "", ""];
    let gameOver = false;

    // Board Init
    const board = document.getElementById('board');
    for (let i = 0; i < 30; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        board.appendChild(tile);
    }

    // Keyboard Init
    const layout = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L'],
        ['ENTER', 'Z','X','C','V','B','N','M', 'DEL']
    ];

    layout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';
        row.forEach(key => {
            const btn = document.createElement('button');
            btn.textContent = key;
            btn.className = 'key' + (key.length > 1 ? ' large' : '');
            btn.onclick = (e) => { e.preventDefault(); handleInput(key); };
            rowDiv.appendChild(btn);
        });
        document.getElementById('keyboard').appendChild(rowDiv);
    });

    function handleInput(key) {
        if (gameOver) return;
        const currentGuess = guesses[currentRow];

        if (key === 'ENTER') {
            if (currentGuess.length < 5) return showMessage("Short");
            revealRow();
        } else if (key === 'DEL' || key === 'BACKSPACE') {
            if (currentCol > 0) {
                currentCol--;
                guesses[currentRow] = currentGuess.slice(0, -1);
                const tile = document.getElementById(`tile-${currentRow * 5 + currentCol}`);
                tile.textContent = "";
                tile.classList.remove('pop');
            }
        } else if (/^[A-Z]$/.test(key.toUpperCase()) && currentCol < 5) {
            const tile = document.getElementById(`tile-${currentRow * 5 + currentCol}`);
            tile.textContent = key.toUpperCase();
            tile.classList.add('pop');
            guesses[currentRow] += key.toUpperCase();
            currentCol++;
        }
    }

    async function revealRow() {
        const guess = guesses[currentRow];
        const rowStart = currentRow * 5;
        gameOver = true;

        for (let i = 0; i < 5; i++) {
            const tile = document.getElementById(`tile-${rowStart + i}`);
            tile.classList.add('flip');
            await new Promise(r => setTimeout(r, 200));
            
            let state = 'absent';
            if (guess[i] === targetWord[i]) state = 'correct';
            else if (targetWord.includes(guess[i])) state = 'present';
            
            tile.setAttribute('data-state', state);
            await new Promise(r => setTimeout(r, 200));
        }

        if (guess === targetWord) {
            showMessage("Winner!");
            animateWin(rowStart);
        } else if (currentRow === 5) {
            showMessage(targetWord);
        } else {
            currentRow++;
            currentCol = 0;
            gameOver = false;
        }
    }

    function animateWin(rowStart) {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => document.getElementById(`tile-${rowStart + i}`).classList.add('win'), i * 80);
        }
    }

    function showMessage(msg) {
        const m = document.getElementById('message');
        m.textContent = msg;
        m.style.opacity = 1;
        setTimeout(() => m.style.opacity = 0, 1500);
    }

    window.onkeydown = (e) => handleInput(e.key.toUpperCase());
</script>
</body>
</html>
