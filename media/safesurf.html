<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeSurf</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0077b6;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --shadow: 0 2px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --radius: 14px;
    --tag-bg: rgba(0,119,182,0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #48cae4;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --shadow: 0 2px 20px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      --tag-bg: rgba(72,202,228,0.1);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 52px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--border-strong);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  @media (prefers-color-scheme: dark) {
    nav { background: rgba(0,0,0,0.72); }
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }

  .nav-logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #0077b6 0%, #48cae4 100%);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-logo-icon svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-logo-safe { color: var(--accent); }

  .nav-links { display: flex; gap: 24px; list-style: none; }
  .nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  .nav-links a:hover { color: var(--text); }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 24px 40px;
    text-align: center;
    transition: padding 0.35s ease;
  }

  .hero.compact { padding: 28px 24px 24px; }

  .hero-logo {
    width: 76px;
    height: 76px;
    background: linear-gradient(145deg, #0077b6 0%, #48cae4 55%, #90e0ef 100%);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    box-shadow: 0 8px 32px rgba(0,119,182,0.3);
    transition: opacity 0.3s, transform 0.3s, max-height 0.35s;
    max-height: 120px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .hero-logo svg { width: 42px; height: 42px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .hero.compact .hero-logo {
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    transform: scale(0.8);
  }

  .hero-title {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -1.8px;
    line-height: 1.06;
    margin-bottom: 8px;
    transition: font-size 0.35s ease, letter-spacing 0.35s ease;
  }

  .hero-title .safe { color: var(--accent); }

  .hero.compact .hero-title { font-size: 26px; letter-spacing: -0.8px; }

  .hero-subtitle {
    font-size: 17px;
    color: var(--muted);
    margin-bottom: 32px;
    transition: opacity 0.35s, max-height 0.35s;
    max-height: 60px;
    overflow: hidden;
  }

  .hero.compact .hero-subtitle { opacity: 0; max-height: 0; margin-bottom: 16px; }

  .search-wrap { position: relative; width: 100%; max-width: 680px; }

  .search-icon-left {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    height: 52px;
    padding: 0 56px 0 50px;
    font-size: 17px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 1.5px solid var(--border-strong);
    border-radius: 26px;
    outline: none;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, border-color 0.2s;
    -webkit-appearance: none;
  }

  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,119,182,0.14), var(--shadow); }

  @media (prefers-color-scheme: dark) {
    #searchInput:focus { box-shadow: 0 0 0 4px rgba(72,202,228,0.18), var(--shadow); }
  }

  .clear-btn {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: var(--muted); border: none; border-radius: 50%;
    width: 20px; height: 20px; display: none; align-items: center;
    justify-content: center; cursor: pointer; color: white;
    font-size: 11px; line-height: 1; padding: 0; transition: background 0.15s;
  }
  .clear-btn:hover { background: var(--text); }
  .clear-btn.visible { display: flex; }

  .tabs {
    display: flex; gap: 4px; margin-top: 20px;
    background: rgba(0,0,0,0.04); padding: 4px;
    border-radius: 12px; max-width: 360px;
  }
  @media (prefers-color-scheme: dark) { .tabs { background: rgba(255,255,255,0.06); } }

  .tab {
    flex: 1; padding: 7px 16px; border-radius: 9px; border: none;
    background: transparent; color: var(--muted); font-family: inherit;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  #results { max-width: 720px; margin: 0 auto; padding: 16px 24px 80px; }
  .results-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; padding-left: 4px; }

  .answer-card {
    background: var(--card); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px;
    box-shadow: var(--shadow); display: flex; gap: 18px; align-items: flex-start;
  }
  .answer-icon {
    width: 42px; height: 42px; border-radius: 10px; background: var(--tag-bg);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent);
  }
  .answer-icon svg { width: 22px; height: 22px; }
  .answer-body h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .answer-body p { font-size: 14px; line-height: 1.55; color: var(--muted); }
  .answer-source {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 10px;
    font-size: 12px; color: var(--accent); text-decoration: none;
    padding: 4px 10px; border-radius: 20px; background: var(--tag-bg); transition: opacity 0.15s;
  }
  .answer-source:hover { opacity: 0.75; }

  .result-item {
    background: var(--card); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px;
    box-shadow: var(--shadow); transition: box-shadow 0.2s, transform 0.15s; cursor: pointer;
  }
  .result-item:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .result-item:active { transform: scale(0.995); }
  .result-url { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .result-favicon { width: 16px; height: 16px; border-radius: 4px; background: var(--bg); flex-shrink: 0; }
  .result-domain { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-title { font-size: 16px; font-weight: 600; color: var(--accent); margin-bottom: 6px; line-height: 1.3; letter-spacing: -0.2px; }
  .result-snippet { font-size: 14px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .related-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 10px; padding-left: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { padding: 6px 14px; border-radius: 20px; background: var(--card); border: 0.5px solid var(--border-strong); font-size: 13px; color: var(--text); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .tag:hover { background: var(--tag-bg); border-color: var(--accent); color: var(--accent); }

  .empty-state { text-align: center; padding: 64px 24px; }
  .empty-state svg { width: 56px; height: 56px; color: var(--muted); opacity: 0.4; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.3px; }
  .empty-state p { font-size: 15px; color: var(--muted); max-width: 300px; margin: 0 auto; line-height: 1.5; }

  .loader { display: flex; justify-content: center; padding: 48px; }
  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-card { background: rgba(255,59,48,0.06); border: 0.5px solid rgba(255,59,48,0.2); border-radius: var(--radius); padding: 18px 20px; font-size: 14px; color: #ff3b30; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 32px; max-width: 580px; }
  .suggestion-chip {
    padding: 8px 16px; border-radius: 20px; background: var(--card);
    border: 0.5px solid var(--border-strong); font-size: 14px; color: var(--text);
    cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .suggestion-chip svg { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
  .suggestion-chip:hover { background: var(--tag-bg); border-color: var(--accent); color: var(--accent); }
  .suggestion-chip:hover svg { color: var(--accent); }

  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    .hero { padding: 48px 16px 32px; }
    .hero.compact { padding: 20px 16px 16px; }
    .hero-title { font-size: 38px; }
    .hero.compact .hero-title { font-size: 22px; }
    #results { padding: 12px 16px 60px; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="goHome()">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24">
        <path d="M2 13.5c1.5-2.5 3.5-4 6-4s4 2.5 6 2.5 4-2.5 6-2.5"/>
        <path d="M2 18c1.5-2.5 3.5-4 6-4s4 2.5 6 2.5 4-2.5 6-2.5"/>
        <path d="M10 6l2.5-3 2.5 5 2-2.5"/>
      </svg>
    </div>
    <span><span class="nav-logo-safe">Safe</span>Surf</span>
  </div>
  <ul class="nav-links">
    <li><a href="#">Web</a></li>
    <li><a href="#">Images</a></li>
    <li><a href="#">News</a></li>
    <li><a href="#">Maps</a></li>
  </ul>
</nav>

<div class="hero" id="hero">
  <div class="hero-logo">
    <svg viewBox="0 0 24 24">
      <path d="M2 13.5c1.5-2.5 3.5-4 6-4s4 2.5 6 2.5 4-2.5 6-2.5"/>
      <path d="M2 18c1.5-2.5 3.5-4 6-4s4 2.5 6 2.5 4-2.5 6-2.5"/>
      <path d="M10 6l2.5-3 2.5 5 2-2.5"/>
    </svg>
  </div>

  <div class="hero-title"><span class="safe">Safe</span>Surf</div>
  <div class="hero-subtitle">Explore the web, safely and simply.</div>

  <div class="search-wrap">
    <svg class="search-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="searchInput" placeholder="Search the web…" autocomplete="off" spellcheck="false" />
    <button class="clear-btn" id="clearBtn" aria-label="Clear">&#x2715;</button>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-tab="web">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Web
    </button>
    <button class="tab" data-tab="instant">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Instant
    </button>
    <button class="tab" data-tab="related">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Related
    </button>
  </div>

  <div class="suggestions" id="suggestions">
    <div class="suggestion-chip" onclick="doSearch('weather forecast')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/></svg>
      Weather
    </div>
    <div class="suggestion-chip" onclick="doSearch('artificial intelligence news')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      AI news
    </div>
    <div class="suggestion-chip" onclick="doSearch('latest technology news')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Tech news
    </div>
    <div class="suggestion-chip" onclick="doSearch('science discoveries 2025')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>
      Science
    </div>
    <div class="suggestion-chip" onclick="doSearch('space exploration news')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L8 7H3l4 4-2 6 7-3 7 3-2-6 4-4h-5z"/></svg>
      Space
    </div>
    <div class="suggestion-chip" onclick="doSearch('world news today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      World news
    </div>
    <div class="suggestion-chip" onclick="doSearch('health and wellness tips')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Health
    </div>
    <div class="suggestion-chip" onclick="doSearch('financial markets today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Finance
    </div>
  </div>
</div>

<div id="results"></div>

<script>
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const hero = document.getElementById('hero');
const results = document.getElementById('results');
const tabs = document.getElementById('tabs');
const suggestions = document.getElementById('suggestions');

let lastQuery = '', currentTab = 'web', cachedData = null, searchTimer = null;

input.addEventListener('input', () => {
  clearBtn.classList.toggle('visible', input.value.length > 0);
  clearTimeout(searchTimer);
  if (input.value.trim().length > 1) searchTimer = setTimeout(() => search(input.value.trim()), 500);
  else if (!input.value.trim()) goHome();
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && input.value.trim()) { clearTimeout(searchTimer); search(input.value.trim()); }
});

clearBtn.addEventListener('click', () => {
  input.value = ''; clearBtn.classList.remove('visible'); goHome(); input.focus();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    if (cachedData) renderTab(cachedData);
  });
});

function doSearch(q) { input.value = q; clearBtn.classList.add('visible'); search(q); }

function goHome() {
  lastQuery = ''; cachedData = null;
  hero.classList.remove('compact');
  suggestions.style.display = 'flex';
  tabs.style.display = 'none';
  results.innerHTML = '';
}

async function search(q) {
  if (q === lastQuery) return;
  lastQuery = q;
  hero.classList.add('compact');
  suggestions.style.display = 'none';
  tabs.style.display = 'flex';
  results.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  try {
    const res = await fetch('https://api.duckduckgo.com/?q=' + encodeURIComponent(q) + '&format=json&no_html=1&skip_disambig=1&t=SafeSurf');
    cachedData = await res.json();
    renderTab(cachedData);
  } catch {
    results.innerHTML = '<div class="error-card">Could not load results. Check your connection and try again.</div>';
  }
}

function renderTab(data) {
  if (currentTab === 'web') renderWeb(data);
  else if (currentTab === 'instant') renderInstant(data);
  else renderRelated(data);
}

function renderWeb(data) {
  const items = [];
  if (data.AbstractText) items.push({ title: data.Heading || lastQuery, snippet: data.AbstractText, url: data.AbstractURL, source: data.AbstractSource });
  (data.RelatedTopics || []).forEach(t => {
    if (t.Text && t.FirstURL) { const d = dom(t.FirstURL); items.push({ title: first(t.Text), snippet: t.Text, url: t.FirstURL, source: d, favicon: fav(d) }); }
    else if (t.Topics) t.Topics.forEach(s => { if (s.Text && s.FirstURL) { const d = dom(s.FirstURL); items.push({ title: first(s.Text), snippet: s.Text, url: s.FirstURL, source: d, favicon: fav(d) }); } });
  });
  if (!items.length) { results.innerHTML = empty('No results found', 'Try a different search for ' + escH('"'+lastQuery+'"') + '.'); return; }
  results.innerHTML = '<div class="results-meta">About ' + items.length + ' result' + (items.length !== 1 ? 's' : '') + ' via DuckDuckGo</div>' + items.map(card).join('');
}

function renderInstant(data) {
  let h = '';
  if (data.Answer) h += acard('Instant answer', data.Answer, null, 'bolt');
  if (data.Definition) h += acard('Definition', data.Definition, data.DefinitionURL, 'book');
  if (data.AbstractText) h += acard(data.AbstractSource || 'Summary', data.AbstractText, data.AbstractURL, 'info');
  results.innerHTML = h || empty('No instant answer', 'Try the Web tab for more results.');
}

function renderRelated(data) {
  const all = [];
  (data.RelatedTopics || []).forEach(t => {
    if (t.Name) { all.push({ type: 'group', label: t.Name }); (t.Topics || []).forEach(s => s.Text && all.push({ type: 'tag', text: first(s.Text), full: s.Text })); }
    else if (t.Text) all.push({ type: 'tag', text: first(t.Text), full: t.Text });
  });
  if (!all.length) { results.innerHTML = empty('No related topics', 'No related topics available.'); return; }
  let h = '<div class="results-meta">Related topics from DuckDuckGo</div>', buf = [];
  const flush = () => { if (buf.length) { h += '<div class="tags">' + buf.map(t => '<div class="tag" onclick="doSearch(\'' + escQ(t.text) + '\')" title="' + escA(t.full) + '">' + escH(t.text) + '</div>').join('') + '</div><br>'; buf = []; } };
  all.forEach(item => { if (item.type === 'group') { flush(); h += '<div class="related-label">' + escH(item.label) + '</div>'; } else buf.push(item); });
  flush();
  results.innerHTML = h;
}

function acard(label, text, url, type) {
  const ic = { bolt: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>', book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>', info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>' };
  const src = url ? '<a class="answer-source" href="' + escA(url) + '" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' + escH(label) + '</a>' : '';
  return '<div class="answer-card"><div class="answer-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ic[type]||ic.info) + '</svg></div><div class="answer-body"><h3>' + escH(label) + '</h3><p>' + escH(text) + '</p>' + src + '</div></div>';
}

function card(item) {
  const d = item.source || dom(item.url), f = item.favicon || fav(d);
  return '<div class="result-item" onclick="window.open(\'' + escA(item.url) + '\',\'_blank\')"><div class="result-url"><img class="result-favicon" src="' + f + '" onerror="this.style.display=\'none\'" alt=""/><span class="result-domain">' + escH(d) + '</span></div><div class="result-title">' + escH(item.title || item.snippet.split(' ').slice(0,6).join(' ')) + '</div><div class="result-snippet">' + escH(item.snippet) + '</div></div>';
}

function empty(title, body) {
  return '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>' + escH(title) + '</h3><p>' + body + '</p></div>';
}

function dom(url) { try { return new URL(url).hostname.replace('www.',''); } catch { return url; } }
function fav(d) { return 'https://www.google.com/s2/favicons?domain=' + d + '&sz=32'; }
function first(text) { return text.split(' - ')[0] || text; }
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return String(s).replace(/"/g,'&quot;'); }
function escQ(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
</script>
