<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-top: #1a3a5c;
    --bg-bottom: #0a1f3a;
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.7);
    --card-bg: rgba(255,255,255,0.12);
    --card-border: rgba(255,255,255,0.18);
    --separator: rgba(255,255,255,0.15);
    --font: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    color: var(--text-primary);
    overflow-x: hidden;
    background: #0a1f3a;
  }

  body {
    min-height: 100vh;
    position: relative;
  }

  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    transition: background 2s ease;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 100px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .app.loaded { opacity: 1; }

  /* Header */
  .header {
    padding: 58px 20px 0;
    text-align: left;
    position: relative;
  }

  .location-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .location-icon {
    width: 14px;
    height: 14px;
    opacity: 0.9;
  }

  .city-name {
    font-size: 34px;
    font-weight: 300;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .current-condition {
    font-size: 16px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-bottom: 2px;
    margin-top: 2px;
  }

  .temp-big {
    font-size: 96px;
    font-weight: 100;
    letter-spacing: -5px;
    line-height: 1;
    margin: 8px 0 4px;
  }

  .temp-range-top {
    font-size: 17px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  /* Hourly Scroll */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    margin: 12px 16px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--separator);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
  }

  .card-header svg { opacity: 0.65; }

  /* Summary banner */
  .summary-banner {
    padding: 10px 14px 12px;
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.9);
    line-height: 1.4;
    border-bottom: 1px solid var(--separator);
  }

  /* Hourly */
  .hourly-scroll {
    display: flex;
    overflow-x: auto;
    padding: 12px 8px;
    gap: 2px;
    scrollbar-width: none;
  }

  .hourly-scroll::-webkit-scrollbar { display: none; }

  .hour-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    min-width: 52px;
    flex-shrink: 0;
  }

  .hour-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .hour-label.now { color: #fff; }

  .hour-icon {
    font-size: 22px;
    line-height: 1;
  }

  .hour-temp {
    font-size: 17px;
    font-weight: 500;
  }

  .hour-precip {
    font-size: 11px;
    font-weight: 600;
    color: #6ec6f5;
  }

  /* Mini chart inside hourly */
  .hourly-chart-wrap {
    padding: 0 14px 10px;
    border-top: 1px solid var(--separator);
  }

  /* 10-day */
  .day-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    gap: 8px;
    border-bottom: 1px solid var(--separator);
  }

  .day-row:last-child { border-bottom: none; }

  .day-name {
    font-size: 17px;
    font-weight: 500;
    width: 36px;
    flex-shrink: 0;
  }

  .day-icon {
    font-size: 22px;
    flex-shrink: 0;
    width: 30px;
    text-align: center;
  }

  .day-precip {
    font-size: 12px;
    font-weight: 600;
    color: #6ec6f5;
    width: 36px;
    text-align: left;
    flex-shrink: 0;
  }

  .day-range {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .day-lo {
    font-size: 17px;
    font-weight: 400;
    color: var(--text-secondary);
    min-width: 28px;
    text-align: right;
  }

  .range-bar-wrap {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .range-bar-fill {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #6ec6f5, #f5d76e, #f5876e);
  }

  .day-hi {
    font-size: 17px;
    font-weight: 500;
    min-width: 28px;
    text-align: left;
  }

  /* Detail grid */
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .detail-cell {
    padding: 14px 16px;
    border-bottom: 1px solid var(--separator);
    border-right: 1px solid var(--separator);
  }

  .detail-cell:nth-child(even) { border-right: none; }
  .detail-cell:nth-last-child(-n+2) { border-bottom: none; }

  .detail-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
  }

  .detail-value {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .detail-sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* UV index bar */
  .uv-bar-wrap {
    height: 4px;
    background: linear-gradient(90deg, #6ec6f5 0%, #8be86e 30%, #f5d76e 55%, #f5a76e 75%, #cc5c5c 100%);
    border-radius: 2px;
    margin-top: 8px;
    position: relative;
  }

  .uv-dot {
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Wind compass */
  .wind-compass {
    width: 52px;
    height: 52px;
    position: relative;
    margin-top: 4px;
  }

  /* Sun/Moon card */
  .sun-arc-wrap {
    padding: 10px 16px 14px;
    position: relative;
  }

  .sun-arc-svg {
    width: 100%;
    height: 70px;
  }

  .sun-times {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* AQI */
  .aqi-bar {
    height: 8px;
    border-radius: 4px;
    margin: 10px 0 6px;
    background: linear-gradient(90deg, #6ec6f5, #8be86e, #f5d76e, #f5a76e, #cc5c5c, #8b5cf6);
  }

  /* Loader */
  .loader {
    position: fixed;
    inset: 0;
    background: #0a1f3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    transition: opacity 0.6s ease;
  }

  .loader.hidden { opacity: 0; pointer-events: none; }

  .loader-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: pulse 1.5s ease-in-out infinite;
  }

  .loader-text {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    font-weight: 400;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
  }

  /* Bottom bar */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,31,58,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.12);
    padding: 12px 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    max-width: 430px;
    margin: 0 auto;
  }

  .bottom-bar-left {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
  }

  .location-btn {
    width: 34px;
    height: 34px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .location-btn:hover { background: rgba(255,255,255,0.25); }

  /* Map preview */
  .precip-map {
    height: 160px;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: #1a3a5c;
  }

  .map-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
    background: linear-gradient(transparent 50%, rgba(0,0,0,0.3));
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.8);
  }

  /* Feels like circle */
  .feels-like-big {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
  }

  /* section title inline */
  .section-eyebrow {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.6);
    padding: 16px 20px 8px;
  }

  .error-msg {
    padding: 40px 20px;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    line-height: 1.5;
  }

  /* ── SEARCH ── */
  .search-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10,20,40,0.6);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    display: flex;
    flex-direction: column;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .search-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .search-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 56px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .search-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 0 12px;
    gap: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: border-color 0.2s, background 0.2s;
  }

  .search-input-wrap:focus-within {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.25);
  }

  .search-input-wrap svg { flex-shrink: 0; opacity: 0.6; }

  #search-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 17px;
    font-family: var(--font);
    font-weight: 400;
    padding: 11px 0;
    caret-color: #fff;
  }

  #search-input::placeholder { color: rgba(255,255,255,0.45); }

  #search-clear {
    background: rgba(255,255,255,0.3);
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 11px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }

  #search-clear.visible { opacity: 1; pointer-events: all; }

  .search-cancel-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 17px;
    font-family: var(--font);
    cursor: pointer;
    padding: 8px 4px;
    white-space: nowrap;
    opacity: 0.85;
  }

  .search-results {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }

  .search-result-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    transition: background 0.15s;
  }

  .search-result-item:hover, .search-result-item:active {
    background: rgba(255,255,255,0.08);
  }

  .search-result-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .search-result-text { flex: 1; }
  .search-result-name { font-size: 16px; font-weight: 500; }
  .search-result-sub  { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 1px; }

  .search-result-arrow {
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }

  .search-status {
    padding: 20px;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
  }

  .search-section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.4);
    padding: 16px 20px 6px;
  }

  /* Search trigger button in top bar */
  .search-trigger {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
    transition: background 0.2s;
  }

  .search-trigger:hover { background: rgba(255,255,255,0.25); }

  .header { position: relative; }

  /* canvas for mini chart */
  #hourly-chart {
    width: 100%;
    height: 60px;
    margin-top: 4px;
  }

  /* Animated gradient bg */
  .sky-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    transition: background 3s ease;
  }

  .clouds-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    animation: cloudDrift linear infinite;
  }

  @keyframes cloudDrift {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  .precip-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #6ec6f5;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<!-- Search overlay -->
<div class="search-overlay" id="search-overlay">
  <div class="search-bar-row">
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search city or zip code" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="search-clear">✕</button>
    </div>
    <button class="search-cancel-btn" id="search-cancel">Cancel</button>
  </div>
  <div class="search-results" id="search-results">
    <div class="search-section-label" id="search-section-label">SUGGESTIONS</div>
    <div id="search-status" class="search-status">Type a city name or zip code</div>
  </div>
</div>

<!-- Dynamic background -->
<div class="sky-bg" id="sky-bg"></div>
<div class="clouds-layer" id="clouds-layer"></div>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="loader-icon">🌤️</div>
  <div class="loader-text">Getting your weather…</div>
</div>

<!-- Main app -->
<div class="app" id="app">

  <!-- HEADER -->
  <div class="header">
    <button class="search-trigger" id="search-trigger" title="Search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/>
      </svg>
    </button>
    <div class="location-row">
      <svg class="location-icon" viewBox="0 0 14 14" fill="white"><path d="M7 0C4.24 0 2 2.24 2 5c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5zm0 6.5A1.5 1.5 0 1 1 7 3.5a1.5 1.5 0 0 1 0 3z"/></svg>
      <span id="city-name" class="city-name">Loading…</span>
    </div>
    <div class="current-condition" id="current-condition">—</div>
    <div class="temp-big" id="temp-big">—°</div>
    <div class="temp-range-top" id="temp-range-top">H: —° L: —°</div>
  </div>

  <!-- HOURLY CARD -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="white"><circle cx="6" cy="6" r="5" stroke="white" stroke-width="1.2" fill="none"/><path d="M6 3v3l2 1.2" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>
      HOURLY FORECAST
    </div>
    <div class="summary-banner" id="summary-banner">Fetching conditions…</div>
    <div class="hourly-scroll" id="hourly-scroll"></div>
    <div class="hourly-chart-wrap">
      <canvas id="hourly-chart"></canvas>
    </div>
  </div>

  <!-- 10-DAY CARD -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="1.2"><rect x="1" y="2" width="10" height="9" rx="1.5"/><path d="M4 1v2M8 1v2M1 5h10"/></svg>
      10-DAY FORECAST
    </div>
    <div id="daily-list"></div>
  </div>

  <!-- DETAIL GRID -->
  <div class="card">
    <div class="card-header">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="white"><circle cx="6" cy="6" r="5.5" stroke="white" stroke-width="1" fill="none"/><path d="M6 3v3.5l2 1" stroke="white" stroke-width="1.2" stroke-linecap="round"/></svg>
      CONDITIONS
    </div>
    <div class="detail-grid" id="detail-grid"></div>
  </div>

  <!-- SUNRISE/SUNSET CARD -->
  <div class="card">
    <div class="card-header">
      <span style="font-size:12px">🌅</span> SUNRISE & SUNSET
    </div>
    <div class="sun-arc-wrap">
      <svg class="sun-arc-svg" id="sun-arc" viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f5a76e" stop-opacity="0.4"/>
            <stop offset="50%" stop-color="#f5d76e" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#f5a76e" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
        <path d="M20,75 Q180,-10 340,75" stroke="url(#arcGrad)" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
        <line x1="20" y1="75" x2="340" y2="75" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
        <circle id="sun-dot" cx="180" cy="10" r="6" fill="#f5d76e" filter="url(#sunGlow)"/>
        <defs>
          <filter id="sunGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <text id="sun-rise-txt" x="20" y="68" font-size="11" fill="rgba(255,255,255,0.6)" font-family="-apple-system,sans-serif" text-anchor="middle">—</text>
        <text id="sun-set-txt" x="340" y="68" font-size="11" fill="rgba(255,255,255,0.6)" font-family="-apple-system,sans-serif" text-anchor="middle">—</text>
        <text id="daylight-txt" x="180" y="72" font-size="10" fill="rgba(255,255,255,0.5)" font-family="-apple-system,sans-serif" text-anchor="middle">— hrs daylight</text>
      </svg>
    </div>
  </div>

  <!-- PRECIPITATION MAP PLACEHOLDER -->
  <div class="card" style="overflow:hidden; padding:0;">
    <div class="card-header" style="margin:0; border-radius:0; border-bottom:1px solid var(--separator);">
      <span style="font-size:12px">🌧️</span> PRECIPITATION
    </div>
    <div class="precip-map" id="precip-map">
      <canvas id="precip-canvas" width="398" height="160" style="width:100%;height:100%;"></canvas>
      <div class="map-overlay" id="map-overlay">No precipitation expected</div>
    </div>
  </div>

</div>

<!-- Bottom bar -->
<div style="max-width:430px; margin:0 auto; position:fixed; bottom:0; left:0; right:0; z-index:10;">
  <div style="background:rgba(10,31,58,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,0.12); padding:12px 20px 24px; display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:12px; color:rgba(255,255,255,0.5);" id="updated-label">Updated just now</div>
    <button class="location-btn" id="refresh-btn" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="white"><path d="M13.65 2.35A8 8 0 1 0 15 8h-2a6 6 0 1 1-1.76-4.24l-2.74 2.74H15V1l-1.35 1.35z"/></svg>
    </button>
  </div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────
const WMO = {
  0:  {label:'Clear Sky',       icon:'☀️'},
  1:  {label:'Mainly Clear',    icon:'🌤️'},
  2:  {label:'Partly Cloudy',   icon:'⛅'},
  3:  {label:'Overcast',        icon:'☁️'},
  45: {label:'Foggy',           icon:'🌫️'},
  48: {label:'Icy Fog',         icon:'🌫️'},
  51: {label:'Light Drizzle',   icon:'🌦️'},
  53: {label:'Drizzle',         icon:'🌦️'},
  55: {label:'Heavy Drizzle',   icon:'🌧️'},
  61: {label:'Light Rain',      icon:'🌧️'},
  63: {label:'Rain',            icon:'🌧️'},
  65: {label:'Heavy Rain',      icon:'🌧️'},
  71: {label:'Light Snow',      icon:'🌨️'},
  73: {label:'Snow',            icon:'❄️'},
  75: {label:'Heavy Snow',      icon:'❄️'},
  77: {label:'Snow Grains',     icon:'🌨️'},
  80: {label:'Showers',         icon:'🌦️'},
  81: {label:'Showers',         icon:'🌦️'},
  82: {label:'Heavy Showers',   icon:'⛈️'},
  85: {label:'Snow Showers',    icon:'🌨️'},
  86: {label:'Heavy Snow Showers',icon:'❄️'},
  95: {label:'Thunderstorm',    icon:'⛈️'},
  96: {label:'Thunderstorm w/ Hail',icon:'⛈️'},
  99: {label:'Thunderstorm w/ Hail',icon:'⛈️'},
};

function wmo(code) {
  return WMO[code] || {label:'Unknown', icon:'🌡️'};
}

function fmt12(h) {
  if (h === 0) return '12 AM';
  if (h === 12) return '12 PM';
  return h > 12 ? `${h-12} PM` : `${h} AM`;
}

function fmtTime(iso) {
  const d = new Date(iso);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function dayLabel(iso, i) {
  if (i === 0) return 'Today';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {weekday:'short'});
}

function uviLabel(v) {
  if (v < 3) return 'Low';
  if (v < 6) return 'Moderate';
  if (v < 8) return 'High';
  if (v < 11) return 'Very High';
  return 'Extreme';
}

function windDir(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

function humanDuration(h) {
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return `${hrs}h ${mins}m`;
}

// ─── BACKGROUND THEMES ─────────────────────────────────────
function getSkyColors(code, hour) {
  const isNight = hour < 6 || hour >= 20;
  const isDusk = hour >= 18 && hour < 20;
  const isDawn = hour >= 5 && hour < 7;

  if (isNight) return ['#0a0a1a','#0d1a2e'];
  if (isDusk) return ['#1a0a3a','#6b2d5e','#f5a76e'];
  if (isDawn) return ['#1a2a4a','#e07b4a','#f5c878'];
  if ([95,96,99,65,82].includes(code)) return ['#1a1a2e','#2d2d4e'];
  if ([61,63,71,73,80,81].includes(code)) return ['#1a2a3a','#2a3a4a'];
  if ([45,48,3].includes(code)) return ['#2a3a4a','#3a4a5a'];
  if ([1,2].includes(code)) return ['#1a4a7a','#2a6aaa'];
  return ['#1a3a6a','#2a5aaa']; // clear
}

function applyBackground(code, hour) {
  const colors = getSkyColors(code, hour);
  const bg = document.getElementById('sky-bg');
  if (colors.length === 3) {
    bg.style.background = `linear-gradient(170deg, ${colors[0]} 0%, ${colors[1]} 50%, ${colors[2]} 100%)`;
  } else {
    bg.style.background = `linear-gradient(170deg, ${colors[0]} 0%, ${colors[1]} 100%)`;
  }
  // Clouds
  const cl = document.getElementById('clouds-layer');
  cl.innerHTML = '';
  const n = [3,2,45,48].includes(code) ? 8 : [1,2].includes(code) ? 4 : 1;
  for (let i = 0; i < n; i++) {
    const div = document.createElement('div');
    div.className = 'cloud';
    const size = 80 + Math.random() * 200;
    div.style.cssText = `width:${size}px;height:${size*0.5}px;top:${Math.random()*40}%;left:${Math.random()*100-20}%;animation-duration:${60+Math.random()*120}s;animation-delay:${-Math.random()*120}s;`;
    cl.appendChild(div);
  }
}

// ─── DRAW HOURLY TEMP CHART ──────────────────────────────────
function drawHourlyChart(temps) {
  const canvas = document.getElementById('hourly-chart');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * dpr;
  canvas.height = 60 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = canvas.offsetWidth, H = 60;
  const n = Math.min(temps.length, 24);
  const slice = temps.slice(0, n);
  const mn = Math.min(...slice), mx = Math.max(...slice);
  const pad = 10;

  const pts = slice.map((t, i) => ({
    x: pad + (i / (n-1)) * (W - pad*2),
    y: H - pad - ((t - mn) / (mx - mn || 1)) * (H - pad*2)
  }));

  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, 'rgba(110,198,245,0.25)');
  grad.addColorStop(0.5, 'rgba(245,215,110,0.25)');
  grad.addColorStop(1, 'rgba(245,135,110,0.25)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, H);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'rgba(110,198,245,0.9)');
  lineGrad.addColorStop(0.5, 'rgba(245,215,110,0.9)');
  lineGrad.addColorStop(1, 'rgba(245,135,110,0.9)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const cp = { x: (pts[i-1].x + pts[i].x)/2, y: (pts[i-1].y + pts[i].y)/2 };
    ctx.quadraticCurveTo(pts[i-1].x, pts[i-1].y, cp.x, cp.y);
  }
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dot at now
  ctx.beginPath();
  ctx.arc(pts[0].x, pts[0].y, 4, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

// ─── DRAW PRECIP MAP ─────────────────────────────────────────
function drawPrecipMap(data) {
  const canvas = document.getElementById('precip-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Fake stylized map background
  ctx.fillStyle = '#16324f';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Precip blobs
  const maxPrecip = Math.max(...(data.hourly.precipitation_probability || [0]));
  if (maxPrecip > 20) {
    for (let i = 0; i < 5; i++) {
      const gx = W * (0.2 + Math.random() * 0.6);
      const gy = H * (0.2 + Math.random() * 0.6);
      const r = 30 + Math.random() * 50;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, r);
      const alpha = (maxPrecip / 100) * 0.5;
      g.addColorStop(0, `rgba(110,198,245,${alpha})`);
      g.addColorStop(1, 'rgba(110,198,245,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Location dot
  const cx = W * 0.5, cy = H * 0.5;
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 12, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Overlay label
  document.getElementById('map-overlay').textContent =
    maxPrecip > 50 ? `Heavy precipitation likely (${maxPrecip}%)` :
    maxPrecip > 20 ? `${maxPrecip}% chance of precipitation` :
    'No precipitation expected';
}

// ─── UPDATE SUN ARC ──────────────────────────────────────────
function updateSunArc(sunriseISO, sunsetISO) {
  const now = Date.now();
  const rise = new Date(sunriseISO).getTime();
  const set  = new Date(sunsetISO).getTime();
  const total = set - rise;
  const elapsed = Math.max(0, Math.min(now - rise, total));
  const pct = elapsed / total;

  // Sun moves along arc: x from 20 to 340
  const t = pct;
  const x = 20 + t * 320;
  // Bezier point on our arc: Q 180,-10
  const bx = (1-t)*(1-t)*20 + 2*(1-t)*t*180 + t*t*340;
  const by = (1-t)*(1-t)*75 + 2*(1-t)*t*(-10) + t*t*75;

  document.getElementById('sun-dot').setAttribute('cx', bx);
  document.getElementById('sun-dot').setAttribute('cy', by);
  document.getElementById('sun-rise-txt').textContent = fmtTime(sunriseISO);
  document.getElementById('sun-set-txt').textContent = fmtTime(sunsetISO);

  const hrs = total / 3600000;
  document.getElementById('daylight-txt').textContent = humanDuration(hrs) + ' of daylight';
}

// ─── RENDER ───────────────────────────────────────────────────
function render(data, city) {
  const h = data.hourly;
  const d = data.daily;
  const c = data.current;

  const nowHr = new Date().getHours();
  const nowIdx = h.time.findIndex(t => new Date(t).getHours() === nowHr) || 0;

  const code = c.weather_code;
  const w = wmo(code);
  const tempNow = Math.round(c.temperature_2m);
  const feelsLike = Math.round(c.apparent_temperature);
  const hiToday = Math.round(d.temperature_2m_max[0]);
  const loToday = Math.round(d.temperature_2m_min[0]);

  // Background
  applyBackground(code, nowHr);

  // Header
  document.getElementById('city-name').textContent = city;
  document.getElementById('current-condition').textContent = w.label;
  document.getElementById('temp-big').textContent = `${tempNow}°`;
  document.getElementById('temp-range-top').textContent = `H: ${hiToday}°  L: ${loToday}°`;

  // Summary
  const nextRain = h.precipitation_probability.slice(nowIdx, nowIdx+6).findIndex(p => p > 40);
  let summary = nextRain >= 0
    ? `Rain possible in ${nextRain+1} hour${nextRain ? 's' : ''}. High of ${hiToday}° expected this afternoon.`
    : `${w.label} conditions for the rest of the day. High of ${hiToday}° today.`;
  document.getElementById('summary-banner').textContent = summary;

  // Hourly
  const hourlyEl = document.getElementById('hourly-scroll');
  hourlyEl.innerHTML = '';
  for (let i = 0; i < 24; i++) {
    const idx = (nowIdx + i);
    if (idx >= h.time.length) break;
    const t = new Date(h.time[idx]);
    const hr = t.getHours();
    const label = i === 0 ? 'Now' : fmt12(hr);
    const temp = Math.round(h.temperature_2m[idx]);
    const wcode = h.weather_code[idx];
    const precip = h.precipitation_probability[idx] || 0;
    const wi = wmo(wcode);

    const item = document.createElement('div');
    item.className = 'hour-item';
    item.innerHTML = `
      <span class="hour-label ${i===0?'now':''}">${label}</span>
      <span class="hour-icon">${wi.icon}</span>
      <span class="hour-temp">${temp}°</span>
      ${precip > 20 ? `<span class="hour-precip">${precip}%</span>` : '<span class="hour-precip" style="opacity:0">0%</span>'}
    `;
    hourlyEl.appendChild(item);
  }

  // Chart
  setTimeout(() => drawHourlyChart(h.temperature_2m.slice(nowIdx, nowIdx+24)), 100);

  // Daily
  const allTemps = [...d.temperature_2m_max, ...d.temperature_2m_min];
  const globalMin = Math.min(...allTemps), globalMax = Math.max(...allTemps);
  const dailyEl = document.getElementById('daily-list');
  dailyEl.innerHTML = '';
  for (let i = 0; i < Math.min(10, d.time.length); i++) {
    const hi = Math.round(d.temperature_2m_max[i]);
    const lo = Math.round(d.temperature_2m_min[i]);
    const dw = wmo(d.weather_code[i]);
    const precip = d.precipitation_probability_max[i] || 0;
    const loFrac = (lo - globalMin) / (globalMax - globalMin);
    const hiFrac = (hi - globalMin) / (globalMax - globalMin);

    const row = document.createElement('div');
    row.className = 'day-row';
    row.innerHTML = `
      <span class="day-name">${dayLabel(d.time[i], i)}</span>
      <span class="day-icon">${dw.icon}</span>
      <span class="day-precip">${precip > 10 ? precip+'%' : ''}</span>
      <div class="day-range">
        <span class="day-lo">${lo}°</span>
        <div class="range-bar-wrap">
          <div class="range-bar-fill" style="left:${loFrac*100}%;right:${(1-hiFrac)*100}%"></div>
        </div>
        <span class="day-hi">${hi}°</span>
      </div>
    `;
    dailyEl.appendChild(row);
  }

  // Details
  const wind = Math.round(c.wind_speed_10m);
  const windDeg = c.wind_direction_10m;
  const humidity = c.relative_humidity_2m;
  const uvi = Math.round(c.uv_index);
  const vis = Math.round((c.visibility || 0) / 1000);
  const pressure = Math.round(c.pressure_msl || c.surface_pressure);
  const dew = Math.round(c.dew_point_2m);
  const cloud = c.cloud_cover;

  const details = [
    { icon:'💨', label:'UV INDEX', value: `${uvi}`, sub: uviLabel(uvi),
      extra: `<div class="uv-bar-wrap"><div class="uv-dot" style="left:${Math.min(uvi/12,1)*100}%"></div></div>` },
    { icon:'💧', label:'HUMIDITY', value:`${humidity}%`, sub:`Dew point ${dew}°` },
    { icon:'🌬️', label:'WIND', value:`${wind} mph`, sub:windDir(windDeg) },
    { icon:'👁️', label:'VISIBILITY', value:`${vis} km`, sub: vis > 10 ? 'Clear' : vis > 4 ? 'Moderate' : 'Low' },
    { icon:'🌡️', label:'FEELS LIKE', value:`${feelsLike}°`, sub: feelsLike < tempNow ? 'Wind makes it colder' : feelsLike > tempNow ? 'Humidity makes it hotter' : 'Similar to actual' },
    { icon:'☁️', label:'CLOUD COVER', value:`${cloud}%`, sub: cloud < 20 ? 'Clear' : cloud < 60 ? 'Partly cloudy' : 'Overcast' },
    { icon:'🔵', label:'PRESSURE', value:`${pressure}`, sub:'hPa' },
    { icon:'💦', label:'PRECIPITATION', value:`${Math.round((d.precipitation_sum?.[0] || 0)*10)/10}`, sub:'mm today' },
  ];

  const gridEl = document.getElementById('detail-grid');
  gridEl.innerHTML = '';
  details.forEach(det => {
    const cell = document.createElement('div');
    cell.className = 'detail-cell';
    cell.innerHTML = `
      <div class="detail-label">${det.icon} ${det.label}</div>
      <div class="detail-value">${det.value}</div>
      <div class="detail-sub">${det.sub}</div>
      ${det.extra || ''}
    `;
    gridEl.appendChild(cell);
  });

  // Sun arc
  if (d.sunrise && d.sunset) {
    updateSunArc(d.sunrise[0], d.sunset[0]);
  }

  // Precip map
  setTimeout(() => drawPrecipMap(data), 200);

  // Updated label
  document.getElementById('updated-label').textContent = `Updated ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;

  // Show app
  document.getElementById('app').classList.add('loaded');
  const loader = document.getElementById('loader');
  loader.classList.add('hidden');
  setTimeout(() => loader.style.display = 'none', 700);
}

// ─── GEOCODING & FETCH ────────────────────────────────────────
async function getCityName(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
    const j = await r.json();
    return j.address?.city || j.address?.town || j.address?.village || j.address?.county || 'Your Location';
  } catch { return 'Your Location'; }
}

async function fetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: [
      'temperature_2m','apparent_temperature','relative_humidity_2m',
      'weather_code','wind_speed_10m','wind_direction_10m',
      'uv_index','visibility','pressure_msl','surface_pressure',
      'dew_point_2m','cloud_cover','precipitation'
    ].join(','),
    hourly: [
      'temperature_2m','weather_code','precipitation_probability',
      'precipitation','wind_speed_10m','visibility','relative_humidity_2m'
    ].join(','),
    daily: [
      'weather_code','temperature_2m_max','temperature_2m_min',
      'sunrise','sunset','precipitation_sum','precipitation_probability_max',
      'wind_speed_10m_max','uv_index_max'
    ].join(','),
    wind_speed_unit: 'mph',
    forecast_days: 10,
    timezone: 'auto'
  });

  const r = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
  return r.json();
}

async function init() {
  if (!navigator.geolocation) {
    document.getElementById('city-name').textContent = 'Location unavailable';
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    const [data, city] = await Promise.all([
      fetchWeather(lat, lon),
      getCityName(lat, lon)
    ]);
    render(data, city);
  }, async () => {
    // Fallback: Chicago
    const [data, city] = await Promise.all([
      fetchWeather(41.8781, -87.6298),
      Promise.resolve('Chicago')
    ]);
    render(data, city);
  });
}

document.getElementById('refresh-btn').addEventListener('click', () => {
  document.getElementById('app').classList.remove('loaded');
  document.getElementById('loader').style.display = 'flex';
  document.getElementById('loader').classList.remove('hidden');
  init();
});

// ─── SEARCH ───────────────────────────────────────────────────
let searchTimeout = null;

function openSearch() {
  const overlay = document.getElementById('search-overlay');
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('search-input').focus(), 100);
}

function closeSearch() {
  const overlay = document.getElementById('search-overlay');
  overlay.classList.remove('open');
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  renderSearchResults([]);
  document.getElementById('search-status').textContent = 'Type a city name or zip code';
  document.getElementById('search-status').style.display = '';
  document.getElementById('search-section-label').textContent = 'SUGGESTIONS';
}

async function geocodeQuery(query) {
  const isZip = /^\d{5}$/.test(query.trim());
  let url;
  if (isZip) {
    url = `https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(query.trim())}&countrycodes=us&format=json&limit=5&addressdetails=1`;
  } else {
    url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=6&addressdetails=1`;
  }
  const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
  return r.json();
}

function resultLabel(item) {
  const a = item.address || {};
  const city = a.city || a.town || a.village || a.municipality || a.county || item.display_name.split(',')[0];
  const state = a.state || '';
  const country = a.country_code?.toUpperCase() || '';
  const parts = [city];
  if (state) parts.push(state);
  if (country && country !== 'US') parts.push(country);
  return { name: city, sub: parts.slice(1).join(', ') };
}

function renderSearchResults(results) {
  const container = document.getElementById('search-results');
  container.querySelectorAll('.search-result-item').forEach(el => el.remove());
  results.forEach(item => {
    const lbl = resultLabel(item);
    const div = document.createElement('div');
    div.className = 'search-result-item';
    div.innerHTML = `
      <div class="search-result-icon">📍</div>
      <div class="search-result-text">
        <div class="search-result-name">${lbl.name}</div>
        ${lbl.sub ? `<div class="search-result-sub">${lbl.sub}</div>` : ''}
      </div>
      <div class="search-result-arrow">›</div>
    `;
    div.addEventListener('click', () => {
      closeSearch();
      loadLocation(parseFloat(item.lat), parseFloat(item.lon), lbl.name);
    });
    container.appendChild(div);
  });
}

async function doSearch(query) {
  if (!query.trim()) {
    renderSearchResults([]);
    document.getElementById('search-status').textContent = 'Type a city name or zip code';
    document.getElementById('search-status').style.display = '';
    document.getElementById('search-section-label').textContent = 'SUGGESTIONS';
    return;
  }
  document.getElementById('search-status').textContent = 'Searching…';
  document.getElementById('search-status').style.display = '';
  document.getElementById('search-section-label').textContent = 'RESULTS';
  renderSearchResults([]);
  try {
    const results = await geocodeQuery(query);
    if (!results.length) {
      document.getElementById('search-status').textContent = 'No results found. Try a different city or zip.';
    } else {
      document.getElementById('search-status').style.display = 'none';
      renderSearchResults(results);
    }
  } catch {
    document.getElementById('search-status').textContent = 'Search failed. Check your connection.';
  }
}

async function loadLocation(lat, lon, city) {
  document.getElementById('app').classList.remove('loaded');
  const loader = document.getElementById('loader');
  loader.style.display = 'flex';
  loader.classList.remove('hidden');
  try {
    const data = await fetchWeather(lat, lon);
    render(data, city);
  } catch {
    loader.classList.add('hidden');
    document.getElementById('app').classList.add('loaded');
  }
}

document.getElementById('search-trigger').addEventListener('click', openSearch);
document.getElementById('search-cancel').addEventListener('click', closeSearch);

document.getElementById('search-input').addEventListener('input', e => {
  const val = e.target.value;
  document.getElementById('search-clear').classList.toggle('visible', val.length > 0);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(val), 380);
});

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') { clearTimeout(searchTimeout); doSearch(e.target.value); }
});

document.getElementById('search-clear').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  renderSearchResults([]);
  document.getElementById('search-status').textContent = 'Type a city name or zip code';
  document.getElementById('search-status').style.display = '';
  document.getElementById('search-input').focus();
});

init();
</script>
</body>
</html>
