<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤙 UkuTab — Play What You Love</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --sand:    #F7F3ED;
    --bark:    #2B1F14;
    --wood:    #C4843A;
    --wood-lt: #E9B97A;
    --sage:    #6B8F71;
    --rose:    #D4756A;
    --cream:   #FDF9F4;
    --muted:   #8C7B6E;
    --border:  #E2D8CE;
    --chord-bg:#FFF8F0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--sand);
    color: var(--bark);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--bark);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(43,31,20,.35);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    color: var(--wood-lt);
    letter-spacing: -.5px;
  }
  .logo span { color: var(--rose); }
  .header-right { display: flex; gap: .75rem; align-items: center; }
  .btn-sm {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: .8rem;
    padding: .35rem .8rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-sm:hover { background: rgba(255,255,255,.16); }
  .btn-sm.active { background: var(--wood); border-color: var(--wood); color: #fff; }

  /* ── LAYOUT ── */
  .app { display: flex; height: calc(100vh - 60px); overflow: hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 310px;
    min-width: 260px;
    background: var(--cream);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .search-wrap {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .search-wrap input {
    width: 100%;
    background: var(--sand);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .55rem .9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    color: var(--bark);
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--wood); }
  .genre-pills {
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .pill {
    font-size: .72rem;
    font-weight: 500;
    padding: .25rem .65rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .pill:hover, .pill.active {
    background: var(--wood);
    border-color: var(--wood);
    color: #fff;
  }
  .song-list {
    flex: 1;
    overflow-y: auto;
    padding: .5rem 0;
  }
  .song-list::-webkit-scrollbar { width: 4px; }
  .song-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .song-item {
    padding: .7rem 1rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all .12s;
    display: flex;
    flex-direction: column;
    gap: .1rem;
  }
  .song-item:hover { background: var(--sand); }
  .song-item.active {
    border-left-color: var(--wood);
    background: rgba(196,132,58,.08);
  }
  .song-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .92rem;
    line-height: 1.2;
  }
  .song-meta {
    font-size: .75rem;
    color: var(--muted);
    display: flex;
    gap: .5rem;
    align-items: center;
  }
  .diff-badge {
    font-size: .65rem;
    padding: .1rem .4rem;
    border-radius: 4px;
    font-weight: 600;
  }
  .diff-easy   { background: #D4EDD7; color: #2F6B35; }
  .diff-medium { background: #FFF0D0; color: #8B5E00; }
  .diff-hard   { background: #FAD9D5; color: #8B2A20; }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    padding: .65rem 1.5rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar-group { display: flex; align-items: center; gap: .5rem; }
  .toolbar label { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .btn {
    background: var(--bark);
    color: #fff;
    border: none;
    padding: .4rem .9rem;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--bark);
  }
  .btn.secondary:hover { background: var(--sand); }
  .btn.wood { background: var(--wood); }
  .btn.sage { background: var(--sage); }
  .transpose-val {
    font-family: 'DM Mono', monospace;
    font-size: .9rem;
    font-weight: 500;
    min-width: 2.5rem;
    text-align: center;
    color: var(--wood);
  }
  .speed-val {
    font-family: 'DM Mono', monospace;
    font-size: .85rem;
    min-width: 2.5rem;
    text-align: center;
  }
  .toolbar-sep { width: 1px; background: var(--border); height: 28px; }

  /* ── CONTENT ── */
  .content-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    gap: 0;
  }
  .content-area::-webkit-scrollbar { width: 6px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  /* ── SONG VIEW ── */
  .song-view {
    flex: 1;
    padding: 2rem 2.5rem;
    max-width: 760px;
  }
  .song-header { margin-bottom: 2rem; }
  .song-header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: .3rem;
  }
  .song-header .artist { font-size: 1rem; color: var(--muted); }
  .song-header .tags {
    display: flex;
    gap: .5rem;
    margin-top: .6rem;
    flex-wrap: wrap;
  }
  .tag {
    font-size: .72rem;
    padding: .2rem .55rem;
    border-radius: 4px;
    background: var(--sand);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  /* ── CHORD DIAGRAMS ── */
  .chord-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    padding: 1rem;
    background: var(--chord-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .chord-diagram {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
    cursor: pointer;
    transition: transform .1s;
  }
  .chord-diagram:hover { transform: scale(1.05); }
  .chord-name {
    font-family: 'Syne', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    color: var(--bark);
  }
  .chord-svg { display: block; }

  /* ── TABS / LYRICS ── */
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--wood);
    margin: 1.5rem 0 .5rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .tab-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .tab-block pre {
    font-family: 'DM Mono', monospace;
    font-size: .88rem;
    line-height: 2;
    white-space: pre;
    overflow-x: auto;
    color: var(--bark);
  }
  .chord-inline {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    color: var(--wood);
    font-size: .95rem;
    cursor: pointer;
    text-decoration: none;
    background: rgba(196,132,58,.1);
    padding: 0 .2rem;
    border-radius: 3px;
    transition: background .1s;
  }
  .chord-inline:hover { background: rgba(196,132,58,.22); }

  .lyrics-line { margin-bottom: .1rem; font-size: .95rem; }
  .chords-line {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    color: var(--wood);
    font-size: .88rem;
    letter-spacing: .03em;
    margin-bottom: 0;
  }

  /* ── YOUTUBE PANEL ── */
  .yt-panel {
    width: 340px;
    min-width: 280px;
    background: var(--cream);
    border-left: 1px solid var(--border);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
  }
  .yt-panel h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .yt-embed {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 8px;
    border: none;
    background: #000;
  }
  .yt-results { display: flex; flex-direction: column; gap: .5rem; }
  .yt-card {
    display: flex;
    gap: .6rem;
    padding: .5rem;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .12s;
    align-items: flex-start;
  }
  .yt-card:hover { background: var(--sand); border-color: var(--border); }
  .yt-card.selected { border-color: var(--wood); background: rgba(196,132,58,.06); }
  .yt-thumb {
    width: 80px;
    height: 45px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  .yt-card-title {
    font-size: .78rem;
    font-weight: 500;
    line-height: 1.3;
    color: var(--bark);
  }
  .yt-card-ch { font-size: .7rem; color: var(--muted); margin-top: .2rem; }
  .yt-placeholder {
    aspect-ratio: 16/9;
    background: var(--bark);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.5);
    font-size: .85rem;
    gap: .5rem;
  }
  .yt-placeholder svg { opacity: .4; }

  /* ── WELCOME / NO SONG ── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem;
    gap: 1rem;
  }
  .welcome-icon { font-size: 4rem; }
  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
  }
  .welcome p { color: var(--muted); max-width: 360px; line-height: 1.6; }

  /* ── CHORD POPUP ── */
  .chord-popup {
    position: fixed;
    background: var(--bark);
    color: #fff;
    border-radius: 12px;
    padding: .75rem 1rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: .4rem;
    z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .chord-popup.show { display: flex; }
  .chord-popup .chord-name { color: var(--wood-lt); font-size: 1rem; }

  /* ── AUTOSCROLL INDICATOR ── */
  .autoscroll-bar {
    height: 3px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .autoscroll-bar .fill {
    height: 100%;
    background: var(--wood);
    width: 0%;
    transition: width .1s linear;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .sidebar { width: 240px; }
    .yt-panel { width: 280px; }
  }
  @media (max-width: 680px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; max-height: 220px; flex-direction: row; overflow-x: auto; }
    .yt-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    .content-area { flex-direction: column; }
  }

  /* ── CAPO NOTICE ── */
  .capo-notice {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: rgba(107,143,113,.12);
    border: 1px solid var(--sage);
    border-radius: 6px;
    padding: .3rem .7rem;
    font-size: .8rem;
    color: var(--sage);
    font-weight: 500;
    margin-top: .5rem;
  }

  .rating-stars { color: var(--wood); font-size: .85rem; }
</style>
</head>
<body>

<header>
  <div class="logo">Uku<span>Tab</span></div>

    <div class="content-area">

          <div class="welcome-icon">🤙</div>
          <h2>Pick a song, start strumming</h2>

        </div>
      </div>
      <div class="yt-panel" id="ytPanel">
        <h3>🎥 Listen along</h3>
        <div class="yt-placeholder" id="ytPlaceholder">

// ═══════════════════════════════════════════════════════
// CHORD DATA  (G C E A tuning)
// Format: [fret_g, fret_C, fret_E, fret_A]  or  {barre, frets}
// ═══════════════════════════════════════════════════════
const CHORDS = {
  "C":  [0,0,0,3],
  "Cm": [0,3,3,3],
  "C7": [0,0,0,1],
  "Cmaj7": [0,0,0,2],
  "D":  [2,2,2,0],
  "Dm": [2,2,1,0],
  "D7": [2,2,2,3],
  "Dmaj7": [2,2,2,4],
  "E":  [4,4,4,2],
  "Em": [0,4,3,2],
  "E7": [1,2,0,2],
  "F":  [2,0,1,0],
  "Fm": [1,0,1,3],
  "F7": [2,3,1,0],
  "Fmaj7": [2,4,1,0],
  "G":  [0,2,3,2],
  "Gm": [0,2,3,1],
  "G7": [0,2,1,2],
  "Gmaj7": [0,2,2,2],
  "A":  [2,1,0,0],
  "Am": [2,0,0,0],
  "A7": [0,1,0,0],
  "Amaj7": [1,1,0,0],
  "B":  [4,3,2,2],
  "Bm": [4,2,2,2],
  "B7": [2,3,2,2],
  "Bb": [3,2,1,1],
  "Bbm":[3,1,1,1],
  "Eb": [0,3,3,1],
  "Ab": [5,3,4,3],
  "F#m":[2,1,2,0],
  "C#m":[6,4,4,4],
  "G#m":[4,3,4,2],
};

const NOTES  = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_ALIASES = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"};

function normalizeNote(n){ return NOTE_ALIASES[n] || n; }

function transposeChord(chord, semis) {
  if (semis === 0) return chord;
  // Parse chord: root + quality
  const m = chord.match(/^([A-G][b#]?)(.*)/);
  if (!m) return chord;
  let root = normalizeNote(m[1]);
  const quality = m[2];
  let idx = NOTES.indexOf(root);
  if (idx < 0) return chord;
  idx = ((idx + semis) % 12 + 12) % 12;
  return NOTES[idx] + quality;
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let currentSong = null;
let transpose   = 0;
let autoScroll  = false;
let scrollSpeed = 1;
let scrollInterval = null;
let showYT      = true;
let showChords  = true;
let ytLoaded    = null;
let activeGenre = "all";
let searchQ     = "";
let ytVideos    = [];

// ═══════════════════════════════════════════════════════
// CHORD DIAGRAM RENDERER
// ═══════════════════════════════════════════════════════
function renderChordSvg(chordName, w=80, h=90) {
  const raw = normalizeNote(chordName.replace(/[^A-Ga-g#b]/g, c => c));
  let frets = CHORDS[chordName] || CHORDS[raw];
  if (!frets) {
    // Attempt transposed lookup
    return `<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="11" fill="#aaa">${chordName}</text>`;
  }

  const strings = 4;
  const rows    = 5;
  const padL = 14, padT = 22, padR = 8;
  const bw = w - padL - padR;
  const bh = h - padT - 14;
  const sx = bw / (strings-1);
  const sy = bh / (rows-1);

  let svg = '';
  // Nut
  const minFret = Math.min(...frets.filter(f=>f>0));
  const maxFret = Math.max(...frets);
  const startFret = maxFret > 4 ? minFret : 1;
  if (startFret === 1) svg += `<rect x="${padL-1}" y="${padT-4}" width="${bw+2}" height="5" rx="1" fill="#2B1F14"/>`;

  // Grid
  for (let r=0; r<=rows-1; r++) {
    svg += `<line x1="${padL}" y1="${padT+r*sy}" x2="${padL+bw}" y2="${padT+r*sy}" stroke="#ccc" stroke-width="1"/>`;
  }
  for (let s=0; s<strings; s++) {
    svg += `<line x1="${padL+s*sx}" y1="${padT}" x2="${padL+s*sx}" y2="${padT+bh}" stroke="#999" stroke-width="1.2"/>`;
  }

  // Dots
  frets.forEach((f, i) => {
    const cx = padL + i * sx;
    if (f === 0) {
      svg += `<circle cx="${cx}" cy="${padT-9}" r="4" fill="none" stroke="#999" stroke-width="1.5"/>`;
    } else {
      const row = f - startFret;
      const cy = padT + row * sy + sy/2;
      svg += `<circle cx="${cx}" cy="${cy}" r="5" fill="#C4843A"/>`;
    }
  });

  // Fret number
  if (startFret > 1) {
    svg += `<text x="${padL-6}" y="${padT+sy/2+4}" text-anchor="end" font-size="9" fill="#888">${startFret}fr</text>`;
  }

  // String labels
  const strings_lbl = ['G','C','E','A'];
  strings_lbl.forEach((l,i) => {
    svg += `<text x="${padL+i*sx}" y="${h-1}" text-anchor="middle" font-size="8" fill="#aaa">${l}</text>`;
  });

  return svg;
}

// ═══════════════════════════════════════════════════════
// RENDER SIDEBAR
// ═══════════════════════════════════════════════════════
function filteredSongs() {
  return SONGS.filter(s => {
    const matchGenre = activeGenre === "all" || s.genre === activeGenre;
    const q = searchQ.toLowerCase();
    const matchSearch = !q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q) || s.tags.some(t=>t.includes(q));
    return matchGenre && matchSearch;
  });
}

function renderSidebar() {
  const list = document.getElementById('songList');
  const songs = filteredSongs();
  list.innerHTML = '';
  songs.forEach(song => {
    const el = document.createElement('div');
    el.className = 'song-item' + (currentSong && currentSong.id === song.id ? ' active' : '');
    el.innerHTML = `
      <div class="song-title">${song.title}</div>
      <div class="song-meta">
        <span>${song.artist}</span>
        <span class="diff-badge diff-${song.difficulty}">${song.difficulty}</span>
        <span class="rating-stars">${'★'.repeat(song.rating)}${'☆'.repeat(5-song.rating)}</span>
      </div>`;
    el.onclick = () => loadSong(song);
    list.appendChild(el);
  });
  if (!songs.length) list.innerHTML = '<div style="padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem">No songs match your search</div>';
}

// ═══════════════════════════════════════════════════════
// TRANSPOSE
// ═══════════════════════════════════════════════════════
function applyTranspose(chordStr) {
  if (transpose === 0) return chordStr;
  return chordStr.replace(/[A-G][b#]?(?:maj7|m7|7|maj|m|dim|aug|sus[24]?|add9)?/g, ch => transposeChord(ch, transpose));
}

// ═══════════════════════════════════════════════════════
// RENDER CHORD ROW
// ═══════════════════════════════════════════════════════
function renderChordRow(chordNames) {
  if (!showChords) return '';
  const unique = [...new Set(chordNames.map(c => transposeChord(c, transpose)))];
  let html = '<div class="chord-row">';
  unique.forEach(ch => {
    const svg = renderChordSvg(ch);
    html += `<div class="chord-diagram" data-chord="${ch}">
      <div class="chord-name">${ch}</div>
      <svg class="chord-svg" width="80" height="90" viewBox="0 0 80 90">${svg}</svg>
    </div>`;
  });
  html += '</div>';
  return html;
}

// ═══════════════════════════════════════════════════════
// RENDER SECTION
// ═══════════════════════════════════════════════════════
function renderSection(sec) {
  let html = `<div class="section-label">${sec.name}</div>`;
  if (sec.type === 'tab') {
    html += `<div class="tab-block"><pre>${sec.content}</pre></div>`;
  } else {
    html += '<div class="tab-block">';
    sec.lines.forEach(line => {
      const transChords = applyTranspose(line.chords);
      const chordHtml = transChords.replace(/[A-G][b#]?(?:maj7|m7|7|maj|m|dim|aug|sus[24]?|add9)?/g,
        ch => `<span class="chord-inline" data-chord="${ch}">${ch}</span>`);
      html += `<div class="chords-line">${chordHtml}</div>`;
      html += `<div class="lyrics-line">${line.lyrics}</div>`;
    });
    html += '</div>';
  }
  return html;
}

// ═══════════════════════════════════════════════════════
// LOAD SONG
// ═══════════════════════════════════════════════════════
function loadSong(song) {
  currentSong = song;
  stopScroll();
  renderSidebar();

  const view = document.getElementById('songView');

  let capoHtml = '';
  if (song.capoNote) {
    capoHtml = `<div class="capo-notice">🎸 ${song.capoNote}</div>`;
  }

  const tagHtml = song.tags.map(t=>`<span class="tag">#${t}</span>`).join('');
  let html = `<div class="song-header">
    <h1>${song.title}</h1>
    <div class="artist">${song.artist}</div>
    <div class="tags">${tagHtml}</div>
    ${capoHtml}
  </div>`;

  // Chord diagrams
  html += renderChordRow(song.chords.map(c=>transposeChord(c,transpose)));

  // Sections
  song.sections.forEach(sec => { html += renderSection(sec); });

  view.innerHTML = html;
  view.scrollTop = 0;

  // Bind chord hovers
  view.querySelectorAll('[data-chord]').forEach(el => {
    el.addEventListener('mouseenter', showChordPopup);
    el.addEventListener('mouseleave', hideChordPopup);
  });
  view.querySelectorAll('.chord-diagram').forEach(el => {
    el.addEventListener('mouseenter', showChordPopup);
    el.addEventListener('mouseleave', hideChordPopup);
  });

  // Load YT videos
  loadYT(song);
}

// ═══════════════════════════════════════════════════════
// YOUTUBE
// ═══════════════════════════════════════════════════════
function loadYT(song) {
  ytVideos = song.ytVideos || [];
  const ytResults = document.getElementById('ytResults');
  const ytEmbed   = document.getElementById('ytEmbed');
  const ytPlaceholder = document.getElementById('ytPlaceholder');
  ytLoaded = null;
  ytEmbed.style.display = 'none';
  ytPlaceholder.style.display = 'flex';
  ytResults.innerHTML = '';

  ytVideos.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'yt-card' + (i===0 ? ' selected' : '');
    card.innerHTML = `
      <img class="yt-thumb" src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="" onerror="this.style.background='#ccc'">
      <div>
        <div class="yt-card-title">${v.title}</div>
        <div class="yt-card-ch">${v.ch}</div>
      </div>`;
    card.onclick = () => {
      ytResults.querySelectorAll('.yt-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      playYT(v.id);
    };
    ytResults.appendChild(card);
  });
}

function playYT(id) {
  const ytEmbed = document.getElementById('ytEmbed');
  const ytPlaceholder = document.getElementById('ytPlaceholder');
  ytEmbed.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  ytEmbed.style.display = 'block';
  ytPlaceholder.style.display = 'none';
  ytLoaded = id;
}

// Play first video automatically on song load if panel visible
function tryAutoPlayFirst() {
  if (showYT && ytVideos.length && !ytLoaded) {
    playYT(ytVideos[0].id);
  }
}

// ═══════════════════════════════════════════════════════
// CHORD POPUP
// ═══════════════════════════════════════════════════════
function showChordPopup(e) {
  const ch = this.dataset.chord;
  if (!ch) return;
  const popup = document.getElementById('chordPopup');
  const svg = document.getElementById('popupChordSvg');
  const name = document.getElementById('popupChordName');
  name.textContent = ch;
  svg.innerHTML = renderChordSvg(ch, 80, 90);
  popup.classList.add('show');
  const rect = this.getBoundingClientRect();
  popup.style.left = (rect.left + window.scrollX) + 'px';
  popup.style.top  = (rect.bottom + window.scrollY + 8) + 'px';
}
function hideChordPopup() {
  document.getElementById('chordPopup').classList.remove('show');
}

// ═══════════════════════════════════════════════════════
// AUTOSCROLL
// ═══════════════════════════════════════════════════════
function startScroll() {
  autoScroll = true;
  document.getElementById('scrollToggle').textContent = '⏸ Pause';
  document.getElementById('scrollToggle').style.background = 'var(--rose)';
  const view = document.getElementById('songView');
  const fill = document.getElementById('scrollFill');
  scrollInterval = setInterval(() => {
    view.scrollTop += scrollSpeed * 0.7;
    const pct = (view.scrollTop / (view.scrollHeight - view.clientHeight)) * 100;
    fill.style.width = Math.min(pct, 100) + '%';
    if (view.scrollTop >= view.scrollHeight - view.clientHeight) {
      stopScroll();
    }
  }, 30);
}
function stopScroll() {
  autoScroll = false;
  clearInterval(scrollInterval);
  const btn = document.getElementById('scrollToggle');
  if (btn) { btn.textContent = '▶ Start'; btn.style.background = 'var(--wood)'; }
  document.getElementById('scrollFill').style.width = '0%';
}

// ═══════════════════════════════════════════════════════
// PRINT
// ═══════════════════════════════════════════════════════
function printSong() {
  if (!currentSong) return;
  window.print();
}

// ═══════════════════════════════════════════════════════
// INIT & EVENT LISTENERS
// ═══════════════════════════════════════════════════════
renderSidebar();

document.getElementById('transposeUp').onclick = () => {
  transpose = Math.min(6, transpose + 1);
  document.getElementById('transposeVal').textContent = (transpose > 0 ? '+' : '') + transpose;
  if (currentSong) loadSong(currentSong);
};
document.getElementById('transposeDown').onclick = () => {
  transpose = Math.max(-6, transpose - 1);
  document.getElementById('transposeVal').textContent = (transpose > 0 ? '+' : '') + transpose;
  if (currentSong) loadSong(currentSong);
};
document.getElementById('transposeReset').onclick = () => {
  transpose = 0;
  document.getElementById('transposeVal').textContent = '0';
  if (currentSong) loadSong(currentSong);
};

document.getElementById('scrollToggle').onclick = () => {
  if (!currentSong) return;
  autoScroll ? stopScroll() : startScroll();
};
document.getElementById('scrollFaster').onclick = () => {
  scrollSpeed = Math.min(5, +(scrollSpeed + 0.5).toFixed(1));
  document.getElementById('scrollSpeed').textContent = scrollSpeed + '×';
  if (autoScroll) { stopScroll(); startScroll(); }
};
document.getElementById('scrollSlower').onclick = () => {
  scrollSpeed = Math.max(0.5, +(scrollSpeed - 0.5).toFixed(1));
  document.getElementById('scrollSpeed').textContent = scrollSpeed + '×';
  if (autoScroll) { stopScroll(); startScroll(); }
};

document.getElementById('printBtn').onclick = printSong;

document.getElementById('toggleYT').onclick = function() {
  showYT = !showYT;
  document.getElementById('ytPanel').style.display = showYT ? '' : 'none';
  this.classList.toggle('active', showYT);
};

document.getElementById('toggleChords').onclick = function() {
  showChords = !showChords;
  this.classList.toggle('active', !showChords);
  if (currentSong) loadSong(currentSong);
};

document.getElementById('searchInput').oninput = function() {
  searchQ = this.value;
  renderSidebar();
};

document.querySelectorAll('.pill').forEach(pill => {
  pill.onclick = function() {
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    this.classList.add('active');
    activeGenre = this.dataset.genre;
    renderSidebar();
  };
});

// Load first song on start
loadSong(SONGS[0]);
playYT(SONGS[0].ytVideos[0].id);

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('scrollToggle').click(); }
  if (e.code === 'ArrowUp') { e.preventDefault(); document.getElementById('scrollSlower').click(); }
  if (e.code === 'ArrowDown') { e.preventDefault(); document.getElementById('scrollFaster').click(); }
  if (e.code === 'ArrowLeft') document.getElementById('transposeDown').click();
  if (e.code === 'ArrowRight') document.getElementById('transposeUp').click();
});
</script>
</body>
</html>
