<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StreamVault</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamVault">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23E50914'/%3E%3Ctext x='90' y='130' text-anchor='middle' font-size='110'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E50914'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='18'%3E🎬%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0a;--s1:#141414;--s2:#1c1c1e;--s3:#2c2c2e;
  --border:rgba(255,255,255,0.09);--text:#f5f5f7;--muted:#98989d;--dim:#48484a;
  --red:#e50914;--gold:#ffd60a;--ease:.2s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
img{display:block;object-fit:cover}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:99px}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;background:rgba(10,10,10,0.88);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.6px;flex-shrink:0}
.logo-box{width:34px;height:34px;background:var(--red);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.logo em{color:var(--red);font-style:normal}
.ntabs{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none}
.ntabs::-webkit-scrollbar{display:none}
.nt{padding:6px 14px;border-radius:20px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:all var(--ease)}
.nt:hover{color:var(--text)}
.nt.on{background:var(--s2);color:var(--text)}
.srch{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:7px 14px;flex-shrink:0;transition:all var(--ease)}
.srch:focus-within{border-color:rgba(255,255,255,0.22);background:var(--s3)}
.srch svg{width:13px;height:13px;color:var(--muted);flex-shrink:0}
.srch input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:170px;font-family:inherit}
.srch input::placeholder{color:var(--muted)}

/* ── HERO ── */
.main{padding-top:60px}
.hero{position:relative;height:540px;overflow:hidden;cursor:pointer;user-select:none}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.38);transition:transform .6s ease}
.hero:hover .hero-img{transform:scale(1.03)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(105deg,rgba(10,10,10,.92) 0%,rgba(10,10,10,.5) 52%,transparent 100%),linear-gradient(to top,rgba(10,10,10,.78) 0%,transparent 52%)}
.hero-body{position:absolute;bottom:56px;left:48px;max-width:520px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 11px;border-radius:5px;margin-bottom:13px}
.hero-title{font-size:clamp(28px,3.8vw,50px);font-weight:800;line-height:1.08;letter-spacing:-1.2px;margin-bottom:11px;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hero-meta{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--muted);margin-bottom:15px;flex-wrap:wrap}
.stars{display:flex;align-items:center;gap:4px;color:var(--gold);font-weight:700;font-size:13.5px}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:3px 10px;border-radius:5px;font-size:12px;font-weight:500;color:rgba(245,245,247,.85)}
.hero-desc{font-size:14.5px;line-height:1.65;color:rgba(245,245,247,.76);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px}
.hero-acts{display:flex;gap:11px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:50px;font-size:14.5px;font-weight:600;transition:all var(--ease);letter-spacing:-.2px;white-space:nowrap}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn-w{background:#fff;color:#000}
.btn-w:hover{background:rgba(255,255,255,.86);transform:scale(1.02)}
.btn-g{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn-g:hover{background:rgba(255,255,255,.18);transform:scale(1.02)}
.btn-r{background:var(--red);color:#fff}
.btn-r:hover{background:#c8070f;transform:scale(1.02)}
.btn-sm{padding:8px 18px;font-size:13px}

/* ── GENRES ── */
.genres{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:16px 24px 4px}
.genres::-webkit-scrollbar{display:none}
.gp{flex-shrink:0;padding:7px 17px;border-radius:50px;border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--s1);transition:all var(--ease);cursor:pointer}
.gp:hover,.gp.on{background:#fff;color:#000;border-color:#fff}

/* ── ROWS ── */
.section{padding:8px 24px 36px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:19px;font-weight:700;letter-spacing:-.4px}
.row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;scroll-snap-type:x mandatory}
.row::-webkit-scrollbar{display:none}

/* ── CARD ── */
.card{flex:0 0 152px;scroll-snap-align:start;cursor:pointer}
.card-poster{width:100%;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--s2);position:relative;transition:transform var(--ease),box-shadow var(--ease);border:1px solid var(--border)}
.card:hover .card-poster{transform:scale(1.05);box-shadow:0 12px 40px rgba(0,0,0,.5);border-color:rgba(255,255,255,.18)}
.card-poster img{width:100%;height:100%;object-fit:cover}
.card-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;background:var(--s2)}
.card-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 52%);opacity:0;transition:opacity var(--ease);display:flex;align-items:flex-end;padding:11px}
.card:hover .card-ov{opacity:1}
.play-dot{width:36px;height:36px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.play-dot svg{width:15px;height:15px;color:#000;margin-left:2px}
.card-badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);padding:3px 7px;border-radius:5px;font-size:10.5px;font-weight:700;color:var(--gold)}
.card-info{padding:9px 2px 0}
.card-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card-sub{font-size:11px;color:var(--muted)}

/* ── SKELETON ── */
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:11px}
@keyframes sk{to{background-position:-200% 0}}

/* ── SEARCH PAGE ── */
.spage{padding:80px 24px 40px;display:none}
.spage.on{display:block}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:18px;margin-top:18px}
.sempty{text-align:center;padding:72px 0;color:var(--muted);grid-column:1/-1}
.sempty .ei{font-size:56px;margin-bottom:14px}
.sempty h3{font-size:18px;color:var(--text);margin-bottom:6px}

/* ── MODAL OVERLAY ── */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.94);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 16px}
.overlay.on{display:flex}
.modal{width:100%;max-width:940px;background:var(--s1);border-radius:20px;overflow:hidden;border:1px solid var(--border);animation:mIn .28s cubic-bezier(.34,1.56,.64,1);margin:auto;position:relative}
@keyframes mIn{from{opacity:0;transform:scale(.93) translateY(18px)}to{opacity:1;transform:none}}

/* ── PLAYER ── */
.pbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.pbox iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}
.pspinner{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:13px;color:var(--muted);z-index:2;transition:opacity .4s}
.pspinner.gone{opacity:0;pointer-events:none}
.spin{width:40px;height:40px;border:3px solid var(--s3);border-top-color:var(--red);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.close-x{position:absolute;top:12px;right:12px;z-index:10;width:36px;height:36px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;transition:background var(--ease)}
.close-x:hover{background:rgba(255,255,255,.15)}

/* ── MODAL INFO ── */
.minfo{padding:26px 30px;display:flex;gap:22px}
.mposter{flex-shrink:0;width:112px;height:168px;border-radius:11px;overflow:hidden;background:var(--s2)}
.mposter img{width:100%;height:100%;object-fit:cover}
.mdet{flex:1;min-width:0}
.mtitle{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;line-height:1.15}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:13px}
.mtag{background:var(--s2);border:1px solid var(--border);padding:3px 9px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--text)}
.movw{font-size:13.5px;line-height:1.7;color:rgba(245,245,247,.72);margin-bottom:18px}
.macts{display:flex;gap:9px;flex-wrap:wrap}

/* ── SERVER PICKER ── */
.mpick{padding:0 30px 26px}
.pick-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pick-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.srv-row{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:7px 15px;background:var(--s3);border:1px solid var(--border);border-radius:20px;font-size:12.5px;font-weight:500;color:var(--muted);transition:all var(--ease)}
.sbtn:hover,.sbtn.on{background:#fff;color:#000;border-color:#fff}

/* ── EPISODE PICKER ── */
.epick{padding:0 30px 26px;border-top:1px solid var(--border)}
.seas-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:13px;padding-top:18px}
.seas-row::-webkit-scrollbar{display:none}
.seabtn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;border:1px solid var(--border);color:var(--muted);background:var(--s1);transition:all var(--ease)}
.seabtn.on,.seabtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px}
.epbtn{aspect-ratio:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all var(--ease)}
.epbtn.on,.epbtn:hover{background:var(--red);border-color:var(--red);color:#fff}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--s3);border:1px solid var(--border);padding:9px 20px;border-radius:50px;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:all .26s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ── HOME ── */
#home{display:block}
#home.off{display:none}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .nav{padding:0 16px}
  .srch input{width:120px}
  .hero{height:400px}
  .hero-body{left:20px;right:20px;bottom:36px}
  .section{padding:8px 16px 30px}
  .genres{padding:14px 16px 4px}
  .minfo{flex-direction:column;padding:20px}
  .mposter{width:88px;height:132px}
  .mpick,.epick{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="logo">
    <div class="logo-box">🎬</div>
    Stream<em>Vault</em>
  </div>
  <div class="ntabs">
    <button class="nt on" onclick="navClick(this,'movies')">Movies</button>
    <button class="nt" onclick="navClick(this,'tv')">TV Shows</button>
    <button class="nt" onclick="navClick(this,'trending')">Trending</button>
    <button class="nt" onclick="navClick(this,'toprated')">Top Rated</button>
    <button class="nt" onclick="navClick(this,'anime')">Anime</button>
  </div>
  <div class="srch">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    <input type="text" id="sInput" placeholder="Search movies & shows…" oninput="onSearch(this.value)" autocomplete="off">
  </div>
</nav>

<main class="main">

<!-- HOME -->
<div id="home">

  <!-- HERO -->
  <section class="hero" id="heroSection" onclick="playHero()">
    <img class="hero-img" id="heroBg" src="" alt="">
    <div class="hero-grad"></div>
    <div class="hero-body">
      <div class="hero-badge">● Now Trending</div>
      <h1 class="hero-title" id="heroTitle">Loading…</h1>
      <div class="hero-meta">
        <span class="stars">★ <span id="heroRating">—</span></span>
        <span id="heroYear">—</span>
        <span class="pill" id="heroTag">—</span>
      </div>
      <p class="hero-desc" id="heroDesc">Fetching content…</p>
      <div class="hero-acts">
        <button class="btn btn-w" onclick="event.stopPropagation();playHero()">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
          Play Now
        </button>
        <button class="btn btn-g" onclick="event.stopPropagation();infoHero()">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
          More Info
        </button>
      </div>
    </div>
  </section>

  <!-- GENRES -->
  <div class="genres" id="genreRow"></div>

  <!-- CONTENT ROWS -->
  <section class="section" id="sec-trending">
    <div class="sec-hd"><h2 class="sec-title">🔥 Trending This Week</h2></div>
    <div class="row" id="rowTrending"></div>
  </section>
  <section class="section" id="sec-movies">
    <div class="sec-hd"><h2 class="sec-title">🎬 Popular Movies</h2></div>
    <div class="row" id="rowMovies"></div>
  </section>
  <section class="section" id="sec-tv">
    <div class="sec-hd"><h2 class="sec-title">📺 Popular TV Shows</h2></div>
    <div class="row" id="rowTV"></div>
  </section>
  <section class="section" id="sec-toprated">
    <div class="sec-hd"><h2 class="sec-title">⭐ Top Rated Movies</h2></div>
    <div class="row" id="rowTopMovies"></div>
  </section>
  <section class="section" id="sec-topratedtv">
    <div class="sec-hd"><h2 class="sec-title">🏆 Acclaimed Series</h2></div>
    <div class="row" id="rowTopTV"></div>
  </section>
  <section class="section" id="sec-anime">
    <div class="sec-hd"><h2 class="sec-title">🍜 Anime</h2></div>
    <div class="row" id="rowAnime"></div>
  </section>

</div>

<!-- SEARCH PAGE -->
<div class="spage" id="spage">
  <h2 style="font-size:21px;font-weight:700">Search Results</h2>
  <p style="color:var(--muted);font-size:13px;margin-top:4px" id="sSubtitle"></p>
  <div class="sgrid" id="sgrid"></div>
</div>

</main>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="modal" id="modal">

    <!-- PLAYER -->
    <div class="pbox" id="pbox">
      <div class="pspinner" id="pspinner">
        <div class="spin"></div>
        <span id="pspinMsg">Loading stream…</span>
      </div>
      <iframe id="pframe"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        frameborder="0">
      </iframe>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>

    <!-- INFO -->
    <div class="minfo" id="minfo">
      <div class="mposter"><img id="mPoster" src="" alt=""></div>
      <div class="mdet">
        <h2 class="mtitle" id="mTitle"></h2>
        <div class="mmeta" id="mMeta"></div>
        <p class="movw" id="mDesc"></p>
        <div class="macts" id="mActs"></div>
      </div>
    </div>

    <!-- SERVER PICKER -->
    <div class="mpick">
      <div class="pick-bar">
        <span class="pick-label">Stream Server</span>
        <span style="font-size:11.5px;color:var(--muted)">Try another if video doesn't load</span>
      </div>
      <div class="srv-row" id="srvRow"></div>
    </div>

    <!-- TV EPISODES (hidden for movies) -->
    <div class="epick" id="epick" style="display:none">
      <div class="pick-label" style="padding-top:18px;margin-bottom:10px">Season</div>
      <div class="seas-row" id="seasRow"></div>
      <div class="pick-label" style="margin-bottom:10px">Episode</div>
      <div class="ep-grid" id="epGrid"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════
const BEARER = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI1ZjU0YTM2MDFjNzQ1N2E4NjJjYThjNzBmZWEyOGE2YiIsIm5iZiI6MTc4MTkxNjA5Ny4zOTgwMDAyLCJzdWIiOiI2YTM1ZTFjMTNiNTZlMWZhYzNkNDgxMmYiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.g4ml-3xHUW1XMoOb0csHXMLJcuCdaKlvUypCE8R3Nts';
const TMDB = 'https://api.themoviedb.org/3';
const IMG  = 'https://image.tmdb.org/t/p/';

// ── SERVERS ──────────────────────────────────────────
// All confirmed working embed patterns (no sandbox needed when opened locally)
const SERVERS = [
  {
    name: 'VidLink',
    movie: id  => `https://vidlink.pro/movie/${id}?autoplay=true&primaryColor=e50914`,
    tv:   (id,s,e) => `https://vidlink.pro/tv/${id}/${s}/${e}?autoplay=true&primaryColor=e50914`
  },
  {
    name: 'VidSrc',
    movie: id  => `https://vidsrc.me/embed/movie?tmdb=${id}`,
    tv:   (id,s,e) => `https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`
  },
  {
    name: 'VidSrc.cc',
    movie: id  => `https://vidsrc.cc/v2/embed/movie/${id}`,
    tv:   (id,s,e) => `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}`
  },
  {
    name: 'SuperEmbed',
    movie: id  => `https://multiembed.mov/?video_id=${id}&tmdb=1`,

  },
  {
    name: '2Embed',
    movie: id  => `https://www.2embed.stream/embed/movie/${id}`,
    tv:   (id,s,e) => `https://www.2embed.stream/embed/tv/${id}/${s}/${e}`
  },
  {
    name: 'EmbedSu',
    movie: id  => `https://embed.su/embed/movie/${id}`,
    tv:   (id,s,e) => `https://embed.su/embed/tv/${id}/${s}/${e}`
  },
  {
    name: 'NovaScrape',
    movie: id  => `https://player.autoembed.cc/embed/movie/${id}`,
    tv:   (id,s,e) => `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`
  },
];

// ── STATE ────────────────────────────────────────────
let curItem=null, curType='movie', curSeason=1, curEp=1, curSrv=0;
let heroItem=null, genreMap={}, searchTimer=null;

// ── TMDB FETCH (bearer auth) ─────────────────────────
async function api(path, params={}) {
  const url = new URL(`${TMDB}${path}`);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url, {
    headers: {
      'Authorization': `Bearer ${BEARER}`,
      'Content-Type': 'application/json'
    }
  });
  return r.json();
}

// ── SKELETON ─────────────────────────────────────────
function skelRow(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = Array(10).fill(0).map(()=>`
    <div class="card">
      <div class="sk" style="width:152px;aspect-ratio:2/3"></div>
      <div class="sk" style="width:110px;height:11px;margin-top:9px;border-radius:4px"></div>
      <div class="sk" style="width:72px;height:9px;margin-top:5px;border-radius:4px"></div>
    </div>`).join('');
}

// ── INIT ─────────────────────────────────────────────
async function init() {
  ['rowTrending','rowMovies','rowTV','rowTopMovies','rowTopTV','rowAnime'].forEach(skelRow);

  // Genre maps
  const [mg, tg] = await Promise.all([api('/genre/movie/list'), api('/genre/tv/list')]);
  [...mg.genres, ...tg.genres].forEach(g => genreMap[g.id] = g.name);

  // Genre pills
  const GP = [
    {id:28,n:'Action'},{id:35,n:'Comedy'},{id:18,n:'Drama'},{id:27,n:'Horror'},
    {id:878,n:'Sci-Fi'},{id:10749,n:'Romance'},{id:53,n:'Thriller'},
    {id:16,n:'Animation'},{id:80,n:'Crime'},{id:12,n:'Adventure'},
    {id:14,n:'Fantasy'},{id:99,n:'Documentary'},{id:10751,n:'Family'},
    {id:36,n:'History'},{id:10402,n:'Music'}
  ];
  document.getElementById('genreRow').innerHTML = GP.map(g =>
    `<button class="gp" onclick="browseGenre(${g.id},'${g.n}')">${g.n}</button>`
  ).join('');

  // Load all rows in parallel
  await Promise.all([
    loadTrending(), loadMovies(), loadTV(),
    loadTopMovies(), loadTopTV(), loadAnime()
  ]);
}

async function loadTrending() {
  const d = await api('/trending/all/week');
  heroItem = d.results[0];
  renderHero(heroItem);
  renderRow('rowTrending', d.results.slice(0,20), true);
}
async function loadMovies()    { const d = await api('/movie/popular');   renderRow('rowMovies', d.results.map(m=>({...m,media_type:'movie'}))); }
async function loadTV()        { const d = await api('/tv/popular');      renderRow('rowTV', d.results.map(t=>({...t,media_type:'tv'}))); }
async function loadTopMovies() { const d = await api('/movie/top_rated'); renderRow('rowTopMovies', d.results.map(m=>({...m,media_type:'movie'}))); }
async function loadTopTV()     { const d = await api('/tv/top_rated');    renderRow('rowTopTV', d.results.map(t=>({...t,media_type:'tv'}))); }
async function loadAnime()     {
  const d = await api('/discover/tv', {with_genres:'16', sort_by:'popularity.desc', with_original_language:'ja'});
  renderRow('rowAnime', d.results.map(t=>({...t,media_type:'tv'})));
}

// ── HERO ─────────────────────────────────────────────
function renderHero(item) {
  if (!item) return;
  const title = item.title || item.name || '';
  const year  = (item.release_date || item.first_air_date || '').slice(0,4);
  const g     = (item.genre_ids||[]).map(id=>genreMap[id]).filter(Boolean)[0] || '';
  document.getElementById('heroBg').src            = item.backdrop_path ? `${IMG}original${item.backdrop_path}` : '';
  document.getElementById('heroTitle').textContent  = title;
  document.getElementById('heroRating').textContent = (item.vote_average||0).toFixed(1);
  document.getElementById('heroYear').textContent   = year;
  document.getElementById('heroTag').textContent    = g || (item.media_type==='tv' ? 'TV Series' : 'Movie');
  document.getElementById('heroDesc').textContent   = item.overview || '';
}
function playHero() { if(heroItem) openModal(heroItem, heroItem.media_type==='tv'?'tv':'movie', true); }
function infoHero() { if(heroItem) openModal(heroItem, heroItem.media_type==='tv'?'tv':'movie', false); }

// ── RENDER ROW ───────────────────────────────────────
function renderRow(rowId, items, showType=false) {
  const el = document.getElementById(rowId);
  if (!el) return;
  el.innerHTML = items.slice(0,20).map(item => cardHTML(item, showType)).join('');
}

function cardHTML(item, showType=false) {
  const isMovie = item.media_type !== 'tv';
  const title   = (item.title || item.name || '—').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const poster  = item.poster_path ? `${IMG}w342${item.poster_path}` : null;
  const year    = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating  = item.vote_average ? item.vote_average.toFixed(1) : null;
  const type    = showType ? (isMovie?'🎬':'📺') : '';
  const sub     = [type, year].filter(Boolean).join(' ');
  const mtype   = isMovie ? 'movie' : 'tv';
  // Safely encode item data
  const data    = encodeURIComponent(JSON.stringify(item));

  return `<div class="card" onclick="cardClick('${data}','${mtype}')">
    <div class="card-poster">
      ${poster
        ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-ph>🎬</div>'">`
        : `<div class="card-ph">🎬</div>`}
      ${rating ? `<div class="card-badge">★ ${rating}</div>` : ''}
      <div class="card-ov"><div class="play-dot"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg></div></div>
    </div>
    <div class="card-info">
      <div class="card-name" title="${title}">${title}</div>
      <div class="card-sub">${sub}</div>
    </div>
  </div>`;
}

function cardClick(encoded, type) {
  try {
    const item = JSON.parse(decodeURIComponent(encoded));
    openModal(item, type, true);
  } catch(e) { console.error(e); }
}

// ── OPEN MODAL ───────────────────────────────────────
async function openModal(item, type, autoPlay=true) {
  curItem   = item;
  curType   = type;
  curSeason = 1;
  curEp     = 1;
  curSrv    = 0;

  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';

  // Reset player
  const frame = document.getElementById('pframe');
  frame.src   = 'about:blank';
  showSpinner('Loading stream…');

  // Fill info
  const title   = item.title || item.name || '—';
  const year    = (item.release_date || item.first_air_date || '').slice(0,4);
  const rating  = item.vote_average ? item.vote_average.toFixed(1) : null;
  const poster  = item.poster_path ? `${IMG}w342${item.poster_path}` : '';
  const genres  = (item.genre_ids||[]).map(id=>genreMap[id]).filter(Boolean);

  document.getElementById('mTitle').textContent  = title;
  document.getElementById('mDesc').textContent   = item.overview || 'No description available.';
  document.getElementById('mPoster').src         = poster;
  document.getElementById('mPoster').alt         = title;

  document.getElementById('mMeta').innerHTML = [
    year ? `<span>${year}</span>` : '',
    rating ? `<span class="stars">★ ${rating}</span>` : '',
    `<span class="mtag">${curType==='movie'?'Movie':'TV Series'}</span>`,
    ...genres.slice(0,3).map(g=>`<span class="mtag">${g}</span>`)
  ].join('<span style="color:var(--dim);padding:0 2px">·</span>');

  document.getElementById('mActs').innerHTML = `
    <button class="btn btn-r btn-sm" onclick="doPlay()">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
      Play
    </button>
    <button class="btn btn-g btn-sm" onclick="shareItem('${title.replace(/'/g,"\\'")}')">Share</button>
  `;

  // Server buttons
  document.getElementById('srvRow').innerHTML = SERVERS.map((s,i) =>
    `<button class="sbtn ${i===0?'on':''}" onclick="switchSrv(${i})">${s.name}</button>`
  ).join('');

  // TV episodes
  if (curType === 'tv') {
    document.getElementById('epick').style.display = 'block';
    await loadSeasons(item.id);
  } else {
    document.getElementById('epick').style.display = 'none';
  }

  if (autoPlay) doPlay();
  else hideSpinner();
}

function switchSrv(i) {
  curSrv = i;
  document.querySelectorAll('.sbtn').forEach((b,j)=>b.classList.toggle('on',j===i));
  doPlay();
}

// ── PLAY ─────────────────────────────────────────────
function doPlay() {
  const frame = document.getElementById('pframe');
  const srv   = SERVERS[curSrv];
  showSpinner(`Loading ${srv.name}…`);

  const src = curType === 'movie'
    ? srv.movie(curItem.id)
    : srv.tv(curItem.id, curSeason, curEp);

  frame.src = src;

  // Hide spinner after delay (cross-origin iframe can't be detected)
  clearTimeout(window._spinTimer);
  window._spinTimer = setTimeout(hideSpinner, 3500);
}

function showSpinner(msg='Loading…') {
  const sp = document.getElementById('pspinner');
  document.getElementById('pspinMsg').textContent = msg;
  sp.classList.remove('gone');
}
function hideSpinner() {
  document.getElementById('pspinner').classList.add('gone');
}

// ── SEASONS / EPISODES ───────────────────────────────
async function loadSeasons(tvId) {
  try {
    const d = await api(`/tv/${tvId}`);
    const seas = (d.seasons||[]).filter(s=>s.season_number>0);
    buildSeasons(seas.length ? seas : [{season_number:1,episode_count:12}]);
  } catch {
    buildSeasons([{season_number:1,episode_count:12}]);
  }
}

function buildSeasons(seas) {
  document.getElementById('seasRow').innerHTML = seas.map(s =>
    `<button class="seabtn ${s.season_number===1?'on':''}" onclick="pickSeason(${s.season_number},${s.episode_count||20},this)">S${s.season_number}</button>`
  ).join('');
  buildEps(seas[0]?.episode_count || 12);
}

function pickSeason(num, count, btn) {
  curSeason=num; curEp=1;
  document.querySelectorAll('.seabtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildEps(count);
}

function buildEps(count) {
  document.getElementById('epGrid').innerHTML =
    Array.from({length:Math.min(count,60)},(_,i)=>i+1).map(ep=>
      `<button class="epbtn ${ep===curEp?'on':''}" onclick="pickEp(${ep},this)">E${ep}</button>`
    ).join('');
}

function pickEp(ep, btn) {
  curEp=ep;
  document.querySelectorAll('.epbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  doPlay();
}

// ── CLOSE ────────────────────────────────────────────
function closeModal() {
  clearTimeout(window._spinTimer);
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('pframe').src = 'about:blank';
  document.body.style.overflow = '';
}
function bgClick(e) { if(e.target===document.getElementById('overlay')) closeModal(); }

// ── SEARCH ───────────────────────────────────────────
function onSearch(val) {
  clearTimeout(searchTimer);
  const home = document.getElementById('home');
  const sp   = document.getElementById('spage');
  if (!val.trim()) {
    home.classList.remove('off');
    sp.classList.remove('on');
    return;
  }
  home.classList.add('off');
  sp.classList.add('on');
  document.getElementById('sSubtitle').textContent = `Searching for "${val}"…`;
  document.getElementById('sgrid').innerHTML = Array(8).fill(0).map(()=>`
    <div><div class="sk" style="width:100%;aspect-ratio:2/3"></div>
    <div class="sk" style="width:75%;height:11px;margin-top:8px;border-radius:4px"></div></div>`).join('');
  searchTimer = setTimeout(()=>doSearch(val), 400);
}

async function doSearch(q) {
  const d = await api('/search/multi', {query:q, include_adult:false});
  const r = d.results.filter(x=>(x.media_type==='movie'||x.media_type==='tv') && (x.poster_path||x.backdrop_path));
  document.getElementById('sSubtitle').textContent = `${r.length} result${r.length!==1?'s':''} for "${q}"`;
  if (!r.length) {
    document.getElementById('sgrid').innerHTML = `<div class="sempty"><div class="ei">🔍</div><h3>Nothing found</h3><p>Try a different title or genre</p></div>`;
    return;
  }
  document.getElementById('sgrid').innerHTML = r.map(x=>cardHTML(x)).join('');
}

// ── NAV TABS ─────────────────────────────────────────
function navClick(btn, tab) {
  document.querySelectorAll('.nt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('sInput').value = '';
  document.getElementById('home').classList.remove('off');
  document.getElementById('spage').classList.remove('on');
  const map = {
    movies:'sec-movies', tv:'sec-tv', trending:'sec-trending',
    toprated:'sec-toprated', anime:'sec-anime'
  };
  const el = document.getElementById(map[tab]);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── GENRE BROWSE ─────────────────────────────────────
async function browseGenre(id, name) {
  document.getElementById('home').classList.add('off');
  document.getElementById('spage').classList.add('on');
  document.getElementById('sSubtitle').textContent = `Browsing: ${name}`;
  document.getElementById('sgrid').innerHTML = Array(8).fill(0).map(()=>`
    <div><div class="sk" style="width:100%;aspect-ratio:2/3"></div></div>`).join('');

  const [mv, tv] = await Promise.all([
    api('/discover/movie', {with_genres:id, sort_by:'popularity.desc'}),
    api('/discover/tv',    {with_genres:id, sort_by:'popularity.desc'})
  ]);
  const combined = [
    ...mv.results.map(m=>({...m,media_type:'movie'})),
    ...tv.results.map(t=>({...t,media_type:'tv'}))
  ].sort((a,b)=>b.popularity-a.popularity);

  document.getElementById('sgrid').innerHTML = combined.length
    ? combined.map(x=>cardHTML(x)).join('')
    : `<div class="sempty"><div class="ei">🎬</div><h3>Nothing found</h3></div>`;

  document.querySelectorAll('.gp').forEach(p=>p.classList.toggle('on',p.textContent===name));
}

// ── SHARE ────────────────────────────────────────────
function shareItem(title) {
  if (navigator.share) {
    navigator.share({title:`Watch ${title}`, text:`Watching "${title}" on StreamVault`});
  } else {
    navigator.clipboard?.writeText(window.location.href);
    showToast('📋 Link copied!');
  }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2500);
}

// ── KEYBOARD ─────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
  if (e.key==='f' || e.key==='F') {
    if (document.getElementById('overlay').classList.contains('on'))
      document.getElementById('pframe').requestFullscreen?.();
  }
});

// ── GO ───────────────────────────────────────────────
init();
</script>
