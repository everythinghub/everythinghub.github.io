<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skycast</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #f2f2f7;
  --card:         rgba(255,255,255,0.72);
  --card-solid:   #ffffff;
  --stat-bg:      rgba(120,120,128,0.10);
  --border:       rgba(0,0,0,0.09);
  --text:         #1c1c1e;
  --text2:        #48484a;
  --muted:        #8e8e93;
  --accent:       #007aff;
  --accent-bg:    rgba(0,122,255,0.10);
  --shadow:       0 4px 28px rgba(0,0,0,0.10);
  --sep:          rgba(60,60,67,0.13);
  --drop-bg:      #ffffff;
  --drop-hover:   #f0f4ff;
  --hero1:        #5fa8d8;
  --hero2:        #b8ddf5;
  --hero3:        #f2f2f7;
  --err:          #ff3b30;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:           #000000;
    --card:         rgba(28,28,30,0.82);
    --card-solid:   #1c1c1e;
    --stat-bg:      rgba(255,255,255,0.07);
    --border:       rgba(255,255,255,0.10);
    --text:         #ffffff;
    --text2:        rgba(235,235,245,0.80);
    --muted:        #8e8e93;
    --accent:       #0a84ff;
    --accent-bg:    rgba(10,132,255,0.15);
    --shadow:       0 4px 32px rgba(0,0,0,0.55);
    --sep:          rgba(84,84,88,0.38);
    --drop-bg:      #1c1c1e;
    --drop-hover:   #2c2c2e;
    --hero1:        #08142a;
    --hero2:        #0d2040;
    --hero3:        #000000;
    --err:          #ff453a;
  }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}

body {
  font-family: 'Outfit', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

.hero-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(160deg, var(--hero1) 0%, var(--hero2) 45%, var(--hero3) 80%);
}

.page {
  position: relative; z-index: 1;
  max-width: 660px; margin: 0 auto;
  padding: 56px 18px 90px;
}

/* ── SEARCH BAR + DROPDOWN ── */
.search-area { position: relative; margin-bottom: 28px; }

.search-row { display: flex; gap: 10px; }

.search-input {
  flex: 1; height: 52px; padding: 0 18px;
  background: var(--card);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  font-family: 'Outfit', sans-serif; font-size: 16px; color: var(--text);
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3.5px var(--accent-bg);
}

.search-btn {
  height: 52px; padding: 0 22px; border: none; border-radius: 16px;
  background: var(--accent); color: #fff;
  font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  white-space: nowrap; transition: opacity .15s, transform .12s;
  flex-shrink: 0;
}
.search-btn:hover { opacity: .88; }
.search-btn:active { transform: scale(.96); }

/* DROPDOWN */
.dropdown {
  position: absolute; top: calc(100% + 6px); left: 0;
  width: calc(100% - 90px); /* align under input only */
  background: var(--drop-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  z-index: 999;
  display: none;
}
.dropdown.open { display: block; }

.drop-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--sep);
  transition: background .12s;
}
.drop-item:last-child { border-bottom: none; }
.drop-item:hover, .drop-item.focused { background: var(--drop-hover); }

.drop-icon { font-size: 20px; flex-shrink: 0; }

.drop-text { flex: 1; min-width: 0; }
.drop-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drop-sub  { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.drop-searching {
  padding: 14px 16px; font-size: 14px; color: var(--muted);
  display: flex; align-items: center; gap: 10px;
}
.mini-spin {
  width: 16px; height: 16px; border: 2px solid var(--sep);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; flex-shrink: 0;
}

/* ── UNIT PILL ── */
.unit-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.unit-pill {
  display: flex; border-radius: 999px; overflow: hidden;
  background: var(--card);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
}
.unit-btn {
  padding: 7px 18px; border: none; background: transparent;
  color: var(--muted); font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
  border-radius: 999px; transition: background .2s, color .2s;
}
.unit-btn.on { background: var(--accent); color: #fff; }

/* ── GLASS CARD ── */
.card {
  background: var(--card);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 26px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  animation: up .4s ease both;
}
@keyframes up { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;} }

/* ── MAIN CARD ── */
.main-card { padding: 28px 26px 24px; }

.loc-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.loc-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
.loc-sub  { font-size: 13px; color: var(--muted); margin-top: 3px; }
.cond-pill {
  background: var(--accent-bg); color: var(--accent);
  font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  white-space: nowrap; flex-shrink: 0;
}

.temp-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 8px 0 6px;
}
.big-temp { font-size: 84px; font-weight: 300; letter-spacing: -4px; line-height: 1; }
.main-icon { width: 108px; height: 108px; }

.feel-row { display: flex; gap: 18px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 22px; }

/* ── STATS ── */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.stat { background: var(--stat-bg); border-radius: 18px; padding: 14px 13px 12px; }
.stat-icon { width: 28px; height: 28px; margin-bottom: 6px; }
.stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.stat-val { font-size: 18px; font-weight: 700; }
.su { font-size: 12px; font-weight: 400; color: var(--muted); }

/* ── HOURLY ── */
.sec-lbl {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 700;
  padding: 16px 22px 12px; border-bottom: 1px solid var(--sep);
}
.hourly-scroll {
  display: flex; gap: 14px; overflow-x: auto;
  padding: 14px 18px 16px; scrollbar-width: none;
}
.hourly-scroll::-webkit-scrollbar { display: none; }
.hour { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 52px; }
.hour-time { font-size: 12px; color: var(--muted); font-weight: 600; }
.hour-icon { width: 36px; height: 36px; }
.hour-temp { font-size: 15px; font-weight: 700; }
.hour-rain { font-size: 11px; color: var(--accent); font-weight: 600; }

/* ── 5-DAY ── */
.fc-row { display: flex; align-items: center; padding: 13px 22px; border-bottom: 1px solid var(--sep); }
.fc-row:last-child { border-bottom: none; }
.fc-day { width: 60px; font-size: 15px; font-weight: 600; }
.fc-icon { width: 40px; }
.fc-icon img { width: 34px; height: 34px; }
.fc-desc { flex: 1; font-size: 14px; color: var(--muted); padding: 0 10px; }
.fc-temps { display: flex; gap: 10px; font-size: 15px; font-weight: 700; }
.fc-lo { color: var(--muted); }

/* ── STATES ── */
.state { text-align: center; padding: 60px 20px; animation: up .4s ease both; }
.state img { width: 110px; height: 110px; margin-bottom: 16px; }
.state h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.state p  { color: var(--muted); font-size: 15px; }

.spinner {
  width: 42px; height: 42px; margin: 0 auto 16px;
  border: 3px solid var(--sep); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg);} }

.err-msg { color: var(--err); font-size: 15px; margin-top: 8px; }

.hidden { display: none !important; }

.attr { font-size: 11px; color: var(--muted); text-align: center; margin-top: 20px; }
.attr a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="hero-bg"></div>
<div class="page">

  <!-- SEARCH -->
  <div class="search-area">
    <div class="search-row">
      <input class="search-input" id="q" type="text"
        placeholder="City, state, country, zip…"
        autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="search-btn" id="searchBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Search
      </button>
    </div>
    <!-- AUTOCOMPLETE DROPDOWN -->
    <div class="dropdown" id="dropdown"></div>
  </div>

  <!-- UNIT TOGGLE -->
  <div class="unit-row hidden" id="unitRow">
    <div class="unit-pill">
      <button class="unit-btn on" id="btnF">°F</button>
      <button class="unit-btn" id="btnC">°C</button>
    </div>
  </div>

  <!-- WELCOME -->
  <div class="state" id="welcome">
    <img src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/day-sunny.svg" alt="">
    <h2>Check the weather anywhere</h2>
    <p>Search any city, state, country, or zip code.</p>
  </div>

  <!-- LOADING -->
  <div class="state hidden" id="loading">
    <div class="spinner"></div>
    <p>Fetching weather…</p>
  </div>

  <!-- ERROR -->
  <div class="state hidden" id="errState">
    <img src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/not-available.svg" alt="" style="width:80px;height:80px;">
    <p class="err-msg" id="errMsg">Location not found.</p>
  </div>

  <!-- WEATHER CONTENT -->
  <div id="content" class="hidden">

    <div class="card main-card">
      <div class="loc-row">
        <div>
          <div class="loc-name" id="locName">—</div>
          <div class="loc-sub"  id="locSub">—</div>
        </div>
        <div class="cond-pill" id="condPill">—</div>
      </div>
      <div class="temp-row">
        <div class="big-temp" id="bigTemp">—</div>
        <img class="main-icon" id="mainIcon" src="" alt="">
      </div>
      <div class="feel-row">
        <span id="feelLike">Feels like —</span>
        <span id="hiLo">H:— L:—</span>
      </div>
      <div class="stats">
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/humidity.svg" alt="">
          <div class="stat-lbl">Humidity</div>
          <div class="stat-val" id="sHum">—</div>
        </div>
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/wind.svg" alt="">
          <div class="stat-lbl">Wind</div>
          <div class="stat-val" id="sWind">—</div>
        </div>
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/thermometer.svg" alt="">
          <div class="stat-lbl">Feels Like</div>
          <div class="stat-val" id="sFeel">—</div>
        </div>
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/uv-index.svg" alt="">
          <div class="stat-lbl">UV Index</div>
          <div class="stat-val" id="sUV">—</div>
        </div>
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/pressure-low.svg" alt="">
          <div class="stat-lbl">Pressure</div>
          <div class="stat-val" id="sPres">—</div>
        </div>
        <div class="stat">
          <img class="stat-icon" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/wind-beaufort-3.svg" alt="">
          <div class="stat-lbl">Wind Dir</div>
          <div class="stat-val" id="sDir">—</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div class="sec-lbl">Hourly forecast</div>
      <div class="hourly-scroll" id="hourly"></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden;">
      <div class="sec-lbl">5-day forecast</div>
      <div id="forecast"></div>
    </div>

    <div class="attr">Weather by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> · CC BY 4.0 &nbsp;|&nbsp; Icons by <a href="https://github.com/basmilius/weather-icons" target="_blank">Basmilius</a></div>
  </div>

</div>

<script>
/* ===================================================
   WMO CODE MAPPING
=================================================== */
const WMO = {
  0:  ['Clear sky',              d => d ? 'clear-day'                      : 'clear-night'],
  1:  ['Mainly clear',           d => d ? 'partly-cloudy-day'              : 'partly-cloudy-night'],
  2:  ['Partly cloudy',          d => d ? 'partly-cloudy-day'              : 'partly-cloudy-night'],
  3:  ['Overcast',               _  => 'overcast'],
  45: ['Fog',                    _  => 'fog'],
  48: ['Icy fog',                _  => 'fog'],
  51: ['Light drizzle',          _  => 'drizzle'],
  53: ['Drizzle',                _  => 'drizzle'],
  55: ['Heavy drizzle',          _  => 'drizzle'],
  56: ['Freezing drizzle',       _  => 'sleet'],
  57: ['Heavy freezing drizzle', _  => 'sleet'],
  61: ['Slight rain',            d => d ? 'partly-cloudy-day-rain'         : 'partly-cloudy-night-rain'],
  63: ['Moderate rain',          _  => 'rain'],
  65: ['Heavy rain',             _  => 'extreme-rain'],
  66: ['Freezing rain',          _  => 'sleet'],
  67: ['Heavy freezing rain',    _  => 'sleet'],
  71: ['Slight snow',            _  => 'snow'],
  73: ['Moderate snow',          _  => 'snow'],
  75: ['Heavy snow',             _  => 'extreme-snow'],
  77: ['Snow grains',            _  => 'snow'],
  80: ['Slight showers',         d => d ? 'partly-cloudy-day-rain'         : 'partly-cloudy-night-rain'],
  81: ['Moderate showers',       _  => 'rain'],
  82: ['Violent showers',        _  => 'extreme-rain'],
  85: ['Snow showers',           _  => 'snow'],
  86: ['Heavy snow showers',     _  => 'extreme-snow'],
  95: ['Thunderstorm',           _  => 'thunderstorms'],
  96: ['Thunderstorm + hail',    _  => 'thunderstorms'],
  99: ['Thunderstorm + hail',    _  => 'thunderstorms'],
};
const wmoLabel = c => (WMO[c] || ['Unknown'])[0];
const wmoIcon  = (c, day) => {
  const fn = (WMO[c] || [null, _ => 'not-available'])[1];
  return `https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/${fn(day)}.svg`;
};
const wmoEmoji = c => {
  if (c === 0) return '☀️';
  if (c <= 2)  return '⛅';
  if (c === 3) return '☁️';
  if (c <= 48) return '🌫️';
  if (c <= 57) return '🌦️';
  if (c <= 67) return '🌧️';
  if (c <= 77) return '❄️';
  if (c <= 82) return '🌧️';
  if (c <= 86) return '🌨️';
  return '⛈️';
};

/* ===================================================
   UNIT HELPERS
=================================================== */
let unitF = true;
const cToF    = c => Math.round(c * 9/5 + 32);
const kphToMph= k => Math.round(k * 0.621);
const degToDir= d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
const fmtT    = c => unitF ? cToF(c)+'°' : Math.round(c)+'°';
const fmtW    = k => unitF ? kphToMph(k)+' mph' : Math.round(k)+' km/h';

function dayName(str) {
  const d = new Date(str+'T12:00:00'), t = new Date();
  t.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return d.getTime()===t.getTime() ? 'Today' : d.toLocaleDateString('en-US',{weekday:'short'});
}
function fmtHour(iso) {
  const d = new Date(iso), h = d.getHours()%12||12, ap = d.getHours()>=12?'PM':'AM';
  return h+' '+ap;
}

/* ===================================================
   STATE DISPLAY
=================================================== */
let raw=null, geoName='', geoAdmin='';

function showState(id) {
  ['welcome','loading','errState','content'].forEach(x =>
    document.getElementById(x).classList.toggle('hidden', x!==id));
  document.getElementById('unitRow').classList.toggle('hidden', id!=='content');
}

/* ===================================================
   RENDER WEATHER
=================================================== */
function render() {
  if (!raw) return;
  const cur=raw.current, h=raw.hourly, daily=raw.daily;
  const isDay = cur.is_day===1;

  // find current hour index
  const nowHour = cur.time.slice(0,13)+':00';
  let nowIdx = h.time.indexOf(nowHour);
  if (nowIdx < 0) nowIdx = 0;

  document.getElementById('locName').textContent  = geoName;
  document.getElementById('locSub').textContent   = geoAdmin;
  document.getElementById('condPill').textContent = wmoLabel(cur.weather_code);
  document.getElementById('bigTemp').textContent  = fmtT(cur.temperature_2m);
  const mi = document.getElementById('mainIcon');
  mi.src = wmoIcon(cur.weather_code, isDay);
  mi.alt = wmoLabel(cur.weather_code);
  document.getElementById('feelLike').textContent = 'Feels like '+fmtT(cur.apparent_temperature);
  document.getElementById('hiLo').textContent     = 'H:'+fmtT(daily.temperature_2m_max[0])+'  L:'+fmtT(daily.temperature_2m_min[0]);

  document.getElementById('sHum').innerHTML  = cur.relative_humidity_2m+'<span class="su"> %</span>';
  document.getElementById('sWind').textContent  = fmtW(cur.wind_speed_10m);
  document.getElementById('sFeel').textContent  = fmtT(cur.apparent_temperature);
  document.getElementById('sUV').textContent    = cur.uv_index ?? '—';
  document.getElementById('sPres').innerHTML    = Math.round(cur.surface_pressure)+'<span class="su"> mb</span>';
  document.getElementById('sDir').textContent   = degToDir(cur.wind_direction_10m);

  // Hourly
  const hourEl = document.getElementById('hourly');
  hourEl.innerHTML = '';
  const end = Math.min(nowIdx+25, h.time.length);
  for (let i=nowIdx; i<end; i++) {
    const rain = h.precipitation_probability[i]||0;
    const div = document.createElement('div');
    div.className='hour';
    div.innerHTML=`
      <div class="hour-time">${i===nowIdx?'Now':fmtHour(h.time[i])}</div>
      <img class="hour-icon" src="${wmoIcon(h.weather_code[i], h.is_day[i])}" alt="">
      <div class="hour-temp">${fmtT(h.temperature_2m[i])}</div>
      ${rain>10?`<div class="hour-rain">${rain}%</div>`:''}
    `;
    hourEl.appendChild(div);
  }

  // 5-day
  const fcEl = document.getElementById('forecast');
  fcEl.innerHTML='';
  daily.time.forEach((date,i)=>{
    const row=document.createElement('div');
    row.className='fc-row';
    row.innerHTML=`
      <div class="fc-day">${dayName(date)}</div>
      <div class="fc-icon"><img src="${wmoIcon(daily.weather_code[i],true)}" alt=""></div>
      <div class="fc-desc">${wmoLabel(daily.weather_code[i])}</div>
      <div class="fc-temps">
        <span>${fmtT(daily.temperature_2m_max[i])}</span>
        <span class="fc-lo">${fmtT(daily.temperature_2m_min[i])}</span>
      </div>
    `;
    fcEl.appendChild(row);
  });

  showState('content');
}

/* ===================================================
   OPEN-METEO WEATHER FETCH
=================================================== */
async function fetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: [
      'temperature_2m','apparent_temperature','is_day','weather_code',
      'relative_humidity_2m','wind_speed_10m','wind_direction_10m',
      'surface_pressure','uv_index'
    ].join(','),
    hourly: ['temperature_2m','weather_code','precipitation_probability','is_day'].join(','),
    daily:  ['weather_code','temperature_2m_max','temperature_2m_min'].join(','),
    wind_speed_unit: 'kmh',
    timezone: 'auto',
    forecast_days: 5,
  });
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!res.ok) throw new Error(`Weather API error ${res.status}`);
  return res.json();
}

/* ===================================================
   GEOCODING (OPEN-METEO) – returns array of results
=================================================== */
async function geocodeSearch(query) {
  const res = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=en&format=json`
  );
  if (!res.ok) throw new Error('Geocoding error');
  const data = await res.json();
  return data.results || [];
}

/* ===================================================
   DROPDOWN
=================================================== */
const dropdown = document.getElementById('dropdown');
let dropResults = [];
let focusIdx = -1;

function openDropdown(items, searching) {
  dropdown.innerHTML = '';
  focusIdx = -1;
  if (searching) {
    dropdown.innerHTML = `<div class="drop-searching"><div class="mini-spin"></div>Searching…</div>`;
    dropdown.classList.add('open');
    return;
  }
  if (!items.length) { closeDropdown(); return; }
  dropResults = items;
  items.forEach((r, i) => {
    const parts = [r.admin1, r.admin2, r.country].filter(Boolean);
    const sub   = [...new Set(parts)].join(', ');
    const code  = r.weather_code ?? null;
    const div   = document.createElement('div');
    div.className = 'drop-item';
    div.dataset.idx = i;
    div.innerHTML = `
      <div class="drop-icon">${flagEmoji(r.country_code)}</div>
      <div class="drop-text">
        <div class="drop-name">${r.name}</div>
        <div class="drop-sub">${sub || r.country || ''}</div>
      </div>
    `;
    div.addEventListener('mousedown', e => { e.preventDefault(); loadPlace(r); });
    dropdown.appendChild(div);
  });
  dropdown.classList.add('open');
}

function closeDropdown() { dropdown.classList.remove('open'); dropdown.innerHTML=''; dropResults=[]; focusIdx=-1; }

function flagEmoji(countryCode) {
  if (!countryCode || countryCode.length!==2) return '📍';
  try {
    return countryCode.toUpperCase().replace(/./g,
      c => String.fromCodePoint(127397 + c.charCodeAt(0)));
  } catch { return '📍'; }
}

/* ===================================================
   DEBOUNCED SEARCH AS YOU TYPE
=================================================== */
let debounceTimer = null;
const qEl = document.getElementById('q');

qEl.addEventListener('input', () => {
  const v = qEl.value.trim();
  clearTimeout(debounceTimer);
  if (v.length < 2) { closeDropdown(); return; }
  openDropdown([], true); // show spinner
  debounceTimer = setTimeout(async () => {
    try {
      const results = await geocodeSearch(v);
      openDropdown(results, false);
    } catch {
      closeDropdown();
    }
  }, 280);
});

// Keyboard navigation in dropdown
qEl.addEventListener('keydown', e => {
  const items = dropdown.querySelectorAll('.drop-item');
  if (!items.length) {
    if (e.key === 'Enter') {
      const v = qEl.value.trim();
      if (v) manualSearch(v);
    }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    focusIdx = Math.min(focusIdx+1, items.length-1);
    items.forEach((el,i)=>el.classList.toggle('focused',i===focusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    focusIdx = Math.max(focusIdx-1, 0);
    items.forEach((el,i)=>el.classList.toggle('focused',i===focusIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (focusIdx>=0 && dropResults[focusIdx]) {
      loadPlace(dropResults[focusIdx]);
    } else {
      manualSearch(qEl.value.trim());
    }
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
});

// Close dropdown when clicking outside
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.search-area')) closeDropdown();
});

/* ===================================================
   MANUAL SEARCH (search button or enter with no selection)
=================================================== */
async function manualSearch(query) {
  if (!query) return;
  closeDropdown();
  showState('loading');
  try {
    const results = await geocodeSearch(query);
    if (!results.length) throw new Error('Location not found');
    await loadPlace(results[0]);
  } catch(e) {
    document.getElementById('errMsg').textContent = e.message || 'Location not found.';
    showState('errState');
  }
}

document.getElementById('searchBtn').addEventListener('click', () => {
  const v = qEl.value.trim();
  if (v) {
    if (focusIdx >= 0 && dropResults[focusIdx]) loadPlace(dropResults[focusIdx]);
    else manualSearch(v);
  }
});
