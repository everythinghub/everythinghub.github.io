<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500&display=swap');

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --bg: #1c1c1e;
    --surface: #2c2c2e;
    --btn-dark: #3a3a3c;
    --btn-mid: #636366;
    --btn-orange: #ff9f0a;
    --btn-orange-press: #ffb340;
    --btn-dark-press: #4a4a4c;
    --btn-mid-press: #7c7c80;
    --text-primary: #ffffff;
    --text-dark: #ffffff;
    --text-op: #000000;
    --display-text: #ffffff;
    --radius-btn: 50%;
    --btn-size: 80px;
    --gap: 12px;
    --font: -apple-system, 'Helvetica Neue', sans-serif;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
  }

  body {
    background: radial-gradient(ellipse at 60% 20%, #2a2a2e 0%, #000 70%);
    min-height: 100vh;
  }

  .calc-wrap {
    background: var(--bg);
    border-radius: 54px;
    padding: 0;
    width: calc(var(--btn-size) * 4 + var(--gap) * 3 + 48px);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 40px 120px rgba(0,0,0,0.9),
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
    animation: appear 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes appear {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Display */
  .display {
    padding: 24px 28px 16px 28px;
    text-align: right;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
  }

  .expression {
    font-size: 18px;
    color: rgba(255,255,255,0.35);
    min-height: 24px;
    letter-spacing: -0.3px;
    font-weight: 300;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    transition: opacity 0.15s;
  }

  .result {
    font-size: 80px;
    font-weight: 300;
    color: var(--display-text);
    line-height: 1;
    letter-spacing: -4px;
    transition: font-size 0.15s ease, color 0.15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
  }

  .result.small   { font-size: 56px; letter-spacing: -2px; }
  .result.xsmall  { font-size: 40px; letter-spacing: -1px; }
  .result.xxsmall { font-size: 30px; letter-spacing: 0; }

  /* Buttons */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, var(--btn-size));
    grid-auto-rows: var(--btn-size);
    gap: var(--gap);
    padding: 16px 24px 32px 24px;
    justify-content: center;
  }

  .btn {
    border: none;
    outline: none;
    cursor: pointer;
    border-radius: var(--radius-btn);
    font-family: var(--font);
    font-size: 32px;
    font-weight: 400;
    color: var(--text-primary);
    background: var(--btn-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: filter 0.08s, transform 0.08s;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 4px 12px rgba(0,0,0,0.4);
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: transparent;
    transition: background 0.08s;
  }

  .btn:active::after {
    background: rgba(255,255,255,0.15);
  }

  .btn:active {
    transform: scale(0.93);
    filter: brightness(1.15);
  }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transform: scale(0);
    animation: ripple-anim 0.35s linear;
    pointer-events: none;
  }
  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Variants */
  .btn.func {
    background: var(--btn-mid);
    color: var(--text-op);
    font-size: 28px;
    font-weight: 500;
  }

  .btn.op {
    background: var(--btn-orange);
    color: #fff;
    font-size: 38px;
    font-weight: 300;
  }

  .btn.op.active {
    background: #fff;
    color: var(--btn-orange);
  }

  .btn.zero {
    grid-column: span 2;
    border-radius: 40px;
    justify-content: flex-start;
    padding-left: 28px;
    font-size: 32px;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 0 24px;
  }

  /* Responsive */
  @media (max-width: 420px) {
    :root {
      --btn-size: 72px;
      --gap: 10px;
    }
    .result { font-size: 68px; }
    .calc-wrap { border-radius: 44px; }
  }

  @media (max-width: 360px) {
    :root {
      --btn-size: 64px;
      --gap: 8px;
    }
  }
</style>
</head>
<body>

<div class="calc-wrap">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="divider"></div>
  <div class="buttons">
    <!-- Row 1 -->
    <button class="btn func" data-action="clear">AC</button>
    <button class="btn func" data-action="sign">+/−</button>
    <button class="btn func" data-action="percent">%</button>
    <button class="btn op"   data-action="op" data-op="÷">÷</button>
    <!-- Row 2 -->
    <button class="btn" data-action="num" data-num="7">7</button>
    <button class="btn" data-action="num" data-num="8">8</button>
    <button class="btn" data-action="num" data-num="9">9</button>
    <button class="btn op"  data-action="op" data-op="×">×</button>
    <!-- Row 3 -->
    <button class="btn" data-action="num" data-num="4">4</button>
    <button class="btn" data-action="num" data-num="5">5</button>
    <button class="btn" data-action="num" data-num="6">6</button>
    <button class="btn op"  data-action="op" data-op="−">−</button>
    <!-- Row 4 -->
    <button class="btn" data-action="num" data-num="1">1</button>
    <button class="btn" data-action="num" data-num="2">2</button>
    <button class="btn" data-action="num" data-num="3">3</button>
    <button class="btn op"  data-action="op" data-op="+">+</button>
    <!-- Row 5 -->
    <button class="btn zero" data-action="num" data-num="0">0</button>
    <button class="btn" data-action="decimal">.</button>
    <button class="btn op"   data-action="equals">=</button>
  </div>
</div>

<script>
  const resultEl   = document.getElementById('result');
  const exprEl     = document.getElementById('expression');

  let current    = '0';
  let previous   = null;
  let operator   = null;
  let waitingNew = false;
  let lastWasEq  = false;
  let eqPrev     = null;
  let eqOp       = null;

  const MAX_DIGITS = 12;

  function fmt(val) {
    if (typeof val !== 'number') return val;
    if (!isFinite(val)) return val > 0 ? 'Error' : 'Error';
    // Show up to 10 significant figures, trim trailing zeros
    let s = parseFloat(val.toPrecision(10)).toString();
    // If too long, use exponential
    if (s.replace('-','').replace('.','').length > MAX_DIGITS) {
      s = val.toExponential(6);
    }
    return s;
  }

  function display(val) {
    const s = String(val);
    resultEl.textContent = s;
    // Size class
    resultEl.classList.remove('small','xsmall','xxsmall');
    if (s.length > 12) resultEl.classList.add('xxsmall');
    else if (s.length > 9) resultEl.classList.add('xsmall');
    else if (s.length > 6) resultEl.classList.add('small');
  }

  function setExpr(str) {
    exprEl.textContent = str;
  }

  function updateClearBtn() {
    const btn = document.querySelector('[data-action="clear"]');
    btn.textContent = (current === '0' && previous === null && !lastWasEq) ? 'AC' : 'C';
  }

  function compute(a, op, b) {
    const x = parseFloat(a), y = parseFloat(b);
    switch(op) {
      case '+': return x + y;
      case '−': return x - y;
      case '×': return x * y;
      case '÷': return y === 0 ? (x === 0 ? NaN : Infinity) : x / y;
    }
    return y;
  }

  function setActiveOp(op) {
    document.querySelectorAll('.btn.op').forEach(b => b.classList.remove('active'));
    if (op) {
      const btn = document.querySelector(`.btn.op[data-op="${op}"]`);
      if (btn) btn.classList.add('active');
    }
  }

  function handleNum(n) {
    if (lastWasEq) {
      // Start fresh after equals
      previous = null; operator = null; lastWasEq = false;
      setExpr('');
    }
    if (waitingNew) {
      current = n === '0' ? '0' : n;
      waitingNew = false;
    } else {
      if (current === '0' && n !== '.') current = n;
      else if (current.replace('-','').replace('.','').length < MAX_DIGITS) current += n;
    }
    display(current);
    updateClearBtn();
  }

  function handleDecimal() {
    if (lastWasEq) { current = '0'; previous = null; operator = null; lastWasEq = false; setExpr(''); }
    if (waitingNew) { current = '0.'; waitingNew = false; display(current); return; }
    if (!current.includes('.')) {
      current += '.';
      display(current);
    }
    updateClearBtn();
  }

  function handleOp(op) {
    lastWasEq = false;
    // Chain ops
    if (operator && !waitingNew) {
      const res = compute(previous, operator, current);
      const resStr = fmt(res);
      setExpr(resStr + ' ' + op);
      previous = resStr;
      current  = resStr;
      display(resStr);
    } else {
      setExpr(current + ' ' + op);
      previous = current;
    }
    operator   = op;
    waitingNew = true;
    setActiveOp(op);
    updateClearBtn();
  }

  function handleEquals() {
    if (!operator) return;
    let b = waitingNew ? (eqOp === operator && lastWasEq ? String(eqPrev) : current) : current;

    if (lastWasEq) {
      // Repeat last operation
      b = String(eqPrev);
    } else {
      eqPrev = current;
      eqOp   = operator;
    }

    const res = compute(previous, operator, b);
    const resStr = fmt(res);

    const prevDisplay = previous;
    const opSym = operator;
    setExpr(prevDisplay + ' ' + opSym + ' ' + b + ' =');

    previous   = resStr;
    current    = resStr;
    display(resStr);
    setActiveOp(null);
    waitingNew = false;
    lastWasEq  = true;
    operator   = opSym;  // keep for repeat
    updateClearBtn();
  }

  function handleClear() {
    const btn = document.querySelector('[data-action="clear"]');
    if (btn.textContent === 'AC') {
      current = '0'; previous = null; operator = null;
      waitingNew = false; lastWasEq = false; eqPrev = null; eqOp = null;
      setExpr('');
      setActiveOp(null);
    } else {
      current = '0';
      waitingNew = false;
      btn.textContent = 'AC';
    }
    display(current);
  }

  function handleSign() {
    if (current === '0') return;
    current = String(parseFloat(current) * -1);
    // Restore trailing dot if needed
    display(current);
    if (lastWasEq) { previous = current; }
  }

  function handlePercent() {
    const val = parseFloat(current);
    let res;
    if (operator && previous !== null) {
      res = parseFloat(previous) * (val / 100);
    } else {
      res = val / 100;
    }
    current = fmt(res);
    display(current);
    if (lastWasEq) { previous = current; }
  }

  // Event delegation
  document.querySelector('.buttons').addEventListener('click', function(e) {
    const btn = e.target.closest('.btn');
    if (!btn) return;

    // Ripple
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());

    const action = btn.dataset.action;
    switch(action) {
      case 'num':     handleNum(btn.dataset.num); break;
      case 'decimal': handleDecimal(); break;
      case 'op':      handleOp(btn.dataset.op); break;
      case 'equals':  handleEquals(); break;
      case 'clear':   handleClear(); break;
      case 'sign':    handleSign(); break;
      case 'percent': handlePercent(); break;
    }
  });

  // Keyboard support
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') { handleNum(e.key); return; }
    switch(e.key) {
      case '.': case ',':    handleDecimal(); break;
      case '+':              handleOp('+');   break;
      case '-':              handleOp('−');   break;
      case '*':              handleOp('×');   break;
      case '/': e.preventDefault(); handleOp('÷'); break;
      case 'Enter': case '=': handleEquals(); break;
      case 'Backspace':
        if (current.length > 1) current = current.slice(0,-1);
        else current = '0';
        display(current);
        break;
      case 'Escape': case 'Delete': handleClear(); break;
      case '%':              handlePercent(); break;
    }
  });

  display('0');
  updateClearBtn();
</script>
</body>
</html>
